name: Tall Interior manager native 44px source
# Specialized evidence suite: explicit Actions dispatch only; normal PR gates live in the core workflows.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-manager-touch:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tests/tall-interior-manager-44px-browser.mjs
      - run: npm install --no-save playwright@1.56.1 serve@14.2.5
      - run: npx playwright install --with-deps chromium
      - name: Serve source
        run: |
          npx serve . -l 4173 >/tmp/interior-manager-44.log 2>&1 &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/interior-manager-44.log
          exit 1
      - run: node tests/tall-interior-manager-44px-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interior-manager-native-44-evidence
          path: artifacts/tall-interior-manager-44/
          if-no-files-found: warn
