name: Tall-phone camera rail native 44px acceptance
# Specialized evidence suite: explicit Actions dispatch only; normal PR gates live in the core workflows.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-camera:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tests/tall-phone-camera-rail-44px.mjs
      - run: npm install --no-save playwright@1.56.1 serve@14.2.5
      - run: npx playwright install --with-deps chromium
      - name: Serve real app
        run: |
          npx serve . -l 4173 > /tmp/tall-camera-rail-source.log 2>&1 &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/tall-camera-rail-source.log
          exit 1
      - run: node tests/tall-phone-camera-rail-44px.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tall-camera-44px-source
          path: artifacts/tall-phone-camera-rail-44px/
          if-no-files-found: warn
