name: Narrow rainbow swatch touch acceptance
# Specialized evidence suite: explicit Actions dispatch only; normal PR gates live in the core workflows.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tests/narrow-interior-swatch-hitboxes.mjs
      - run: npm install --no-save playwright@1.56.1 serve@14.2.5
      - run: npx playwright install --with-deps chromium
      - name: Serve real app
        run: |
          npx serve . -l 4173 > /tmp/narrow-swatch-serve.log 2>&1 &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/narrow-swatch-serve.log
          exit 1
      - run: node tests/narrow-interior-swatch-hitboxes.mjs
      - name: Retain evidence and failed-state screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roygbiv-narrow-swatch-touch
          path: artifacts/narrow-roygbiv-swatch-hitboxes/
          if-no-files-found: warn
