name: Build logo raster assets
on:
  push:
    branches:
      - main
      - feature/mobile-first-cream-studio
    paths:
      - assets/roygbiv-logo.svg
      - assets/roygbiv-logo-dark.svg
      - assets/roygbiv-logo-cream.svg
      - scripts/build-logo-raster.mjs
      - .github/workflows/logo-raster.yml
  workflow_dispatch:
permissions:
  contents: write
# Serialize branch writes: a newer logo revision must never race another bot push.
concurrency:
  group: logo-raster-${{ github.ref }}
  cancel-in-progress: false
jobs:
  rasterize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Render deterministic 512px PNG logos
        run: node scripts/build-logo-raster.mjs
      - name: Commit raster outputs only for their exact source
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          git add assets/roygbiv-logo-dark.png assets/roygbiv-logo-cream.png
          if git diff --cached --quiet; then
            echo "Raster outputs already match their source."
            exit 0
          fi

          # Another main push can land while Chromium renders. Never commit
          # raster bytes produced from old logo inputs onto newer logo inputs.
          git fetch --no-tags origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          if ! git diff --quiet HEAD "refs/remotes/origin/${TARGET_BRANCH}" -- \
            assets/roygbiv-logo.svg \
            assets/roygbiv-logo-dark.svg \
            assets/roygbiv-logo-cream.svg \
            scripts/build-logo-raster.mjs; then
            echo "::error::Logo source changed during rasterization; refusing stale generated assets. The later push will render its own revision."
            exit 1
          fi

          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Add 512px dark and cream raster logos'
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' rebase "refs/remotes/origin/${TARGET_BRANCH}"
          # A concurrent push after fetch rejects this ordinary fast-forward;
          # never force-push or silently reinterpret its source revision.
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
