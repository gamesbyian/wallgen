name: Mobile source camera rail touch audit
# Specialized evidence suite: explicit Actions dispatch only; normal PR gates live in the core workflows.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  camera-rail-native:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tests/mobile-camera-rail-touch-audit.mjs
      - run: npm install --no-save playwright@1.56.1 serve@14.2.5
      - run: npx playwright install --with-deps chromium
      - name: Serve source app
        run: |
          npx serve . -l 4173 >/tmp/camera-rail-serve.log 2>&1 &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/camera-rail-serve.log
          exit 1
      - run: node tests/mobile-camera-rail-touch-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-camera-rail-touch-evidence
          path: artifacts/mobile-camera-rail-touch/
          if-no-files-found: warn
