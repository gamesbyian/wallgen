name: Promote independently inspected source screenshots

on:
  pull_request:
    paths:
      - 'scripts/promote-reviewed-visual-plates.mjs'
      - '.github/workflows/promote-source-visual-plates.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  promote-reviewed-images:
    # This is a write-enabled, provenance-sensitive operation. Updating its
    # workflow or evidence script must never run promotion by default.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.title, '[promote-reviewed-images]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout the exact same-repository PR head with full ancestry
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Reject changed PR head while promotion is in flight
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
      - name: Download immutable originally inspected real Chromium evidence
        uses: actions/download-artifact@v4
        with:
          run-id: 39527554784
          name: agent1-canonical-live-visual-evidence
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: visual-input
      - name: Verify source freeze, exact screenshot pixel bytes and provenance
        run: node scripts/promote-reviewed-visual-plates.mjs
      - name: Commit original binary screenshots and durable companion deck
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ui-reference/actual-implementation/ docs/ui-reference/ACTUAL-IMPLEMENTATION-COMPANION.md
          if git diff --cached --quiet; then
            echo "Exact reviewed PNGs and companion already committed; no new commit necessary."
          else
            count="$(git diff --cached --name-only | grep -E -c '^docs/ui-reference/actual-implementation/.*\\.png$' || true)"
            test "$count" -eq 32
            git commit -m "docs(visual): preserve 32 verified original browser screenshot assets"
            git push origin "HEAD:refs/heads/${{ github.event.pull_request.head.ref }}"
          fi
