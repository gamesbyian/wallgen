name: One-shot reconstruction #557 genuine optical discriminator
on:
  push:
    branches: [agent1/557-displaced-jagged-coupled-registration-20261024]
    paths: [.github/workflows/agent1-557-optics-once.yml]
permissions:
  contents: read
jobs:
  actual-render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install temporary headless painter dependency
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Generate four unchanged genuine renderer source PNGs
        run: node scripts/review-reconstruction.mjs --out-dir artifacts/r0-source --only 04-jagged,05-hairpin,06-loop,16-offset-jagged
      - name: Evaluate new inference blindly before reading truth
        run: |
          cp -a artifacts/r0-source artifacts/r0-experiment
          node scripts/evaluate-reconstruction-r0.mjs --dir artifacts/r0-experiment
      - name: Evaluate identical source bytes against unmodified current main inverse logic
        run: |
          cp -a artifacts/r0-source artifacts/r0-control
          git show origin/main:src/image-reconstruction.js > src/image-reconstruction.js
          node scripts/evaluate-reconstruction-r0.mjs --dir artifacts/r0-control
      - name: Report before and after errors and protect controls
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const old=JSON.parse(await readFile('artifacts/r0-control/evaluation.json','utf8'));
          const now=JSON.parse(await readFile('artifacts/r0-experiment/evaluation.json','utf8'));
          const rows=now.samples.map((s,i)=>({
            id:s.id,control:old.samples[i].bestError,experiment:s.bestError,
            difference:s.bestError-old.samples[i].bestError,
            baselineKind:old.samples[i].bestKind,newKind:s.bestKind,
            sourceTruthPresentationFloor:s.trueRecipeRenderError
          }));
          const report={source:'identical current renderer metadata-free PNG bytes',
            compared:'same branch except src/image-reconstruction.js restored from main',
            status:'quantified-not-visually-inspected',rows};
          await writeFile('artifacts/r0-comparison.json',
            JSON.stringify(report,null,2)+'\n');
          for(const row of rows)console.log('OPTICAL_COMPARISON '+JSON.stringify(row));
          NODE
      - name: Diagnose actual pigment centroids and inspect source/fit silhouette samples
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          import {chromium} from 'playwright';
          import {HUES} from './src/model.js';
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage();
            for(const id of ['04-jagged','16-offset-jagged','05-hairpin','06-loop']){
              const dir='artifacts/r0-experiment/';
              const source=(await readFile(dir+id+'.r0-source-preview.png')).toString('base64');
              const fit=(await readFile(dir+id+'.r0-best-preview.png')).toString('base64');
              const report=await page.evaluate(async ({source,fit,hues})=>{
                const inspect=async str=>{
                  const data=Uint8Array.from(atob(str),c=>c.charCodeAt(0));
                  const bitmap=await createImageBitmap(new Blob([data],{type:'image/png'}));
                  const canvas=document.createElement('canvas');
                  canvas.width=96;canvas.height=208;
                  const ctx=canvas.getContext('2d',{willReadFrequently:true});
                  ctx.drawImage(bitmap,0,0,96,208);bitmap.close();
                  const rgba=ctx.getImageData(0,0,96,208).data;
                  const cats=new Int8Array(96*208).fill(-1);
                  const stats=Array.from({length:7},()=>({count:0,x:0,y:0,xmin:96,xmax:0,ymin:208,ymax:0}));
                  for(let y=0;y<208;y++)for(let x=0;x<96;x++){
                    const p=(y*96+x)*4,r=rgba[p],g=rgba[p+1],b=rgba[p+2];
                    const high=Math.max(r,g,b),low=Math.min(r,g,b),delta=high-low;
                    if(high<60||delta<55||delta/high<.3)continue;
                    let hue=high===r?((g-b)/delta)%6:high===g?(b-r)/delta+2:(r-g)/delta+4;
                    hue=(hue*60+360)%360;
                    let index=-1,nearest=31;
                    for(let i=0;i<7;i++){
                      const d=Math.abs(hue-hues[i]),dist=Math.min(d,360-d);
                      if(dist<nearest){nearest=dist;index=i;}
                    }
                    if(index<0)continue;
                    cats[y*96+x]=index;
                    const t=stats[index];t.count++;t.x+=x;t.y+=y;
                    t.xmin=Math.min(t.xmin,x);t.xmax=Math.max(t.xmax,x);
                    t.ymin=Math.min(t.ymin,y);t.ymax=Math.max(t.ymax,y);
                  }
                  const map=[];
                  for(let y=0;y<208;y+=6){
                    let line='';
                    for(let x=0;x<96;x+=4){
                      const votes=new Array(7).fill(0);
                      for(let yy=y;yy<Math.min(208,y+6);yy++)
                        for(let xx=x;xx<x+4;xx++){
                          const v=cats[yy*96+xx];
                          if(v>=0)votes[v]++;
                        }
                      const win=Math.max(...votes),index=votes.indexOf(win);
                      line+=win>=7?'ROYGBIV'[index]:'.';
                    }
                    map.push(line);
                  }
                  return {stats:stats.map((v,i)=>({hue:i,pixels:v.count,
                    x:v.count?Math.round(v.x/v.count*10)/10:null,
                    y:v.count?Math.round(v.y/v.count*10)/10:null,
                    box:[v.xmin,v.ymin,v.xmax,v.ymax]})),map};
                };
                const a=await inspect(source),b=await inspect(fit);
                return {source:a.stats,fitted:b.stats,
                  offsets:a.stats.map((v,i)=>({hue:i,
                    dx:v.x!==null&&b.stats[i].x!==null?+(v.x-b.stats[i].x).toFixed(1):null,
                    dy:v.y!==null&&b.stats[i].y!==null?+(v.y-b.stats[i].y).toFixed(1):null})),
                  sample:a.map.map((line,i)=>line+'  '+b.map[i])};
              },{source,fit,hues:HUES});
              console.log('ART_SILHOUETTES '+id+' source | fitted');
              console.log(report.sample.join('\\n'));
              console.log('ART_CENTROIDS '+id+' '+JSON.stringify(report.offsets));
              console.log('ART_SOURCE '+id+' '+JSON.stringify(report.source));
              console.log('ART_FITTED '+id+' '+JSON.stringify(report.fitted));
            }
          }finally{await browser.close();}
          NODE
      - name: Preserve actual source and fitted PNGs for independent visual inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconstruction-557-jagged-paired-current-renderer
          path: |
            artifacts/r0-comparison.json
            artifacts/r0-control/
            artifacts/r0-experiment/
          retention-days: 5
          if-no-files-found: warn
