name: AYA More Real Chromium Acceptance (temporary)
on:
  pull_request:
    paths:
      - 'src/aya-recipe-*.js'
      - 'src/app.js'
      - 'index.html'
      - 'aya-recipe.css'
      - 'scripts/aya-recipe-mobile-acceptance.mjs'
      - '.github/workflows/aya-recipe-mobile-proof.yml'
  workflow_dispatch:
jobs:
  viewport:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - run: npx playwright install --with-deps chromium
      - name: Real Chromium 320/412/500/790 one-screen AYA
        run: node scripts/aya-recipe-mobile-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aya-more-mobile-screens
          path: aya-viewport-*.png
          if-no-files-found: ignore
          retention-days: 3
