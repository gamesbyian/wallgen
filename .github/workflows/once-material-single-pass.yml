name: One-shot material layer single-pass exact pixel and worker speed proof
on:
  push:
    branches:
      - feature/material-texture-single-pass-20261029
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: comparator-baseline
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser client without lockfile
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Pixel-for-pixel main vs candidate and real 372x806 worker times
        run: CHROME_BIN=/usr/bin/google-chrome node scripts/material-single-pass-acceptance.mjs
      - name: Retain image hash and timing proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: material-once-exact-pixels
          path: artifacts/material-once/pixel-proof.json
          if-no-files-found: warn
