name: Independent seeded Focus adversarial browser
# Specialized evidence suite: explicit Actions dispatch only; normal PR gates live in the core workflows.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: seeded-focus-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tests/independent-focus-seeded-exploration.mjs
      - run: npm test
      - run: npm install --no-save playwright@1.56.1 serve@14.2.5
      - run: npx playwright install --with-deps chromium
      - name: Start unmodified production source
        run: |
          npx serve . -l 4173 > /tmp/focus-seeded-server.log 2>&1 &
          for i in $(seq 1 40); do curl -fs http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/focus-seeded-server.log
          exit 1
      - name: Seeded source-backed Focus state exploration
        run: node tests/independent-focus-seeded-exploration.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-focus-seeded-evidence
          path: artifacts/independent-focus-exploratory/
          if-no-files-found: warn
          retention-days: 14
