name: Temporary balanced native seven-hue acceptance
on:
  pull_request:
    paths:
      - 'src/nested-shape-contours.js'
      - 'src/nested-shape-ui.js'
      - '.github/workflows/temporary-balanced-native-art.yml'
permissions:
  contents: read
jobs:
  true-native-balanced-art:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only Chrome renderer and image library
        run: |
          npm install --no-save playwright@1.56.1 pngjs@7
          CHROME_BIN="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$CHROME_BIN" ]; then
            echo "ROYGBIV_CHROMIUM_EXECUTABLE=$CHROME_BIN" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Verify three 3024x6552 Auto-fit balanced image and worker pairs
        run: node scripts/nested-shape-native-autofit-proof.mjs artifacts/nested-autofit-balanced
      - name: Retain native PNGs, recipes and 1:1 artwork
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nested-ink-balanced-native-art
          path: artifacts/nested-autofit-balanced/
          retention-days: 10
