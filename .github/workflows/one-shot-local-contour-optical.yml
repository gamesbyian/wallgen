name: One-shot local pigment contour optical experiment
# Temporary research workflow. Delete before integration.
on:
  pull_request:
    paths:
      - scripts/probe-hue-local-contour-browser.mjs
      - .github/workflows/one-shot-local-contour-optical.yml
permissions:
  contents: read
jobs:
  genuine-art:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Produce current-painter source and baseline editable recipes
        run: |
          node scripts/review-reconstruction.mjs --out-dir artifacts/r0-contour-inset --only 01-vertical-straight,03-wave,04-jagged,05-hairpin,06-loop,11-scattered-circles,16-offset-jagged
          node scripts/evaluate-reconstruction-r0.mjs --dir artifacts/r0-contour-inset --save-best-recipe
      - name: Test real rendered per-hue polygon edge offsets
        run: node scripts/probe-hue-local-contour-browser.mjs artifacts/r0-contour-inset
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r0-pigment-local-contour-inset
          path: artifacts/r0-contour-inset
          retention-days: 7
          if-no-files-found: warn
