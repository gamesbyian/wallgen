# One-shot proof for the bounded Random motif factor optimisation.
# Delete this workflow after measured exact-source comparison.
name: One-off motif stripe factor source parity
on:
  pull_request:
    paths:
      - 'src/renderer.js'
      - 'tests/motif-sample-equivalence.test.js'
      - '.github/workflows/once-motif-stripe-factors.yml'
permissions:
  contents: read
concurrency:
  group: one-motif-factor-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  source-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact original base separately
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: comparator-baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser harness (no download of a second Chromium)
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Show actual system Chromium
        run: |
          command -v google-chrome
          google-chrome --version
      - name: Compare ten canonical designs (direct and worker), fixed slow seed, and native PNG
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/motif-sample-reuse-acceptance.mjs
      - name: Upload bounded exact-pixel and timing proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motif-stripe-factor-paired-proof-${{ github.run_id }}
          path: artifacts/motif-samples/pixel-proof.json
          retention-days: 7
          if-no-files-found: ignore
