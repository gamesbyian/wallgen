# Single-purpose optical and worker timing acceptance. Delete after proof.
name: One-off paired ribbon exact-pixel proof
on:
  pull_request:
    paths:
      - 'src/renderer.js'
      - 'tests/motif-sample-equivalence.test.js'
      - '.github/workflows/once-paired-ribbon-proof.yml'
permissions:
  contents: read
concurrency:
  group: one-ribbon-pair-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  source-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout immutable PR base for exact comparison
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: comparator-baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install harness without lockfile
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Check Chrome installation
        run: google-chrome --version
      - name: Verify independent and paired ribbon arithmetic
        run: node --test tests/motif-sample-equivalence.test.js
      - name: Compare ten original-source real Canvas2D and worker pixels and native PNG
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/motif-sample-reuse-acceptance.mjs
      - name: Store bounded proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-ribbon-proof-${{ github.run_id }}
          path: artifacts/motif-samples/pixel-proof.json
          retention-days: 7
          if-no-files-found: ignore
