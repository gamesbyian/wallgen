name: One-shot private TTF on curved shadowed text
on:
  push:
    branches: [agent3/664-private-ttf-curved-shadow-export-20261024]
    paths: [.github/workflows/agent3-private-curve-once.yml]
permissions:
  contents: read
jobs:
  actual-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tests/agent3-664-private-curved-browser.mjs
      - name: Install small headless Chromium
        run: |
          npm install --no-save playwright@1.56.1 serve@14.2.5
          npx playwright install chromium --only-shell
      - name: Serve real app
        run: |
          npx serve . -l 4173 >/tmp/agent3-private-curve.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/agent3-private-curve.log
          exit 1
      - name: Two-viewport private font + curve + shadow UI and full PNG
        run: node tests/agent3-664-private-curved-browser.mjs
      - name: Keep real screenshots and failed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent3-private-curve-chromium-art
          path: artifacts/agent3-664-private-curved/
          retention-days: 14
          if-no-files-found: warn
