# TEMP focused source art comparison; remove before merge.
name: Temporary Chevron External And Current-Renderer Acceptance
on:
  pull_request:
permissions:
  contents: read
jobs:
  review:
    if: github.head_ref == 'agent/reconstruction-existing-chevron-candidate-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Independent non-ROYGBIV artwork, no invented source truth
        run: |
          node --input-type=module <<'JAVASCRIPT'
          import {chromium} from 'playwright';
          import {mkdir,readFile,writeFile} from 'node:fs/promises';
          const dir='artifacts/r0-chevron-independent';
          await mkdir(dir,{recursive:true});
          const ids=['independent-angular-stripes','independent-soft-waves','independent-colour-islands'];
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage();
            for(const id of ids){
              const svg=await readFile('tests/fixtures/reconstruction-external/'+id+'.svg','utf8');
              const png=await page.evaluate(async text=>{
                const image=new Image();
                image.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(text);
                await image.decode();
                const canvas=document.createElement('canvas');
                canvas.width=480;canvas.height=1040;
                canvas.getContext('2d').drawImage(image,0,0,480,1040);
                return canvas.toDataURL('image/png').split(',')[1];
              },svg);
              await writeFile(dir+'/'+id+'.png',Buffer.from(png,'base64'));
            }
          }finally{await browser.close();}
          await writeFile(dir+'/manifest.json',JSON.stringify({
            schema:'roygbiv-reconstruction-external/v1',
            source:'Self-authored non-ROYGBIV fixture art, no author seed',
            items:ids.map(id=>({id,metadataFree:id+'.png'}))
          },null,2)+'\n');
          JAVASCRIPT
          node scripts/evaluate-reconstruction-r0.mjs --dir artifacts/r0-chevron-independent --alternatives
      - name: Protect verified current R0 Wave, Jagged, Hairpin
        run: |
          node scripts/review-reconstruction.mjs --only 03-wave,04-jagged,05-hairpin --out-dir artifacts/r0-chevron-current
          node scripts/evaluate-reconstruction-r0.mjs --dir artifacts/r0-chevron-current --alternatives
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chevron-external-current-actual-render-study
          path: |
            artifacts/r0-chevron-independent/
            artifacts/r0-chevron-current/
          retention-days: 2
