name: One-off fibre underlay cap contact source/optical proof
on:
  pull_request:
    paths:
      - src/embroidery.js
      - tests/embroidery.test.js
      - scripts/embroidery-fibre-underlay-contact-ab-browser.mjs
      - .github/workflows/once-fibre-underlay-cap-contact.yml
permissions:
  contents: read
jobs:
  fibre-contact:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.title, '[fibre-contact]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: c777a1d7da9982a32f94456f9c863290f57881bd
          path: comparator-baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Focused source and pure geometry tests
        run: |
          node --check src/embroidery.js
          node --check scripts/embroidery-fibre-underlay-contact-ab-browser.mjs
          node --test tests/embroidery.test.js
      - name: Install actual Chromium only for optical source pairs
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Real original-versus-fibre contact, clip, phone and native PNG proof
        run: node scripts/embroidery-fibre-underlay-contact-ab-browser.mjs
      - name: Preserve complete source image-difference receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fibre-underlay-cap-${{ github.run_id }}
          path: artifacts/embroidery-fibre-underlay-contact/
          retention-days: 7
          if-no-files-found: warn
