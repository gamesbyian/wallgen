name: One-shot Stage ROYGBIV Cloudflare Worker Bundles
on:
  pull_request:
    branches: [main]
    paths:
      - 'cloudflare/auth/**'
      - 'cloudflare/mcp/**'
      - 'package.json'
      - '.github/workflows/cloudflare-stage-bundles-one-shot.yml'
permissions:
  contents: write
jobs:
  stage:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run test:cloudflare
      - name: Compile both Cloudflare Workers without deploying
        run: |
          npx wrangler deploy --config cloudflare/auth/wrangler.toml --dry-run --outdir /tmp/roygbiv-auth-built
          npx wrangler deploy --config cloudflare/mcp/wrangler.toml --dry-run --outdir /tmp/roygbiv-mcp-built
          find /tmp/roygbiv-auth-built /tmp/roygbiv-mcp-built -maxdepth 2 -type f -printf '%p %s bytes\n'
      - name: Stage inspected JS bundles for deployment handoff
        run: |
          set -euo pipefail
          mkdir -p cloudflare/staging-bundles
          cp "$(find /tmp/roygbiv-auth-built -maxdepth 2 -type f \( -name '*.js' -o -name '*.mjs' \) | head -1)" cloudflare/staging-bundles/auth.mjs
          cp "$(find /tmp/roygbiv-mcp-built -maxdepth 2 -type f \( -name '*.js' -o -name '*.mjs' \) | head -1)" cloudflare/staging-bundles/mcp.mjs
          node --check cloudflare/staging-bundles/auth.mjs
          node --check cloudflare/staging-bundles/mcp.mjs
          sha256sum cloudflare/staging-bundles/*.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/staging-bundles/*.mjs
          git commit -m "build: stage verified bundled Workers for authenticated Cloudflare handoff"
          git push origin "HEAD:${{ github.head_ref }}"
