name: One-off original-region stitch bounds pixel proof
on:
  pull_request:
    paths:
      - src/embroidery.js
      - scripts/embroidery-region-source-bounds-ab-browser.mjs
      - .github/workflows/once-embroidery-region-bounds.yml
permissions:
  contents: read
jobs:
  source-stitch-proof:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.title, '[region-bounds]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 924e2ab2e005cb65bc77788b56b725399fb64e11
          path: comparator-baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install actual Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate candidate source and focused fixture
        run: |
          node --check src/embroidery.js
          node --check scripts/embroidery-region-source-bounds-ab-browser.mjs
          node --test tests/embroidery.test.js tests/embroidery-chain-contact.test.js tests/thread-contact-shadows.test.js
      - name: Compare real original vs clipped regional Canvas2D ink and native PNG
        run: node scripts/embroidery-region-source-bounds-ab-browser.mjs
      - name: Save source-indexed full pixels and work-volume receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: embroidery-region-bounds-${{ github.run_id }}
          path: artifacts/embroidery-region-bounds/
          retention-days: 7
          if-no-files-found: warn
