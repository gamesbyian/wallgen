name: Independent responsive keyboard focus
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/editor-focus.js'
      - 'tests/independent-responsive-focus-handoff.mjs'
      - '.github/workflows/independent-responsive-focus.yml'
permissions:
  contents: read
concurrency:
  group: independent-responsive-focus-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tests/independent-responsive-focus-handoff.mjs
      - run: npm test
      - run: npm install --no-save playwright@1.56.1 serve@14.2.5
      - run: npx playwright install --with-deps chromium
      - name: Start source app
        run: |
          npx serve . -l 4173 > /tmp/independent-focus-server.log 2>&1 &
          for i in $(seq 1 40); do curl -fs http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/independent-focus-server.log
          exit 1
      - name: Exercise native breakpoint focus and recipe invariants
        run: node tests/independent-responsive-focus-handoff.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-responsive-focus-evidence
          path: artifacts/independent-responsive-focus/
          if-no-files-found: warn
          retention-days: 14
