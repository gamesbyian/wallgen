# Temporary opt-in real PNG study, remove before source merge.
name: TEMP Wave Contour R0 Real-PNG Study
on:
  pull_request:
permissions:
  contents: read
jobs:
  observe:
    if: github.head_ref == 'agent/reconstruction-wave-contour-refinement-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: |
          node scripts/review-reconstruction.mjs --only 01-vertical-straight,02-diagonal-straight,03-wave,04-jagged,05-hairpin,11-scattered-circles --out-dir artifacts/r0-wave-contour
          node scripts/evaluate-reconstruction-r0.mjs --dir artifacts/r0-wave-contour --alternatives
      - uses: actions/upload-artifact@v4
        with:
          name: wave-contour-amplitude-six-current-pngs
          path: artifacts/r0-wave-contour/
          retention-days: 2
