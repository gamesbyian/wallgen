# TEMPORARY six-scene actual-art study. Delete before merging code.
name: Temporary Procedural Challenger PNG Evidence
on:
  pull_request:
permissions:
  contents: read
jobs:
  compare:
    if: github.head_ref == 'agent/reconstruction-structural-challenger-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install opt-in Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Compare true source PNGs, blind structured fitting and low-risk controls
        run: |
          node scripts/review-reconstruction.mjs --only 02-diagonal-straight,03-wave,04-jagged,05-hairpin,06-loop,11-scattered-circles --out-dir artifacts/r0-challenger
          node scripts/evaluate-reconstruction-r0.mjs --dir artifacts/r0-challenger --alternatives
      - name: Preserve all candidate PNGs and exact source recipes
        uses: actions/upload-artifact@v4
        with:
          name: reconstruction-challenger-6
          path: artifacts/r0-challenger/
          retention-days: 2
