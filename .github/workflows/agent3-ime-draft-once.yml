name: One-shot Agent 3 focused text draft and IME composition
on:
  push:
    branches: [agent3/664-composition-draft-focus-20261025]
    paths: [.github/workflows/agent3-ime-draft-once.yml]
permissions:
  contents: read
jobs:
  actual-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: node --check scripts/agent3-ime-draft-browser.mjs
      - name: Minimal headless Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --only-shell
      - name: Real app typing focus and synthetic composition
        run: node scripts/agent3-ime-draft-browser.mjs
      - name: Save visible snapshots on failure or pass
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent3-664-ime-draft-browser
          path: artifacts/agent3-664-ime-draft/
          retention-days: 14
          if-no-files-found: warn
