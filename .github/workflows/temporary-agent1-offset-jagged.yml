# Temporary opt-in source-image evidence. Delete before merge.
name: Temporary Agent1 displaced Jagged R0 study
on:
  pull_request:
permissions:
  contents: read
jobs:
  study:
    if: github.head_ref == 'agent1/reconstruction-jagged-registration-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Blind R0 source / fit with two-axis Jagged and real controls
        run: |
          node scripts/review-reconstruction.mjs --only 02-diagonal-straight,03-wave,04-jagged,14-offset-radial-rays,16-offset-jagged --out-dir artifacts/agent1-offset-jagged
          node scripts/evaluate-reconstruction-r0.mjs --dir artifacts/agent1-offset-jagged --alternatives
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent1-jagged-offset-source-and-fit
          path: artifacts/agent1-offset-jagged/
          retention-days: 2
