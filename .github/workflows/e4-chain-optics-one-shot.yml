name: E4 chain cubic paired Chromium (one-shot)
on:
  pull_request:
    paths:
      - 'src/chain-thread-contacts.js'
      - 'src/embroidery.js'
      - 'tests/embroidery-chain-contact.test.js'
      - '.github/workflows/e4-chain-optics-one-shot.yml'
permissions:
  contents: read
jobs:
  paired-art:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install one dependency tree and Chromium
        working-directory: candidate
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Reuse exact candidate browser dependencies for baseline source
        run: ln -s "$GITHUB_WORKSPACE/candidate/node_modules" "$GITHUB_WORKSPACE/baseline/node_modules"
      - name: Use identical extended optical fixtures with unchanged baseline engine
        run: cp candidate/scripts/embroidery-world-light-browser.mjs baseline/scripts/embroidery-world-light-browser.mjs
      - name: Paint untouched main through real Chromium
        working-directory: baseline
        run: node scripts/embroidery-world-light-browser.mjs
      - name: Paint exact PR head with the same fixtures
        working-directory: candidate
        run: node scripts/embroidery-world-light-browser.mjs
      - name: Verify strict paired change/control scope
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          const a=JSON.parse(readFileSync('baseline/artifacts/embroidery-world-light/manifest.json'));
          const b=JSON.parse(readFileSync('candidate/artifacts/embroidery-world-light/manifest.json'));
          const before=new Map(a.records.map(x=>[x.id,x]));
          const required=new Set(['ribbon-chain-straight-northwest','ribbon-chain-straight-southeast']);
          const allowed=new Set([...required,'ribbon-chain-northwest','ribbon-chain-southeast']);
          assert.equal(before.size,18);
          assert.equal(b.records.length,18);
          const results=[];
          for(const item of b.records){
            const old=before.get(item.id);
            assert.ok(old,'source fixture changed: '+item.id);
            const changed=item.sha256!==old.sha256;
            if(required.has(item.id))assert.equal(changed,true,
              'Actual straight chain must visibly change: '+item.id);
            else if(!allowed.has(item.id))assert.equal(changed,false,
              'Unrelated source artwork changed: '+item.id);
            assert.deepEqual(item.hole,old.hole);
            assert.deepEqual(item.island,old.island);
            results.push({id:item.id,changed,baseMs:old.renderMs,candidateMs:item.renderMs});
          }
          writeFileSync('candidate/artifacts/embroidery-world-light/paired-report.json',
            JSON.stringify({fixture:'original production Canvas2D renderer',
              source:'exact parent SHA vs PR-head, same Chromium browser',
              required:[...required],allowed:[...allowed],results},null,2)+'\\n');
          console.log('CHAIN_CUBIC_PAIRED_ART',JSON.stringify(results));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e4-chain-cubic-paired-pngs
          path: |
            baseline/artifacts/embroidery-world-light/
            candidate/artifacts/embroidery-world-light/
          if-no-files-found: warn
          retention-days: 5
