name: One-shot directional shadow artwork
on:
  pull_request:
    paths:
      - scripts/directional-text-shadow-browser-proof.mjs
permissions:
  contents: read
jobs:
  real-art:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify directional shadow visuals, legacy pixels and worker
        run: node scripts/directional-text-shadow-browser-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: directional-shadow-one-shot
          path: output/directional-text-shadow/
          retention-days: 7
          if-no-files-found: warn
