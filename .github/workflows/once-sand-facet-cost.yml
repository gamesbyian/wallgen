# Disposable source-matched sand facet acceptance; remove before final merge.
name: One-off pinned sand material source parity and timing
on:
  pull_request:
    paths:
      - 'src/sand-material.js'
      - 'src/sand-lighting.js'
      - 'tests/sand-material.test.js'
      - 'tests/sand-lighting.test.js'
      - '.github/workflows/once-sand-facet-cost.yml'
permissions:
  contents: read
concurrency:
  group: one-sand-facet-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  source-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Exact candidate checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Immutable original-main checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: comparator-baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing browser harness
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Exact original grain gauge and diffuse math controls
        run: node --test tests/sand-material.test.js tests/sand-lighting.test.js
      - name: Source-matched pixel parity and seven alternating real worker paints
        env:
          CHROME_BIN: /usr/bin/google-chrome
          ROYGBIV_PERF_TRIALS: '7'
        run: node scripts/motif-sample-reuse-acceptance.mjs
      - name: Save source-matched render receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-sand-facet-proof-${{ github.run_id }}
          path: artifacts/motif-samples/pixel-proof.json
          retention-days: 7
          if-no-files-found: ignore
