name: One-shot Cloudflare Preview Launch Bundle
on:
  pull_request:
    paths:
      - 'cloudflare/mcp/**'
      - '.github/workflows/roygbiv-preview-launch-bundle-once.yml'
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --test tests/cloudflare-preview-launch-pacing.test.js tests/cloudflare-preview-quota.test.js
      - run: npx wrangler deploy --config cloudflare/mcp/wrangler.toml --dry-run --outdir /tmp/mcpbuild
      - run: |
          mkdir -p cloudflare/staging-bundles
          cp /tmp/mcpbuild/index.js cloudflare/staging-bundles/mcp.mjs
          node --check cloudflare/staging-bundles/mcp.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/staging-bundles/mcp.mjs
          git commit -m "build: stage 429 launch pacing fix"
          git push origin "HEAD:${{ github.head_ref }}"
