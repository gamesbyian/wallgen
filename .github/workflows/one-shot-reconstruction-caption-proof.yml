name: One-shot real Chromium caption/source-fit witness
# TEMPORARY proof workflow: delete from PR before final merge; leave only the
# opt-in reusable script. Never run a permanent heavy browser PR matrix.
on:
  pull_request:
    paths:
      - 'scripts/reconstruction-caption-source-browser-proof.mjs'
      - '.github/workflows/one-shot-reconstruction-caption-proof.yml'
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install temporary Playwright browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Inspect actual captioned source and worker PNGs
        run: node scripts/reconstruction-caption-source-browser-proof.mjs
      - name: Preserve actual source/with-caption PNGs and machine report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-shot-caption-source-fit-pixels
          path: artifacts/reconstruction-caption-source-chromium/
          retention-days: 7
          if-no-files-found: warn
