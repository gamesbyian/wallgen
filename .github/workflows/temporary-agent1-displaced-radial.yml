# TEMP, remove before merge
name: Temporary Agent1 displaced radial R0
on:
  pull_request:
permissions:
  contents: read
jobs:
  study:
    if: github.head_ref == 'agent1/reconstruction-displaced-production-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: |
          node scripts/review-reconstruction.mjs --only 08-radial-rays,09-radial-rings,14-offset-radial-rays,15-offset-radial-rings --out-dir artifacts/agent1-displaced
          node scripts/evaluate-reconstruction-r0.mjs --dir artifacts/agent1-displaced --alternatives
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent1-displaced-source-and-fit
          path: artifacts/agent1-displaced/
          retention-days: 2
