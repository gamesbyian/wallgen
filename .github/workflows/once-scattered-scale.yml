name: One-shot scattered proportional scale browser acceptance
on:
  pull_request:
    paths:
      - 'src/scattered-scale-gesture.js'
      - 'src/app.js'
      - 'scattered-shapes.css'
      - 'scripts/scattered-scale-browser.mjs'
      - '.github/workflows/once-scattered-scale.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/scattered-scale-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scattered-scale-two-phone-evidence
          path: artifacts/scattered-scale/
          retention-days: 14
          if-no-files-found: warn
