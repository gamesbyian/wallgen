name: Native crowded Drawn anchor finger selection
on:
  pull_request:
    paths:
      - src/draw-path-ui.js
      - tests/mobile-crowded-drawn-finger-select.mjs
      - .github/workflows/mobile-crowded-drawn-finger-select.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  two-close-anchors:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tests/mobile-crowded-drawn-finger-select.mjs
      - run: npm install --no-save playwright@1.56.1 serve@14.2.5
      - run: npx playwright install --with-deps chromium
      - name: Serve real source
        run: |
          npx serve . -l 4173 >/tmp/crowded-drawn.log 2>&1 &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/crowded-drawn.log
          exit 1
      - run: node tests/mobile-crowded-drawn-finger-select.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-crowded-drawn-finger-evidence
          path: artifacts/crowded-drawn-finger-select/
          if-no-files-found: warn
