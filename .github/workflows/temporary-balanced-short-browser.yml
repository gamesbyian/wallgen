name: Temporary balanced Auto-fit 320px browser acceptance
on:
  pull_request:
    paths:
      - 'src/nested-shape-contours.js'
      - 'src/nested-shape-ui.js'
      - '.github/workflows/temporary-balanced-short-browser.yml'
permissions:
  contents: read
jobs:
  short-portrait-undo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare actual Chromium with test-only Playwright
        run: |
          npm install --no-save playwright@1.56.1
          CHROME_BIN="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$CHROME_BIN" ]; then
            echo "ROYGBIV_CHROMIUM_EXECUTABLE=$CHROME_BIN" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Actually edit/nest/Auto-fit/move/reframe/Undo at 320x700
        run: node scripts/nested-shape-short-portrait-browser-proof.mjs
      - name: Retain real 320px control and artwork PNGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nested-balanced-short-portrait-browser
          path: artifacts/nested-short-portrait/
          retention-days: 10
