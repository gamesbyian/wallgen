name: Mobile image-import source touch acceptance
on:
  pull_request:
    paths:
      - image-path.css
      - tests/mobile-image-import-hitcells.mjs
      - .github/workflows/mobile-image-import-hitcells.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tests/mobile-image-import-hitcells.mjs
      - run: npm install --no-save playwright@1.56.1 serve@14.2.5
      - run: npx playwright install --with-deps chromium
      - name: Serve real app
        run: |
          npx serve . -l 4173 >/tmp/image-import-hitcells.log 2>&1 &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/image-import-hitcells.log
          exit 1
      - run: node tests/mobile-image-import-hitcells.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-import-native-44px-evidence
          path: artifacts/mobile-image-import-hitcells/
          if-no-files-found: warn
