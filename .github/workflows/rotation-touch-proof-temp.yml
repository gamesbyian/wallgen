name: Temporary precision rotation real-browser acceptance
on:
  pull_request:
    paths:
      - 'src/rotation-gesture.js'
      - 'src/rotation-scrubber.js'
      - 'tests/rotation-scrubber-browser.mjs'
      - '.github/workflows/rotation-touch-proof-temp.yml'
permissions:
  contents: read
jobs:
  rotation-touch-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Real Chrome input at 320x700 and 412x892
        run: |
          export CHROME_BIN="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          node tests/rotation-scrubber-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: precision-rotation-touch-actual-browser
          path: artifacts/rotation-touch/
          if-no-files-found: ignore
          retention-days: 7
