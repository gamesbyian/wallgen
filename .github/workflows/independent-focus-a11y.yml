name: Independent Focus and accessibility adversarial QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/editor-focus.js'
      - 'editor-focus.css'
      - 'mobile-editor-rail.css'
      - 'studio-themes.css'
      - 'index.html'
      - 'src/mobile-*.js'
      - 'src/mobile-preview-tools.js'
      - 'tests/independent-focus-a11y-acceptance.mjs'
      - 'tests/independent-svg-candidates-acceptance.mjs'
      - 'tests/independent-focus-transitions.mjs'
      - 'tests/independent-axe-diagnostic.mjs'
      - 'assets/icons/roygbiv/manifest.json'
      - 'assets/icons/roygbiv/state-matrix.html'
      - '.github/workflows/independent-focus-a11y.yml'

concurrency:
  group: independent-focus-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focus-adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check tests/independent-focus-a11y-acceptance.mjs
          node --check tests/independent-svg-candidates-acceptance.mjs
          node --check tests/independent-focus-transitions.mjs
          node --check tests/independent-axe-diagnostic.mjs
      - run: npm test
      - run: npm install --no-save playwright@1.56.1 serve@14.2.5 axe-core@4.10.3
      - run: npx playwright install --with-deps chromium
      - name: Serve source UI
        run: |
          npx serve . -l 4173 > /tmp/focus-serve.log 2>&1 &
          for i in $(seq 1 40); do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/focus-serve.log
          exit 1
      - name: Execute independent Focus/All Chromium negative journeys
        run: node tests/independent-focus-a11y-acceptance.mjs
      - name: Negative lock, viewport, Colour and motion transition journeys
        run: node tests/independent-focus-transitions.mjs
      - name: Independently probe eight source-exact candidate icons at 20/24/28px
        run: node tests/independent-svg-candidates-acceptance.mjs
      - name: Capture independent WCAG automated diagnostics without falsely certifying accessibility
        run: node tests/independent-axe-diagnostic.mjs
      - name: Preserve measurements and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-focus-adversarial-evidence
          path: |
            artifacts/independent-focus-qa/
            artifacts/independent-svg-qa/
            artifacts/independent-focus-transitions/
            artifacts/independent-axe-audit/
          retention-days: 14
          if-no-files-found: warn
