# Temporary real-Chromium exact-source performance and optical comparison.
# Remove from PR after evidence; ordinary required quick check must then pass.
name: One-off paint material constants source parity
on:
  pull_request:
    paths:
      - 'src/renderer.js'
      - 'tests/render-surface-lifecycle.test.js'
      - '.github/workflows/once-texture-constants-proof.yml'
permissions:
  contents: read
concurrency:
  group: once-paint-material-constants-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  source-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout immutable PR base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: comparator-baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install shared browser harness without repository lockfile
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Verify render-only factors leave public scene uncached
        run: node --test tests/render-surface-lifecycle.test.js tests/motif-sample-equivalence.test.js
      - name: Real Chrome exact art + nine alternating worker paint trials
        env:
          CHROME_BIN: /usr/bin/google-chrome
          ROYGBIV_PERF_TRIALS: '9'
        run: node scripts/motif-sample-reuse-acceptance.mjs
      - name: Upload source-matched pixel/performance receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paint-material-constants-proof-${{ github.run_id }}
          path: artifacts/motif-samples/pixel-proof.json
          retention-days: 7
          if-no-files-found: ignore
