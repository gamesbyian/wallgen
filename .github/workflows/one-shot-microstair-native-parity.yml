name: One-shot microstair native 19.8MP worker parity
# Opt-in heavy browser acceptance; delete before merge.
on:
  pull_request:
    paths:
      - .github/workflows/one-shot-microstair-native-parity.yml
permissions:
  contents: read
jobs:
  native-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Disposable browser and PNG image decoder, not app dependency
        run: |
          npm install --no-save playwright@1.56.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Genuine source image to 7 canonical smoothable hues, 19.8MP worker and reference
        run: |
          node scripts/reconstruction-contour-fullres-browser-proof.mjs \
            artifacts/microstair-19m-native
      - name: Preserve real 3024 by 6552 PNG pairs and source/metadata report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: microstair-hairpin-loop-native-reference-worker-proof
          path: artifacts/microstair-19m-native
          if-no-files-found: warn
          retention-days: 7
