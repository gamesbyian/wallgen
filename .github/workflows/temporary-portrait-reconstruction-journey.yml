# TEMPORARY on-demand evidence job only on this branch. Delete before merge.
name: Temporary Portrait Reconstruction End-to-End Acceptance
on:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    if: github.head_ref == 'agent/reconstruction-real-import-journey-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install opt-in Chromium only
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Produce one authentic current Wave PNG and metadata-free image
        run: node scripts/review-reconstruction.mjs --only 03-wave --out-dir artifacts/r0-journey-source
      - name: Start read-only local Pages-style development server
        run: |
          python3 -m http.server 8712 --bind 127.0.0.1 >/tmp/wallgen-journey-server.log 2>&1 &
          echo $! > /tmp/wallgen-journey-server.pid
      - name: Real 412x892 touch Chromium image import, Undo, PNG metadata roundtrip
        run: |
          node scripts/check-reconstruction-journey.mjs \
            --url http://127.0.0.1:8712 \
            --source artifacts/r0-journey-source/03-wave.no-metadata.png \
            --out-dir artifacts/r0-journey-proof
      - name: Archive portrait screenshot, authentic PNG and JSON/metadata receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconstruction-portrait-actual-journey
          path: |
            artifacts/r0-journey-proof/
            /tmp/wallgen-journey-server.log
          retention-days: 2
