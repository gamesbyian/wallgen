# Temporary, PR-only two-viewport browser evidence. REMOVE BEFORE MERGE.
name: TEMP Agent3 rail swipe browser evidence
on:
  pull_request:
    paths:
      - 'src/mobile-swipes.js'
      - 'src/mobile-tool-sequence.js'
      - 'tests/agent3-portrait-swipes-escape.mjs'
      - '.github/workflows/agent3-temp-rail-browser.yml'
permissions:
  contents: read
jobs:
  rail-swipe-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1 serve@14.2.5
      - run: npx playwright install --with-deps chromium
      - run: |
          npx serve . -l 4173 >/tmp/roygbiv-browser.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/roygbiv-browser.log
          exit 1
      - run: node tests/agent3-portrait-swipes-escape.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent3-rail-swipe-browser-evidence
          path: artifacts/agent3-portrait-swipes-escape/
          retention-days: 7
          if-no-files-found: warn
