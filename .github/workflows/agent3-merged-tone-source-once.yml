name: Agent 3 merged Tone source-import proof (temporary)
on:
  pull_request:
    paths:
      - tests/agent3-664-refusal-matrix-browser.mjs
      - .github/workflows/agent3-merged-tone-source-once.yml
permissions:
  contents: read
jobs:
  source-portrait:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium for single acceptance
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve actual app
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/agent3-merged-tone-http.log 2>&1 &
          sleep 2
      - name: Generate independent metadata-free source artworks
        run: |
          node scripts/review-reconstruction-external-pigments.mjs --collection gapped-hue --out-dir artifacts/agent3-refusal-sources-gapped
          node scripts/review-reconstruction-external-pigments.mjs --collection low-chroma --out-dir artifacts/agent3-refusal-sources-low
          node scripts/review-reconstruction-external-pigments.mjs --collection sparse-hue --out-dir artifacts/agent3-refusal-sources-sparse
      - name: Check 14 real import journeys on merged Tone source in two portrait sizes
        run: node tests/agent3-664-refusal-matrix-browser.mjs
      - name: Retain actual artwork and Chromium review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent3-merged-tone-portrait-source
          path: artifacts/agent3-664-refusal-matrix
          retention-days: 7
          if-no-files-found: warn
