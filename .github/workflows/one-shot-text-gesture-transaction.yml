name: Temporary Chromium text gesture concurrency witness
# One-shot pull request evidence, remove workflow before merge.
on:
  pull_request:
    paths:
      - scripts/text-gesture-transaction-browser-proof.mjs
      - .github/workflows/one-shot-text-gesture-transaction.yml
permissions:
  contents: read
jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise real portrait app pointer transaction and export
        run: node scripts/text-gesture-transaction-browser-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: text-gesture-transaction-chromium-evidence
          path: artifacts/text-gesture-transaction-browser/
          if-no-files-found: warn
          retention-days: 7
