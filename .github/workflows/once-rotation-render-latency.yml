name: One-shot R3 rotation preview latency
on:
  push:
    branches:
      - research/rotation-render-latency-20261029
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser client without persisting lockfile
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Measure actual Chrome event to frame milestones
        run: CHROME_BIN=/usr/bin/google-chrome node scripts/rotation-latency-browser.mjs
      - name: Export measured latency JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roygbiv-rotation-latency
          path: artifacts/rotation-latency/chromium.json
          if-no-files-found: warn
