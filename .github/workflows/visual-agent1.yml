name: Agent 1 canonical/live visual comparisons
on:
  pull_request:
    paths:
      - 'scripts/visual-reference-audit-agent1.mjs'
      - 'scripts/visual-setting-row-census-agent1.mjs'
      - 'scripts/visual-narrow-desktop-range-agent1.mjs'
      - '.github/workflows/visual-agent1.yml'
      - 'docs/ui-reference/*.svg'
      # All owning production presentation surfaces. An attractive PR should
      # never evade the real browser atlas merely by changing CSS alone.
      - 'styles.css'
      - 'studio-themes.css'
      - 'mobile-compact.css'
      - 'mobile-five-nav.css'
      - 'mobile-more-groups.css'
      - 'mobile-editor-rail.css'
      - 'editor-redesign.css'
      - 'editor-setting-rows.css'
      - 'editor-material-status.css'
      - 'detail-controls.css'
      - 'image-path.css'
      - 'draw-path.css'
      - 'ui-audit-fixes.css'
      - 'index.html'
      - 'assets/icons/roygbiv/*.svg'
      - 'assets/icons/roygbiv/state-matrix.html'
      - 'src/ui-icon-drawings-*.js'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visual-agent1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  live-plates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate independent evidence script
        run: |
          node --check scripts/visual-reference-audit-agent1.mjs
          node --check scripts/visual-setting-row-census-agent1.mjs
          node --check scripts/visual-narrow-desktop-range-agent1.mjs
      - name: Install browser dependencies
        run: |
          npm install --no-save playwright@1.56.1 serve@14.2.5
          npx playwright install --with-deps chromium
      - name: Launch real application
        run: |
          npx serve . -l 4173 > /tmp/visual-agent1-server.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/visual-agent1-server.log
          exit 1
      - name: Capture paired real Chromium/reference states
        run: node scripts/visual-reference-audit-agent1.mjs
      - name: Census all reachable source setting rows in real Chromium
        run: node scripts/visual-setting-row-census-agent1.mjs
      - name: Upload 12-plate comparison gallery and measured geometry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent1-canonical-live-visual-evidence
          path: artifacts/visual-agent1/
          retention-days: 14
          if-no-files-found: warn

  narrow-desktop-sliders:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source slider audit
        run: node --check scripts/visual-narrow-desktop-range-agent1.mjs
      - name: Install Chromium for real source geometry
        run: |
          npm install --no-save playwright@1.56.1 serve@14.2.5
          npx playwright install --with-deps chromium
      - name: Serve original UI
        run: |
          npx serve . -l 4173 >/tmp/visual-narrow-sliders.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/visual-narrow-sliders.log
          exit 1
      - name: Qualify source slider tracks in 13 viewport profiles and both themes
        run: node scripts/visual-narrow-desktop-range-agent1.mjs
      - name: Preserve live numeric evidence and source screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent1-narrow-desktop-slider-geometry
          path: |
            artifacts/visual-agent1/narrow-desktop-range-audit.json
            artifacts/visual-agent1/range-screens/
          retention-days: 14
          if-no-files-found: warn
