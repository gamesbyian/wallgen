name: One-shot Hosted ROYGBIV Browser Bundle
on:
  push:
    branches: [feature/hosted-mcp-private-png-preview-20261027]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false --no-audit --no-fund
      - run: npm run test:cloudflare
      - run: npx wrangler deploy --dry-run --config cloudflare/mcp/wrangler.toml --outdir ./artifacts/hosted-preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-browser-preview-dryrun
          path: artifacts/hosted-preview/
          retention-days: 3
