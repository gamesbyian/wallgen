name: One-shot independent source contour AA acceptance
# Explicit research-only external pixels, no production/workflow default CI.
on:
  pull_request:
    paths:
      - .github/workflows/one-shot-external-contour-ab.yml
permissions:
  contents: read
jobs:
  authored-pixels:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Disposable browser/PNG reader for independently authored source art
        run: |
          npm install --no-save playwright@1.56.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Generate original, muted, sparse and skipped hue independent graphics once
        run: |
          for collection in original low-chroma sparse-hue gapped-hue; do
            node scripts/review-reconstruction-external-pigments.mjs \
              --collection "$collection" --out-dir "artifacts/independent-contour-$collection"
            cp -a "artifacts/independent-contour-$collection" \
              "artifacts/independent-legacy-$collection"
          done
      - name: Actual current source-aware inverse fit, no source truth exists
        run: |
          for collection in original low-chroma sparse-hue gapped-hue; do
            node scripts/evaluate-reconstruction-r0.mjs \
              --dir "artifacts/independent-contour-$collection" --save-best-recipe --source-signature
          done
      - name: Existing inverse fit with source-only contour AA turned off in the disposable runner
        run: |
          cp src/image-hue-reconstruction.js /tmp/current-source-hue-with-AA.js
          node --input-type=module -e '
            import {readFileSync,writeFileSync} from "node:fs";
            const p="src/image-hue-reconstruction.js",s=readFileSync(p,"utf8");
            const needle="const SOURCE_VISIBLE_ANTI_ALIAS_INSET_PX=0.2;";
            if(s.split(needle).length!==2)throw Error("Unexpected source AA calibration");
            writeFileSync(p,s.replace(needle,"const SOURCE_VISIBLE_ANTI_ALIAS_INSET_PX=0;"));
          '
          for collection in original low-chroma sparse-hue gapped-hue; do
            node scripts/evaluate-reconstruction-r0.mjs \
              --dir "artifacts/independent-legacy-$collection" --save-best-recipe --source-signature
          done
          cp /tmp/current-source-hue-with-AA.js src/image-hue-reconstruction.js
      - name: Compare exact same separately authored source PNGs, preserve unsupported refusals
        run: |
          for collection in original low-chroma sparse-hue gapped-hue; do
            node scripts/evaluate-source-contour-ab.mjs \
              "artifacts/independent-contour-$collection" \
              "artifacts/independent-legacy-$collection"
          done
      - name: Save both source/fit PNGs, canonical hypotheses and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independently-authored-contour-AA-optical-AB
          path: |
            artifacts/independent-contour-*
            artifacts/independent-legacy-*
          if-no-files-found: warn
          retention-days: 7
