name: One-shot paired sand-layer performance acceptance
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/once-sand-layer-perf.yml]
permissions:
  contents: read
concurrency:
  group: once-sand-layer-perf-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install matching browser dependency
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Evaluate current production source
        run: node scripts/sand-multilayer-performance.mjs > /tmp/current-sand-perf.log
      - name: Evaluate accepted baseline in same installed Chromium
        env:
          BASE_SHA: f64720cec0a5cb4fcafc17950903a0cb40dc696a
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/sand-before-reuse"
          git worktree add --detach "$BASE" "$BASE_SHA"
          cp scripts/sand-multilayer-performance.mjs "$BASE/scripts/sand-multilayer-performance.mjs"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$BASE/node_modules"
          (cd "$BASE" && node scripts/sand-multilayer-performance.mjs > /tmp/previous-sand-perf.log)
      - name: Enforce source-art equality and report paired timing distributions
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          const previous=JSON.parse(readFileSync(join(process.env.RUNNER_TEMP,
            'sand-before-reuse/artifacts/sand-layer-performance/measurements.json'),'utf8'));
          const current=JSON.parse(readFileSync(
            'artifacts/sand-layer-performance/measurements.json','utf8'));
          assert.equal(previous.results.length,5);
          assert.deepEqual(previous.results.map(x=>x.name),current.results.map(x=>x.name));
          const comparison=[];
          for(let i=0;i<current.results.length;i++){
            const a=previous.results[i],b=current.results[i];
            assert.equal(a.sha256,b.sha256,'Real PNG pixels differ for '+a.name);
            assert.equal(a.styles,b.styles,'Canonical material layer count differs');
            assert.equal(a.rings,3);
            assert.equal(b.rings,3);
            const ratio=a.medianGeometryMs/b.medianGeometryMs;
            const renderRatio=a.medianRenderMs/b.medianRenderMs;
            comparison.push({scene:a.name,sourceSha256:a.sha256,
              oldGeometryMs:a.medianGeometryMs,newGeometryMs:b.medianGeometryMs,
              geometryRatio:ratio,oldRenderMs:a.medianRenderMs,
              newRenderMs:b.medianRenderMs,renderRatio});
          }
          const report={previousSha:'f64720cec0a5cb4fcafc17950903a0cb40dc696a',
            candidateSha:process.env.GITHUB_SHA,
            note:'All 5 actual 600x1300 Chromium source PNGs byte-identical; performance numbers are paired single-run distributions, not phone speed guarantees',
            comparison};
          writeFileSync('artifacts/sand-layer-performance/paired-comparison.json',
            JSON.stringify(report,null,2)+'\n');
          console.log('SOURCE_MATCHED_SAND_MULTI_LAYER_PASS',JSON.stringify(report));
          NODE
      - name: Upload current and baseline proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roygbiv-sand-layer-performance
          path: artifacts/sand-layer-performance/
          retention-days: 7
          if-no-files-found: warn
