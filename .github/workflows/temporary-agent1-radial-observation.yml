# TEMP single-session genuine source/fit study. Delete before any merge.
name: Temporary Agent1 radial actual-image review
on:
  pull_request:
permissions:
  contents: read
jobs:
  study:
    if: github.head_ref == 'agent1/reconstruction-radial-observation-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Real present-day canonical renderers, blind R0 import
        run: |
          node scripts/review-reconstruction.mjs --only 06-loop,07-drawn,08-radial-rays,09-radial-rings,10-regions-nested,13-holed-shape --out-dir artifacts/agent1-radial-study
          node scripts/evaluate-reconstruction-r0.mjs --dir artifacts/agent1-radial-study --alternatives
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent1-radial-genuine-source-and-blind-fit
          path: artifacts/agent1-radial-study/
          retention-days: 2
