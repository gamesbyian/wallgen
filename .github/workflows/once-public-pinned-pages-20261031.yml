name: Once actual public pinned Pages release verification
on:
  pull_request:
    paths:
      - .github/workflows/once-public-pinned-pages-20261031.yml
permissions:
  contents: read
jobs:
  verify-public:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare deployed root and trusted subtree against pinned Git blobs
        run: |
          set -euo pipefail
          PIN="$(node -p "require('./cloudflare/mcp/trusted-renderer-release.json').commit")"
          ROOT='https://gamesbyian.github.io/wallgen'
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 \\
            "$ROOT/roygbiv-render-version.json" -o /tmp/root-version.json
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 \\
            "$ROOT/trusted-renderer/roygbiv-render-version.json" -o /tmp/trusted-version.json
          node --input-type=module -e "
            import fs from 'node:fs';
            const root=JSON.parse(fs.readFileSync('/tmp/root-version.json'));
            const trusted=JSON.parse(fs.readFileSync('/tmp/trusted-version.json'));
            const expected=JSON.parse(fs.readFileSync('cloudflare/mcp/trusted-renderer-release.json')).commit;
            if(trusted.commit!==expected||!(/^[a-f0-9]{40}$/).test(root.commit))
              throw Error('Actual public Pages version marker mismatch');
            console.log('PUBLISHED_APP_SHA',root.commit);
            console.log('PUBLISHED_TRUSTED_RENDER_SHA',trusted.commit);
          "
          git fetch --no-tags --depth=1 origin "$PIN"
          for path in src/renderer.js src/model.js src/typography-fonts.js assets/fonts/manifest.json render-host.html; do
            file="$(mktemp)"
            curl --fail --silent --show-error --location --retry 5 --retry-delay 2 \\
              "$ROOT/trusted-renderer/$path" -o "$file"
            expected="$(git show "$PIN:$path" | sha256sum | cut -d' ' -f1)"
            actual="$(sha256sum "$file" | cut -d' ' -f1)"
            test "$expected" = "$actual" || { echo "PUBLIC BYTE MISMATCH $path" >&2; exit 1; }
            echo "PUBLISHED_FILE_SHA256_PASS $path $actual"
            rm "$file"
          done
