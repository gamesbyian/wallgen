# Temporary optical acceptance lane for PR #935; remove before merge.
name: Sand cap material optical acceptance (one-shot)
on:
  push:
    branches:
      - feat/sand-normal-cap-lighting-20261031
    paths:
      - .github/workflows/sand-cap-optical-once.yml
permissions:
  contents: read
concurrency:
  group: sand-cap-proof-935
  cancel-in-progress: true
jobs:
  real-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated renderer proof dependency
        run: npm install --no-save playwright
      - name: Install headless Chromium with system dependencies
        run: npx playwright install --with-deps chromium
      - name: Render and assert original sand source matched art
        run: node scripts/sand-contour-browser-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sand-cap-lit-visuals
          path: artifacts/sand-contour-browser/
          if-no-files-found: warn
          retention-days: 7
