name: One-shot full size private TTF export proof
on:
  pull_request:
    paths:
      - 'scripts/private-font-19mp-browser-proof.mjs'
      - '.github/workflows/private-font-19mp-acceptance-once.yml'
permissions:
  contents: read
jobs:
  imported-font:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser and actual open-licensed TTF fixture
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-dejavu-core
      - name: Validate real app 19.8 MP PNG with user-imported font
        run: node scripts/private-font-19mp-browser-proof.mjs
      - name: Preserve original full resolution private-font sample and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-ttf-real-19mp-png
          path: output/private-font-19mp/
          if-no-files-found: ignore
          retention-days: 4
