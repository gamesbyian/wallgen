name: One-shot Agent MCP Integration Proof

on:
  push:
    branches: [feat/agent-headless-mcp]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-mcp-real-render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout head
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install MCP and renderer packages
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate JavaScript syntax and actual stdio-to-native-PNG journey
        env:
          ROYGBIV_AGENT_RENDER_SMOKE: '1'
          ROYGBIV_AGENT_NATIVE_SMOKE: '1'
          ROYGBIV_AGENT_OUTPUT_DIR: ${{ runner.temp }}/roygbiv-agent-export
        run: |
          node --check src/agent-api.js
          node --check scripts/roygbiv-mcp.mjs
          node --test tests/agent-api.test.js tests/agent-mcp-stdio.test.js
