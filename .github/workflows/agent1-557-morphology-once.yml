name: One-shot optional morphology diagnostic acceptance
on:
  push:
    branches: [agent1/557-optin-edt-medial-axis-diagnostics-20261025]
    paths: [.github/workflows/agent1-557-morphology-once.yml]
permissions:
  contents: read
jobs:
  offline-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install separately pinned optional offline scientific libraries
        run: |
          python -m pip install --disable-pip-version-check -r docs/reconstruction-diagnostics-requirements.txt
      - name: Exercise representative source-only morphology contracts
        run: python -m unittest discover -s tests -p test_reconstruction_topology.py -v
      - name: Verify no app or default CI dependencies were added
        run: |
          test -f scripts/inspect-reconstruction-topology.py
          test -f docs/reconstruction-diagnostics-requirements.txt
          test -f tests/test_reconstruction_topology.py
