name: Agent 1 temporary nonclassic reconstruction optical study
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: agent1-palette-study-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  genuine-current-painter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser test tools (opt-in one-shot)
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Generate real source PNGs with separate truth and unchanged IDAT
        run: |
          node scripts/review-reconstruction.mjs --only 01-vertical-straight,11-scattered-circles,19-jewel-vertical,20-pastel-seven-circles --out-dir artifacts/agent1-palette
      - name: Blind actual current-renderer reconstruction and comparison
        run: |
          node scripts/evaluate-reconstruction-r0.mjs --dir artifacts/agent1-palette
      - name: Upload source/fitted PNG pairs and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent1-palette-source-and-fit
          path: artifacts/agent1-palette/
          retention-days: 10
          if-no-files-found: warn
