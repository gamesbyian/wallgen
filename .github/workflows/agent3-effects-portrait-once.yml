name: One-shot Agent 3 directional-shadow and two-tone portrait UI
on:
  push:
    branches: [agent3/664-directional-outline-ui-portrait-20261025]
    paths: [.github/workflows/agent3-effects-portrait-once.yml, scripts/agent3-effects-portrait-browser.mjs]
permissions:
  contents: read
jobs:
  real-editor-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/agent3-effects-portrait-browser.mjs
      - name: Minimal Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --only-shell
      - name: Actual two-viewport Text controls and PNG download
        run: node scripts/agent3-effects-portrait-browser.mjs
      - name: Retain actual screenshots after pass or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent3-664-effects-portrait-one-shot
          path: artifacts/agent3-664-effects/
          retention-days: 14
          if-no-files-found: warn
