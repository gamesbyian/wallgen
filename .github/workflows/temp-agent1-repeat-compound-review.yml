name: Temporary Agent1 Repeated Compound Native R0 Review
on:
  pull_request:
    paths:
      - 'scripts/review-reconstruction.mjs'
      - '.github/workflows/temp-agent1-repeat-compound-review.yml'
permissions:
  contents: read
jobs:
  real-compound-r0:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install actual Chromium for canonical production renders
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Produce genuine current scene sources with separate truth
        run: node scripts/review-reconstruction.mjs --only 17-repeated-hue-circles,18-repeated-compound-hole-island --out-dir artifacts/agent1-repeat-r0
      - name: Blind reconstruct and compare with the ordinary production painter
        run: node scripts/evaluate-reconstruction-r0.mjs --dir artifacts/agent1-repeat-r0 --alternatives
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent1-native-compound-repeat-source-fit
          path: artifacts/agent1-repeat-r0/
          retention-days: 2
