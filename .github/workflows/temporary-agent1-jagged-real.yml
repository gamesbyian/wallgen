# TEMP opt-in authenticity study. Delete from PR before any merge.
name: Temporary Agent1 jagged production PNG review
on:
  pull_request:
permissions:
  contents: read
jobs:
  study:
    if: github.head_ref == 'agent1/reconstruction-jagged-registration-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Real current-renderer metadata-free Jagged controls
        run: |
          node scripts/review-reconstruction.mjs --only 02-diagonal-straight,03-wave,04-jagged,05-hairpin,07-drawn,14-offset-radial-rays --out-dir artifacts/agent1-jagged-real
          node scripts/evaluate-reconstruction-r0.mjs --dir artifacts/agent1-jagged-real --alternatives
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent1-jagged-source-and-fit
          path: artifacts/agent1-jagged-real/
          retention-days: 2
