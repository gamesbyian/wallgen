name: Private font import one-shot proof
on:
  pull_request:
    paths:
      - 'scripts/local-font-browser-proof.mjs'
      - '.github/workflows/local-font-acceptance-once.yml'
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium and OS font fixture
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-dejavu-core
      - name: Test true TTF import, worker parity, persistence and missing-font refusal
        run: node scripts/local-font-browser-proof.mjs
      - name: Preserve visual and measurable acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-font-actual-browser
          path: output/local-font-proof/
          if-no-files-found: ignore
          retention-days: 5
