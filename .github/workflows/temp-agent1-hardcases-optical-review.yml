name: Temporary Agent1 Current Native Hardcase Source Fit Review
on:
  pull_request:
    paths:
      - '.github/workflows/temp-agent1-hardcases-optical-review.yml'
permissions:
  contents: read
  actions: read
jobs:
  six-native-hardcases:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare opt-in current painter
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Load existing immutable genuine-current PNG inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/winding artifacts/radial
          gh run download 40040643861 --repo "$GITHUB_REPOSITORY" --name agent1-winding-source-and-fit --dir artifacts/winding
          gh run download 40037559465 --repo "$GITHUB_REPOSITORY" --name agent1-displaced-source-and-fit --dir artifacts/radial
          test -f artifacts/winding/04-jagged.no-metadata.png
      - name: Re-evaluate jagged Hairpin Loop Draw Wave and displaced Jagged
        run: node scripts/evaluate-reconstruction-r0.mjs --dir artifacts/winding --alternatives
      - name: Re-evaluate displaced radial actual source PNGs
        run: node scripts/evaluate-reconstruction-r0.mjs --dir artifacts/radial --alternatives
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent1-hardcases-current-canonical-review
          path: artifacts/
          retention-days: 2
