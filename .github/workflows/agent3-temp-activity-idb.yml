# One-shot PR evidence, delete before merge.
name: TEMP Agent3 actual IndexedDB browser acceptance
on:
  pull_request:
    paths:
      - 'tests/agent3-activity-idb-browser.mjs'
      - '.github/workflows/agent3-temp-activity-idb.yml'
permissions:
  contents: read
jobs:
  idb-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1 serve@14.2.5
      - run: npx playwright install --with-deps chromium
      - run: |
          npx serve . -l 4173 > /tmp/agent3-idb.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/agent3-idb.log
          exit 1
      - run: node tests/agent3-activity-idb-browser.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent3-idb-browser-summary
          path: artifacts/agent3-activity-idb-browser/summary.json
          retention-days: 7
          if-no-files-found: warn
