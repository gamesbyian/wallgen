# TEMPORARY one-shot UI evidence, removed before merge. Do not add routine screenshots.
name: TEMP Recon Portrait Explanation Acceptance
on:
  pull_request:
permissions:
  contents: read
jobs:
  portrait:
    if: github.head_ref == 'agent/reconstruction-concise-portrait-explanation-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node scripts/review-reconstruction.mjs --only 03-wave --out-dir artifacts/r0-why-source
      - run: |
          python3 -m http.server 8712 --bind 127.0.0.1 >/tmp/roygbiv-why-server.log 2>&1 &
      - run: |
          node scripts/check-reconstruction-journey.mjs --url http://127.0.0.1:8712 \
            --source artifacts/r0-why-source/03-wave.no-metadata.png \
            --out-dir artifacts/r0-why-proof
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconstruction-readable-portrait-why-proof
          path: artifacts/r0-why-proof/
          retention-days: 2
