name: One-shot vector overlap node acceptance
on:
  pull_request:
    paths:
      - 'src/vector-overlap-cycle.js'
      - 'src/vector-draw-ui.js'
      - 'scripts/vector-overlap-cycle-browser.mjs'
      - '.github/workflows/once-vector-overlap.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/vector-overlap-cycle-browser.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vector-node-overlap-evidence
          path: artifacts/vector-overlap-cycle/
          if-no-files-found: ignore
