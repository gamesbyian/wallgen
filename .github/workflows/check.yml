name: Validate Wallgen
on:
  pull_request:
  workflow_dispatch:
    inputs:
      depth:
        description: 'Quick sanity checks or full Node test suite (opt-in)'
        type: choice
        required: true
        default: quick
        options: [quick, full]
permissions:
  contents: read
concurrency:
  group: quick-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Basic app and recipe sanity
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.depth != 'full' }}
        run: npm run check:quick
      # Temporary three-picture Photo appearance probe, removed before PR #512 merges.
      - name: Install Chromium for one-time deep-black negative art proof
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/deep-black-negative-photo-20261022' }}
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Render original, legacy negative and new deep-black negative
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/deep-black-negative-photo-20261022' }}
        run: node scripts/review-photo-looks.mjs --focus-deep-black --out-dir artifacts/deep-black-photo-proof
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/deep-black-negative-photo-20261022' }}
        with:
          name: one-time-deep-black-film-photo-proof
          path: artifacts/deep-black-photo-proof/
          retention-days: 7
      - name: Full Node suite (manual request only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.depth == 'full' }}
        run: npm run check
