name: Validate Wallgen
on:
  pull_request:
  workflow_dispatch:
    inputs:
      depth:
        description: 'Quick sanity checks or full Node test suite (opt-in)'
        type: choice
        required: true
        default: quick
        options: [quick, full]
permissions:
  contents: read
concurrency:
  group: quick-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Basic app and recipe sanity
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.depth != 'full' }}
        run: npm run check:quick
      - name: Full Node suite (manual request only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.depth == 'full' }}
        run: npm run check

  photo-diffusion-one-shot:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/photo-opt-in-wide-halation-20261022' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium for three real artwork samples
        run: |
          npm install --no-save playwright pngjs
          npx playwright install --with-deps chromium
      - name: Render three actual ROYGBIV PNGs
        run: node scripts/review-photo-looks.mjs --focus-diffusion --out-dir artifacts/photo-diffusion
      - name: Measure optical spill against original art
        run: |
          node --input-type=module <<'JS'
          import {PNG} from 'pngjs';
          import {readFileSync} from 'node:fs';
          const root='artifacts/photo-diffusion/';
          const load=id=>PNG.sync.read(readFileSync(root+id+'.png')).data;
          const original=load('00-original'),narrow=load('04-warm-halation'),
            wide=load('11-wide-warm-diffusion');
          let dark=0,narrowGlow=0,wideGlow=0,changedNarrow=0,changedWide=0;
          let nr=0,wr=0,sourceBrightness=0;
          for(let i=0;i<original.length;i+=4){
            sourceBrightness+=original[i]+original[i+1]+original[i+2];
            if(original[i]>2||original[i+1]>2||original[i+2]>2)continue;
            dark++;
            const n=Math.max(0,narrow[i]-original[i]),w=Math.max(0,wide[i]-original[i]);
            nr+=n;wr+=w;
            if(n>4)narrowGlow++;
            if(w>4)wideGlow++;
            if(n>0)changedNarrow++;
            if(w>0)changedWide++;
          }
          console.log(JSON.stringify({width:600,height:1300,darkPixels:dark,
            sourceChannelSum:sourceBrightness,
            classic:{redGainOnBlack:nr,glowingDarkPixels:narrowGlow,changedDarkPixels:changedNarrow},
            diffusion:{redGainOnBlack:wr,glowingDarkPixels:wideGlow,changedDarkPixels:changedWide}},null,2));
          if(!(wideGlow>narrowGlow&&wr>nr))throw Error('Wide art effect not distinguished from classic');
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: photo-diffusion-three-real-wallpapers
          path: artifacts/photo-diffusion/
          retention-days: 7
