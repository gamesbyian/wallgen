name: Validate Wallgen
on:
  pull_request:
  workflow_dispatch:
    inputs:
      depth:
        description: 'Quick sanity checks or full Node test suite (opt-in)'
        type: choice
        required: true
        default: quick
        options: [quick, full]
permissions:
  contents: read
concurrency:
  group: quick-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Basic app and recipe sanity
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.depth != 'full' }}
        run: npm run check:quick
      - name: Full Node suite (manual request only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.depth == 'full' }}
        run: npm run check

      # ONE-OFF ART-REVIEW PROBE. Remove from this branch after saving the
      # seven-picture evidence. Never merge these steps into main.
      - name: One-time Chromium setup for seven-picture Photo review
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'review/photo-one-shot-20261022' }}
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: One-time seven-picture production Photo review
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'review/photo-one-shot-20261022' }}
        run: node scripts/review-photo-looks.mjs --out-dir artifacts/photo-review
      - name: Preserve Photo review images as GitHub Actions artifact
        if: ${{ always() && github.event_name == 'pull_request' && github.head_ref == 'review/photo-one-shot-20261022' }}
        uses: actions/upload-artifact@v4
        with:
          name: one-time-photo-art-review
          path: artifacts/photo-review/
          retention-days: 7
          if-no-files-found: warn
