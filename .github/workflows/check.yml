name: Validate Wallgen
on:
  pull_request:
  workflow_dispatch:
    inputs:
      depth:
        description: 'Quick sanity checks or full Node test suite (opt-in)'
        type: choice
        required: true
        default: quick
        options: [quick, full]
permissions:
  contents: read
concurrency:
  group: quick-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Basic app and recipe sanity
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.depth != 'full' }}
        run: npm run check:quick
      - name: Full Node suite (manual request only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.depth == 'full' }}
        run: npm run check

      # TEMPORARY FIRST-PARTY ART PROOF FOR #529: delete before merge.
      - name: One-off actual ROYGBIV fibre wallpapers
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 529 }}
        run: |
          npm install --no-save playwright
          npx playwright install chromium
          node scripts/review-embroidery.mjs --focus-fibre --out-dir artifacts/fibre-art
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage();
          for(const id of ['00-ribbon-plain','01-ribbon-satin','12-ribbon-satin-fibre','03-regions-plain','04-regions-tatami','13-region-tatami-fibre']){
            const buffer=await readFile('artifacts/fibre-art/'+id+'.png');
            const payload=await page.evaluate(async base64=>{
              const img=new Image();
              await new Promise((ok,fail)=>{img.onload=ok;img.onerror=fail;
                img.src='data:image/png;base64,'+base64;});
              const canvas=document.createElement('canvas');
              canvas.width=240;canvas.height=520;
              canvas.getContext('2d').drawImage(img,0,0,240,520);
              return canvas.toDataURL('image/png').split(',')[1];
            },buffer.toString('base64'));
            console.log('ART_THUMB_'+id+'='+payload);
          }
          await browser.close();
          NODE
      - name: Archive one-off actual fibre PNG comparisons
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 529 }}
        uses: actions/upload-artifact@v4
        with:
          name: fibre-review-real-pngs
          path: artifacts/fibre-art/
          retention-days: 7
