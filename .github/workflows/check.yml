name: Validate Wallgen
on:
  pull_request:
  workflow_dispatch:
    inputs:
      depth:
        description: 'Quick sanity checks or full Node test suite (opt-in)'
        type: choice
        required: true
        default: quick
        options: [quick, full]
permissions:
  contents: read
concurrency:
  group: quick-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Basic app and recipe sanity
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.depth != 'full' }}
        run: npm run check:quick
      # One-time compound geometry visual proof, removed before PR #519 merge.
      - name: Install Chromium for compound geometry proof
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'tools/compound-hole-embroidery-art-proof-20261022' }}
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Render imported cutout with and without Tatami
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'tools/compound-hole-embroidery-art-proof-20261022' }}
        run: node scripts/review-embroidery.mjs --focus-compound --out-dir artifacts/compound-hole-proof
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'tools/compound-hole-embroidery-art-proof-20261022' }}
        with:
          name: one-time-embroidery-compound-hole-proof
          path: artifacts/compound-hole-proof/
          retention-days: 7
      - name: Full Node suite (manual request only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.depth == 'full' }}
        run: npm run check
