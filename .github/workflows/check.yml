name: Validate Wallgen
on:
  pull_request:
  workflow_dispatch:
    inputs:
      depth:
        description: 'Quick sanity checks or full Node test suite (opt-in)'
        type: choice
        required: true
        default: quick
        options: [quick, full]
permissions:
  contents: read
concurrency:
  group: quick-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Basic app and recipe sanity
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.depth != 'full' }}
        run: npm run check:quick
      # TEMPORARY PR-only material-art evidence. Delete before merge.
      - name: Temporary Agent 2 actual Chain wallpaper comparison
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          npm install --no-save playwright
          npx playwright install chromium
          node scripts/review-embroidery.mjs --focus-chain --out-dir /tmp/agent2-chain-art
      - name: Upload temporary Chain comparison pictures
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent2-chain-art
          path: /tmp/agent2-chain-art/
          retention-days: 2
      - name: Temporary Agent 2 mixed-material / thread / Photo pictures
        if: ${{ github.event_name == 'pull_request' }}
        run: node scripts/agent2-temp-stack-art.mjs /tmp/agent2-stack-art
      - name: Upload temporary material/thread/Photo combinations
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent2-material-thread-photo-art
          path: /tmp/agent2-stack-art/
          retention-days: 2
      - name: Full Node suite (manual request only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.depth == 'full' }}
        run: npm run check
