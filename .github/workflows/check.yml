name: Validate Wallgen
on:
  pull_request:
  workflow_dispatch:
    inputs:
      depth:
        description: 'Quick sanity checks or full Node test suite (opt-in)'
        type: choice
        required: true
        default: quick
        options: [quick, full]
permissions:
  contents: read
concurrency:
  group: quick-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Basic app and recipe sanity
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.depth != 'full' }}
        run: npm run check:quick
      # One-time final actual UI control rectangles for PR #521.
      - name: Install Chromium for Thread portrait bounds proof
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'tools/thread-portrait-two-screen-review-20261022' }}
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Capture four compact Thread UI states
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'tools/thread-portrait-two-screen-review-20261022' }}
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/thread-server.log 2>&1 &
          node scripts/review-thread-portrait.mjs --out-dir artifacts/thread-final-rectangles
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'tools/thread-portrait-two-screen-review-20261022' }}
        with:
          name: thread-final-mobile-four-states
          path: artifacts/thread-final-rectangles/
          retention-days: 7
      - name: Full Node suite (manual request only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.depth == 'full' }}
        run: npm run check
