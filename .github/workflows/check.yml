name: Validate Wallgen
on:
  pull_request:
  workflow_dispatch:
    inputs:
      depth:
        description: 'Quick sanity checks or full Node test suite (opt-in)'
        type: choice
        required: true
        default: quick
        options: [quick, full]
permissions:
  contents: read
concurrency:
  group: quick-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Basic app and recipe sanity
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.depth != 'full' }}
        run: npm run check:quick
      - name: Full Node suite (manual request only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.depth == 'full' }}
        run: npm run check
      # TEMP PHOTO ART/ALLOCATION PROOF for PR #573 only. REMOVE before merge.
      - name: TEMP focused actual ROYGBIV Film and Camera stream proof
        if: ${{ github.head_ref == 'agent3/photo-source-art-parity-20261023' }}
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node scripts/review-photo-looks.mjs --focus-stream-parity --verify-stream --out-dir artifacts/photo-stream-parity
      - name: TEMP focused source-picture artifact
        if: ${{ github.head_ref == 'agent3/photo-source-art-parity-20261023' }}
        uses: actions/upload-artifact@v4
        with:
          name: photo-stream-parity-four
          path: artifacts/photo-stream-parity/
          retention-days: 2
