name: Validate Wallgen
on:
  pull_request:
  workflow_dispatch:
    inputs:
      depth:
        description: 'Quick sanity checks or full Node test suite (opt-in)'
        type: choice
        required: true
        default: quick
        options: [quick, full]
permissions:
  contents: read
concurrency:
  group: quick-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Basic app and recipe sanity
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.depth != 'full' }}
        run: npm run check:quick
      - name: Full Node suite (manual request only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.depth == 'full' }}
        run: npm run check

  camera-flash-one-shot:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/camera-pocket-flash-20261022' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser for three image comparisons
        run: |
          npm install --no-save playwright pngjs
          npx playwright install chromium
      - name: Render untreated, HDR and compact-flash ROYGBIV art
        run: node scripts/review-photo-looks.mjs --focus-flash --out-dir artifacts/camera-flash
      - name: Measure flash on real art and verify black substrate
        run: |
          node --input-type=module <<'JS'
          import {PNG} from 'pngjs';
          import {readFileSync} from 'node:fs';
          const root='artifacts/camera-flash/';
          const source=PNG.sync.read(readFileSync(root+'00-original.png'));
          const flash=PNG.sync.read(readFileSync(root+'12-pocket-flash.png'));
          const hdr=PNG.sync.read(readFileSync(root+'05-smartphone-hdr.png'));
          const totals={center:{n:0,flashGain:0,hdrGain:0},edge:{n:0,flashGain:0,hdrGain:0}};
          let originalBlack=0,keptBlack=0;
          for(let y=0;y<source.height;y++)for(let x=0;x<source.width;x++){
            const i=(y*source.width+x)*4;
            const s=source.data[i]+source.data[i+1]+source.data[i+2];
            const f=flash.data[i]+flash.data[i+1]+flash.data[i+2];
            const h=hdr.data[i]+hdr.data[i+1]+hdr.data[i+2];
            if(s===0){originalBlack++;if(f===0)keptBlack++;}
            const dx=(x+.5)/source.width*2-1,dy=(y+.5)/source.height*2-1;
            const distance=dx*dx*.40+dy*dy*.60;
            const band=distance<.17?'center':distance>.62?'edge':null;
            if(band&&s>140&&s<650){
              totals[band].n++;totals[band].flashGain+=(f-s)/3;
              totals[band].hdrGain+=(h-s)/3;
            }
          }
          for(const t of Object.values(totals)){
            t.flashGainPerPixel=t.flashGain/t.n;
            t.hdrGainPerPixel=t.hdrGain/t.n;
          }
          console.log(JSON.stringify({size:[source.width,source.height],originalBlack,keptBlack,totals},null,2));
          if(originalBlack!==keptBlack)throw Error('Direct flash must preserve exact black source pixels');
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: camera-pocket-flash-three-real-wallpapers
          path: artifacts/camera-flash/
          retention-days: 7
