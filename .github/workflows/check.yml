name: Validate Wallgen
on:
  pull_request:
  workflow_dispatch:
    inputs:
      depth:
        description: 'Quick sanity checks or full Node test suite (opt-in)'
        type: choice
        required: true
        default: quick
        options: [quick, full]
permissions:
  contents: read
concurrency:
  group: quick-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Basic app and recipe sanity
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.depth != 'full' }}
        run: npm run check:quick
      - name: Full Node suite (manual request only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.depth == 'full' }}
        run: npm run check

      # Disposable three-image materials evidence. Never merge into main.
      - name: One-shot linen distortion sweep Chromium setup
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'review/linen-three-displacements-once' }}
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: One-shot render linen at fixed seed with 0, 20 and 68 distortion
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'review/linen-three-displacements-once' }}
        run: |
          mkdir -p artifacts/linen-sweep
          node --input-type=module <<'JS'
          import {writeFile} from 'node:fs/promises';
          import {normalizeRecipe} from './src/model.js';
          const common={
            family:'studio',structure:'paths',orientation:'diagonal',geometry:'wave',
            motif:'solid',outline:'none',palette:'classic',background:'white',
            textureCoverage:'both',textureScale:43,textureStrength:72,
            lightingMood:'off',seed:'material-study-rose',material:'linen'
          };
          for(const d of [0,20,68]){
            const recipe=normalizeRecipe({...common,textureDisplacement:d});
            await writeFile('artifacts/linen-sweep/linen-'+d+'.recipe.json',
              JSON.stringify(recipe,null,2)+'\n');
          }
          JS
          for d in 0 20 68; do
            npm run render -- --recipe "artifacts/linen-sweep/linen-${d}.recipe.json" --width 480 --height 1040 --out "artifacts/linen-sweep/linen-${d}.png"
          done
      - name: Preserve one-shot linen displacement comparison
        if: ${{ always() && github.event_name == 'pull_request' && github.head_ref == 'review/linen-three-displacements-once' }}
        uses: actions/upload-artifact@v4
        with:
          name: one-time-linen-distortion-sweep
          path: artifacts/linen-sweep/
          retention-days: 7
          if-no-files-found: warn
