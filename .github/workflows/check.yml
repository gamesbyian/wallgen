name: Validate Wallgen
on:
  pull_request:
  workflow_dispatch:
    inputs:
      depth:
        description: 'Quick sanity checks or full Node test suite (opt-in)'
        type: choice
        required: true
        default: quick
        options: [quick, full]
permissions:
  contents: read
concurrency:
  group: quick-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Basic app and recipe sanity
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.depth != 'full' }}
        run: npm run check:quick
      - name: Full Node suite (manual request only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.depth == 'full' }}
        run: npm run check
      # TEMP R0 integration acceptance for #589, remove before merge.
      - name: TEMP five real reconstruction baseline preservation cases
        if: ${{ github.head_ref == 'agent3/reconcile-diagonal-and-radial-20261023' }}
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node scripts/review-reconstruction.mjs --only 02-diagonal-straight,08-radial-rays,09-radial-rings,10-regions-nested,11-scattered-circles --out-dir artifacts/reconstruction-integration-589
          node scripts/evaluate-reconstruction-r0.mjs --dir artifacts/reconstruction-integration-589
      - name: TEMP preserve five original and inferred PNGs
        if: ${{ github.head_ref == 'agent3/reconcile-diagonal-and-radial-20261023' }}
        uses: actions/upload-artifact@v4
        with:
          name: r0-diagonal-radial-integration-589
          path: artifacts/reconstruction-integration-589/
          retention-days: 2
