name: Validate Wallgen
on:
  pull_request:
  workflow_dispatch:
    inputs:
      depth:
        description: 'Quick sanity checks or full Node test suite (opt-in)'
        type: choice
        required: true
        default: quick
        options: [quick, full]
permissions:
  contents: read
concurrency:
  group: quick-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Basic app and recipe sanity
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.depth != 'full' }}
        run: npm run check:quick
      # Three optical images, this PR only. Revert the probe before merging.
      - name: Install Chromium for opt-in optical artwork review
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/dslr-optical-acutance-photo-20261022' }}
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Render untreated, Natural and new lens Photo
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/dslr-optical-acutance-photo-20261022' }}
        run: node scripts/review-photo-looks.mjs --focus-lens --out-dir artifacts/dslr-optics
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/dslr-optical-acutance-photo-20261022' }}
        with:
          name: one-time-dslr-optical-three-images
          path: artifacts/dslr-optics/
          retention-days: 7
      - name: Full Node suite (manual request only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.depth == 'full' }}
        run: npm run check
