name: Validate Wallgen
on:
  pull_request:
  workflow_dispatch:
    inputs:
      depth:
        description: 'Quick sanity checks or full Node test suite (opt-in)'
        type: choice
        required: true
        default: quick
        options: [quick, full]
permissions:
  contents: read
concurrency:
  group: quick-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Basic app and recipe sanity
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.depth != 'full' }}
        run: npm run check:quick
      - name: Full Node suite (manual request only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.depth == 'full' }}
        run: npm run check

  agent3-664-browser-one-shot:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent3/664-independent-portrait-acceptance-20261024' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax before Playwright
        run: |
          node --check tests/agent3-current-accessible-names-browser.mjs
          node --check tests/agent3-664-typography-browser.mjs
      - name: Install bounded Chromium tooling (one shot only)
        run: |
          npm install --no-save playwright@1.56.1 serve@14.2.5
          npx playwright install chromium --only-shell
      - name: Serve canonical app
        run: |
          npx serve . -l 4173 >/tmp/agent3-664-serve.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/agent3-664-serve.log
          exit 1
      - name: Current UI accessible names and focus
        run: node tests/agent3-current-accessible-names-browser.mjs
      - name: Private TTF, text controls, Undo and visible PNG
        run: node tests/agent3-664-typography-browser.mjs
      - name: Independent full creation to saved PNG
        run: node tests/mobile-full-source-create-to-png.mjs
      - name: Consent-gated IndexedDB recording and deletion
        run: node tests/agent3-activity-idb-browser.mjs
      - name: Preserve isolated browser evidence, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent3-664-browser-one-shot
          path: |
            artifacts/agent3-664-names/
            artifacts/agent3-664-typography/
            artifacts/mobile-complete-creation-export/
            artifacts/agent3-activity-idb-browser/
          retention-days: 14
          if-no-files-found: warn
