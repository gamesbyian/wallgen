# Temporary, evidence-only browser gate for PR #866. Remove after accepting.
name: One-shot vector-axis touch Chromium acceptance
on:
  pull_request:
    paths:
      - 'scripts/vector-axis-touch-browser.mjs'
      - 'src/axis-constrained-drag.js'
      - 'src/draw-path-ui.js'
      - '.github/workflows/once-vector-axis-touch.yml'
permissions:
  contents: read
jobs:
  vector-axis-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate browser script and gesture helpers
        run: |
          node --check scripts/vector-axis-touch-browser.mjs
          node --test tests/axis-constrained-drag.test.js tests/path-point-editor.test.js
      - name: Install Playwright Chromium for one real-browser journey
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise 320x700 and 412x892 actual pointer journeys
        run: node scripts/vector-axis-touch-browser.mjs
      - name: Upload inspected graphics and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vector-axis-browser-evidence
          path: artifacts/vector-axis-touch/
          retention-days: 7
          if-no-files-found: warn
