name: UI state screenshot atlas

# Specialized evidence suite: explicit Actions dispatch only; normal PR gates live in the core workflows.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Full four-zoom desktop/mobile atlas, or quick smoke'
        type: choice
        required: true
        default: full
        options:
          - full
          - smoke
concurrency:
  group: ui-atlas-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ATLAS_MODE: ${{ github.event_name == 'pull_request' && 'smoke' || inputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate atlas JavaScript
        run: |
          node --check scripts/capture-ui-atlas.mjs
          node --check scripts/ui-atlas-special.mjs
          node --check scripts/ui-atlas-report.mjs
          node --check scripts/ui-atlas-inspect.mjs
          node --check scripts/ui-atlas-geometry.mjs
          node --check scripts/ui-atlas-mobile-smoke-plan.mjs
          node --test tests/ui-atlas-geometry.test.js tests/ui-atlas-mobile-smoke-plan.test.js
      - run: npm install --no-save playwright@1.56.1 serve@14.2.5
      - run: npx playwright install --with-deps chromium
      - name: Serve local app
        run: |
          npx serve . -l 4173 > /tmp/roygbiv-serve.log 2>&1 &
          for i in $(seq 1 40); do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/roygbiv-serve.log
          exit 1
      - name: Independent gallery, More, and recipe transport acceptance
        run: |
          node --check tests/redesign-navigation-acceptance.mjs
          node tests/redesign-navigation-acceptance.mjs
      - name: Upload independent acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roygbiv-agent3-acceptance
          path: artifacts/agent3-acceptance/
          retention-days: 14
          if-no-files-found: warn
      - name: Independent Interior selection and full-range browser acceptance
        run: |
          node --check tests/redesign-interior-browser-acceptance.mjs
          node tests/redesign-interior-browser-acceptance.mjs
      - name: Upload independent Interior integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roygbiv-agent3-interior-integration
          path: artifacts/agent3-interior-integration/
          retention-days: 14
          if-no-files-found: warn
      - name: Capture UI atlas
        run: |
          if [ "$ATLAS_MODE" = 'smoke' ]; then
            node scripts/capture-ui-atlas.mjs --smoke
            # Additional bounded touch/mobile screenshot check. Unlike the
            # full atlas, this covers a representative seven-category subset,
            # Focus, material states, theme and nav at 412x892.
            node scripts/capture-ui-atlas.mjs --mobile-smoke --out=artifacts/ui-atlas/mobile-smoke
          else
            node scripts/capture-ui-atlas.mjs
          fi
      - name: Upload screenshot gallery, manifest and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roygbiv-ui-atlas
          path: artifacts/ui-atlas/
          retention-days: 14
          if-no-files-found: warn
