name: One-shot genuine Hairpin Loop full-resolution exports
# TEMPORARY heavy browser proof, delete from PR after passing.
on:
  pull_request:
    paths:
      - scripts/reconstruction-contour-fullres-browser-proof.mjs
      - .github/workflows/one-shot-contour-fullres-parity.yml
permissions:
  contents: read
jobs:
  fullres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Disposable browser and PNG pixel parser
        run: |
          npm install --no-save playwright@1.56.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Actually reconstruct and render both 3024x6552 direct/worker
        run: |
          node scripts/reconstruction-contour-fullres-browser-proof.mjs \
            artifacts/contour-hairpin-loop-fullres
      - name: Retain actual reference/worker images and source/metadata proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contour-hairpin-loop-19813248px-reference-worker
          path: artifacts/contour-hairpin-loop-fullres
          retention-days: 7
          if-no-files-found: warn
