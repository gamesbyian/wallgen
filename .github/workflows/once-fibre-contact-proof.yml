name: One-shot real fibre source-contact optical proof
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/once-fibre-contact-proof.yml]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install matched Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Render candidate real 600x1300 wallpapers
        run: node scripts/thread-contact-optical-proof.mjs
      - name: Render accepted previous main with the SAME scene fixture
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/thread-before-fibre"
          git worktree add --detach "$BASE" fcfb5ef8fd67e624745c9b051aace174aa86243d
          cp scripts/thread-contact-optical-proof.mjs "$BASE/scripts/thread-contact-optical-proof.mjs"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$BASE/node_modules"
          (cd "$BASE" && node scripts/thread-contact-optical-proof.mjs)
          mkdir -p artifacts/fibre-optical-proof/baseline
          cp "$BASE/artifacts/thread-contact-optics/"*.png artifacts/fibre-optical-proof/baseline/
      - name: Require real fibre contact effect with exact unchanged controls
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync,mkdirSync} from 'node:fs';
          import {join} from 'node:path';
          const a=JSON.parse(readFileSync(join(process.env.RUNNER_TEMP,
            'thread-before-fibre/artifacts/thread-contact-optics/report.json'),'utf8'));
          const b=JSON.parse(readFileSync('artifacts/thread-contact-optics/report.json','utf8'));
          assert.equal(a.records.length,12);
          assert.deepEqual(a.records.map(x=>x.name),b.records.map(x=>x.name));
          const fibreLit=new Set(['fibre-over-nw','fibre-under-nw',
            'fibre-weave-nw','fibre-tatami-over-nw']);
          const changed=[],preserved=[];
          for(let i=0;i<b.records.length;i++){
            const before=a.records[i],after=b.records[i];
            if(fibreLit.has(after.name)){
              assert.notEqual(after.sha256,before.sha256,
                'Exact source fibre underlay contact not visible: '+after.name);
              changed.push(after.name);
            }else{
              assert.equal(after.sha256,before.sha256,
                'Previously accepted satin or unlit control changed: '+after.name);
              preserved.push(after.name);
            }
          }
          assert.equal(changed.length,4);
          assert.equal(preserved.length,8);
          const summary={baseline:'fcfb5ef8fd67e624745c9b051aace174aa86243d',
            candidate:process.env.GITHUB_SHA,changed,preserved,
            environment:'One Linux Chromium, actual production 600x1300 pixels, not Pixel hardware'};
          mkdirSync('artifacts/fibre-optical-proof',{recursive:true});
          writeFileSync('artifacts/fibre-optical-proof/paired.json',
            JSON.stringify(summary,null,2)+'\n');
          console.log('FIBRE_THREAD_CONTACT_SOURCE_MATCH_PASS',JSON.stringify(summary));
          NODE
      - name: Upload actual paired source images and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fibre-contact-original-renderer-proof
          path: |
            artifacts/thread-contact-optics/
            artifacts/fibre-optical-proof/
          retention-days: 7
          if-no-files-found: warn
