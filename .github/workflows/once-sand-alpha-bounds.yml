name: One-off movable sand ink-alpha crop whole-cache A-B
on:
  pull_request:
    paths:
      - 'src/renderer.js'
      - 'scripts/sand-ink-alpha-bounds-ab-browser.mjs'
      - '.github/workflows/once-sand-alpha-bounds.yml'
permissions:
  contents: read
jobs:
  exact-crop:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.title, '[sand-alpha-crop]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact original base in separate immutable worktree
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach comparator-baseline "$CI_BASE_SHA"
          test "$(git -C comparator-baseline rev-parse HEAD)" = "$CI_BASE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check diagnostic source
        run: node --check scripts/sand-ink-alpha-bounds-ab-browser.mjs
      - name: Source-matched eleven-scene full nudge-cache A-B plus native PNG
        run: node scripts/sand-ink-alpha-bounds-ab-browser.mjs
      - name: Preserve quantitative proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movable-sand-alpha-bounds-${{ github.run_id }}
          path: artifacts/sand-stripes-ink-alpha-crop-ab/
          retention-days: 7
          if-no-files-found: warn
