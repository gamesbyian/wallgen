name: One-off movable sand ink-alpha crop whole-cache A-B
on:
  pull_request:
    paths:
      - 'scripts/sand-ink-alpha-bounds-ab-browser.mjs'
      - '.github/workflows/once-sand-alpha-bounds.yml'
permissions:
  contents: read
jobs:
  exact-crop:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.title, '[sand-alpha-crop]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check diagnostic source
        run: node --check scripts/sand-ink-alpha-bounds-ab-browser.mjs
      - name: Compare eight full source caches, original and alpha-bounded proposed paint
        run: node scripts/sand-ink-alpha-bounds-ab-browser.mjs
      - name: Preserve quantitative proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movable-sand-alpha-bounds-${{ github.run_id }}
          path: artifacts/sand-stripes-ink-alpha-crop-ab/
          retention-days: 7
          if-no-files-found: warn
