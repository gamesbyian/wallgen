name: Mobile fullscreen acceptance

# Specialized evidence suite: explicit Actions dispatch only; normal PR gates live in the core workflows.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-chromium-fullscreen:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/mobile-fullscreen.test.js
      - run: npm install --no-save playwright@1.56.1 serve@14.2.5
      - run: npx playwright install --with-deps chromium
      - name: Serve actual app
        run: |
          npx serve . -l 4173 > /tmp/fullscreen-serve.log 2>&1 &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/fullscreen-serve.log
          exit 1
      - run: node tests/mobile-fullscreen-acceptance.mjs
