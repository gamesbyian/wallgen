name: One-shot source microstair 22 plus independent 16 A/B
# Opt-in expensive browser acceptance, MUST be removed before merge.
on:
  pull_request:
    paths:
      - src/image-hue-reconstruction.js
      - tests/reconstruction-visible-hue-shapes.test.js
      - .github/workflows/one-shot-microstair-all-source-ab.yml
permissions:
  contents: read
jobs:
  actual-art:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate local topology and source geometry before browser
        run: node --test tests/reconstruction-visible-hue-shapes.test.js
      - name: Disposable real Chromium and PNG decoder
        run: |
          npm install --no-save playwright@1.56.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Create 22 real current-painter sources and 16 independent artworks once
        run: |
          node scripts/review-reconstruction.mjs --out-dir artifacts/micro-new-R0
          cp -a artifacts/micro-new-R0 artifacts/micro-old-R0
          for collection in original low-chroma sparse-hue gapped-hue; do
            node scripts/review-reconstruction-external-pigments.mjs \
              --collection "$collection" --out-dir "artifacts/micro-new-$collection"
            cp -a "artifacts/micro-new-$collection" "artifacts/micro-old-$collection"
          done
      - name: Source-blind fitting with conservative vector microstep smoothing
        run: |
          node scripts/evaluate-reconstruction-r0.mjs \
            --dir artifacts/micro-new-R0 --ink-geometry --save-best-recipe
          for collection in original low-chroma sparse-hue gapped-hue; do
            node scripts/evaluate-reconstruction-r0.mjs \
              --dir "artifacts/micro-new-$collection" --save-best-recipe
          done
      - name: Actual current #804 source AA baseline, disable only microstep strength in temporary checkout
        run: |
          cp src/image-hue-reconstruction.js /tmp/with-microstep.js
          node --input-type=module -e '
            import {readFileSync,writeFileSync} from "node:fs";
            const p="src/image-hue-reconstruction.js",s=readFileSync(p,"utf8");
            const needle="const SOURCE_VISIBLE_MICROSTAIR_STRENGTH=0.5;";
            if(s.split(needle).length!==2)
              throw Error("Cannot independently isolate new microstep calibration");
            writeFileSync(p,s.replace(needle,
              "const SOURCE_VISIBLE_MICROSTAIR_STRENGTH=0;"));
          '
          node scripts/evaluate-reconstruction-r0.mjs \
            --dir artifacts/micro-old-R0 --ink-geometry --save-best-recipe
          for collection in original low-chroma sparse-hue gapped-hue; do
            node scripts/evaluate-reconstruction-r0.mjs \
              --dir "artifacts/micro-old-$collection" --save-best-recipe
          done
          cp /tmp/with-microstep.js src/image-hue-reconstruction.js
      - name: Compare 22+16 identical PNG sources and actual selected painted PNGs
        run: |
          node scripts/evaluate-source-contour-ab.mjs \
            artifacts/micro-new-R0 artifacts/micro-old-R0
          for collection in original low-chroma sparse-hue gapped-hue; do
            node scripts/evaluate-source-contour-ab.mjs \
              "artifacts/micro-new-$collection" "artifacts/micro-old-$collection"
          done
      - name: Preserve both sources, winners, provenance, optical report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r0-plus-external-38-microstair-ab-source-pngs
          path: |
            artifacts/micro-new-*
            artifacts/micro-old-*
          if-no-files-found: warn
          retention-days: 7
