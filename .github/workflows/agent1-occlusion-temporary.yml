name: Agent1 temporary genuine overlap and paint-order inversion study
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: agent1-occlusion-study-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  layered-source-fit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install one-shot actual browser renderer
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --only-shell
      - name: Generate genuine canonical source and metadata-free blind copies
        run: |
          node scripts/review-reconstruction.mjs --only 11-scattered-circles,21-five-hue-islands,22-overlapping-reversed-circles --out-dir artifacts/agent1-occlusion
      - name: Blind ≤6 coarse + ≤10 actual canonical painter evaluation
        run: |
          node scripts/evaluate-reconstruction-r0.mjs --dir artifacts/agent1-occlusion
      - name: Preserve source/fitted images and report for optical review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent1-overlap-layer-source-fit
          path: artifacts/agent1-occlusion/
          retention-days: 10
          if-no-files-found: warn
