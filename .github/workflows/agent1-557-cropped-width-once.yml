name: One-shot cropped width mirrored and occlusion proof
on:
  push:
    branches: [agent1/557-cropped-width-profile-on-merged-mirror-20261025]
    paths: [.github/workflows/agent1-557-cropped-width-once.yml]
permissions:
  contents: read
jobs:
  genuine-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install optional Chromium painter
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Generate real current source PNGs
        run: node scripts/review-reconstruction.mjs --out-dir artifacts/source --only 04-jagged,16-offset-jagged,22-overlapping-reversed-circles
      - name: Render canonical mirror of genuine offset Jagged as a fourth isolated source
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          import {normalizeRecipe} from './src/model.js';
          const dir='artifacts/source';
          const src=JSON.parse(await readFile(dir+'/16-offset-jagged.recipe.json','utf8'));
          const recipe=normalizeRecipe({...src,mirrorHorizontal:true,positionX:-18});
          await writeFile(dir+'/16-mirrored.recipe.json',JSON.stringify(recipe,null,2)+'\n');
          NODE
          node scripts/render-headless.mjs --recipe artifacts/source/16-mirrored.recipe.json --width 480 --height 1040 --out artifacts/source/16-mirrored.png
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          import {stripPngDescriptiveMetadata,extractPngRecipe,scanPngChunks} from './src/png-metadata.js';
          const dir='artifacts/source';
          const source=new Uint8Array(await readFile(dir+'/16-mirrored.png'));
          const anonymous=stripPngDescriptiveMetadata(source);
          if(extractPngRecipe(anonymous)!==null)throw Error('Mirror still has metadata');
          const a=scanPngChunks(source).chunks.filter(v=>v.type==='IDAT');
          const b=scanPngChunks(anonymous).chunks.filter(v=>v.type==='IDAT');
          if(a.length!==b.length||a.some((v,i)=>Buffer.compare(Buffer.from(v.raw),Buffer.from(b[i].raw))!==0))
            throw Error('Source PNG pixel stream was changed');
          await writeFile(dir+'/16-mirrored.no-metadata.png',anonymous);
          const man=JSON.parse(await readFile(dir+'/manifest.json','utf8'));
          man.items.push({id:'16-mirrored',goal:'Genuine opposite-edge clipped Jagged ribbons',
            original:'16-mirrored.png',metadataFree:'16-mirrored.no-metadata.png',
            recipeFile:'16-mirrored.recipe.json',seed:'source-recipe-hidden-during-inference'});
          await writeFile(dir+'/manifest.json',JSON.stringify(man,null,2)+'\n');
          NODE
      - name: Blind candidate fit under proposed width-profile guard
        run: |
          cp -a artifacts/source artifacts/proposed
          node scripts/evaluate-reconstruction-r0.mjs --dir artifacts/proposed
      - name: Blind fit under unchanged latest main
        run: |
          cp -a artifacts/source artifacts/control
          git show origin/main:src/image-path.js > src/image-path.js
          node scripts/evaluate-reconstruction-r0.mjs --dir artifacts/control
      - name: Fail on changed genuine visual scores or discarded mirrored editable stamps
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const a=JSON.parse(await readFile('artifacts/control/evaluation.json','utf8'));
          const b=JSON.parse(await readFile('artifacts/proposed/evaluation.json','utf8'));
          const rows=b.samples.map(sample=>{
            const previous=a.samples.find(x=>x.id===sample.id);
            if(!previous)throw Error('missing baseline '+sample.id);
            const row={id:sample.id,control:previous.bestError,proposal:sample.bestError,
              kindOld:previous.bestKind,kindNew:sample.bestKind,
              difference:sample.bestError-previous.bestError};
            console.log('CROPPED_WIDTH_CHROMIUM '+JSON.stringify(row));
            if(row.difference>1e-9)throw Error('Optical regression '+row.id);
            if(['16-offset-jagged','16-mirrored'].includes(sample.id)&&
              sample.bestKind!=='shape-repeats')
              throw Error('Lost proven editable seven-stamp '+sample.id);
            return row;
          });
          await writeFile('artifacts/width-genuine-comparison.json',JSON.stringify(rows,null,2)+'\n');
          NODE
      - name: Preserve genuine current production source and before/after fits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconstruction-557-width-mirror-occlusion-r0
          path: artifacts/
          retention-days: 4
          if-no-files-found: warn
