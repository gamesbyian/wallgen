name: R0 source-visible hue shape oracle
# One-shot PR run on first source-backed proof; restore manual-only afterwards.
on:
  pull_request:
    paths: ['.github/workflows/reconstruction-hue-shapes-experiment.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r0-hue-shapes-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false
jobs:
  optical:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test canonical source-visible masks and per-hue compound receipts
        run: node --test tests/reconstruction-visible-hue-shapes.test.js tests/scattered-shape-overrides.test.js
      - name: Install opt-in real Chromium forward renderer
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Generate all 22 genuine metadata-free current-renderer R0 images
        run: |
          node scripts/review-reconstruction.mjs             --out-dir artifacts/r0-hue-shapes             
      - name: Evaluate all 22 normal six-plus-ten candidate selections plus opt-in per-hue proof
        run: |
          node scripts/evaluate-reconstruction-r0.mjs             --dir artifacts/r0-hue-shapes --hue-visible-shapes
      - name: Print source-backed candidate outcomes, with no hidden score sidecar
        run: |
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const r=JSON.parse(readFileSync("artifacts/r0-hue-shapes/evaluation.json"));
            for(const s of r.samples)
              console.log("HUE_SHAPE_R0 "+JSON.stringify({
                id:s.id,currentKind:s.bestKind,currentError:s.bestError,
                proposedError:s.hueVisibleShapes?.error??null,
                improved:s.hueVisibleShapes?.improved??false,
                sourceVisibleOnly:s.hueVisibleShapes?.sourceVisibleOnly??null,
                components:s.hueVisibleShapes?.componentCounts??null,
                croppedHueSlots:s.hueVisibleShapes?.croppedHueSlots??null
              }));
          '
      - name: Verify exact source-first wins and known no-regression controls
        run: |
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const r=JSON.parse(readFileSync("artifacts/r0-hue-shapes/evaluation.json"));
            if(r.samples.length!==22)throw Error("Expected all 22 source R0 inputs");
            const expectations={
              "02-diagonal-straight":.021,
              "04-jagged":.027,
              "05-hairpin":.041,
              "06-loop":.046,
              "16-offset-jagged":.022,
              "11-scattered-circles":.005629,
              "17-repeated-hue-circles":.003894,
              "18-repeated-compound-hole-island":.005473,
              "20-pastel-seven-circles":.005851,
              "22-overlapping-reversed-circles":.004676
            };
            for(const [id,ceiling] of Object.entries(expectations)){
              const s=r.samples.find(x=>x.id===id);
              if(!s||!(s.bestError<=ceiling))
                throw Error("Source-backed acceptance failed for "+id+": "+
                  s?.bestError+" > "+ceiling);
            }
            console.log("R0_ALL22_SOURCE_BACKED "+JSON.stringify({
              total:r.samples.length,winners:r.samples
                .filter(x=>x.bestKind==="hue-visible-shapes")
                .map(x=>({id:x.id,error:x.bestError}))
            }));
          '
      - name: High-resolution portable Hairpin/Loop source-shape exports, where representable
        run: |
          set -euo pipefail
          for case_id in 05-hairpin 06-loop 16-offset-jagged; do
            recipe="artifacts/r0-hue-shapes/$case_id.r0-hue-visible.recipe.json"
            if test -f "$recipe"; then
              node scripts/render-headless.mjs --recipe "$recipe"                 --width 3024 --height 6552 --backend reference                 --out "artifacts/r0-hue-shapes/$case_id.r0-hue-visible.full.png"
            else
              echo "Unrepresentable source pigment: $case_id (no fabricated recipe)"
            fi
          done
      - name: Save original, existing fitted, proposed and full-resolution PNG proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genuine-r0-source-visible-hue-recipes
          path: artifacts/r0-hue-shapes
          if-no-files-found: warn
          retention-days: 7
