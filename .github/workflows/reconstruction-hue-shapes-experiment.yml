name: R0 source-visible hue shape oracle
# Source/fit screenshots and full-resolution export remain manually opt-in.
on:
  # One-shot source-backed #723 gate; revert before merging.
  pull_request:
    paths:
      - 'src/image-reconstruction.js'
      - 'tests/image-reconstruction.test.js'
      - '.github/workflows/reconstruction-hue-shapes-experiment.yml'
  workflow_dispatch:
    inputs:
      include_external_pigments:
        description: 'Include four independent Canvas-authored noncircular pigment artworks'
        type: boolean
        required: false
        default: false
      include_holdouts:
        description: 'Additionally evaluate eight blinded current-renderer Hairpin/Loop variants'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: r0-hue-shapes-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false
jobs:
  optical:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test canonical source-visible masks and per-hue compound receipts
        run: node --test tests/reconstruction-visible-hue-shapes.test.js tests/scattered-shape-overrides.test.js
      - name: Install opt-in real Chromium forward renderer
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Generate four independent non-ROYGBIV Canvas source images
        if: ${{ github.event_name == 'pull_request' || inputs.include_external_pigments }}
        run: node scripts/review-reconstruction-external-pigments.mjs --out-dir artifacts/external-pigment-r0
      - name: Reconstruct independent metadata-free art with ordinary six-plus-ten painter
        if: ${{ github.event_name == 'pull_request' || inputs.include_external_pigments }}
        run: node scripts/evaluate-reconstruction-r0.mjs --dir artifacts/external-pigment-r0 --hue-visible-shapes --source-signature
      - name: Report independent artwork and separate existing shape proposal errors
        if: ${{ github.event_name == 'pull_request' || inputs.include_external_pigments }}
        run: |
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const report=JSON.parse(readFileSync("artifacts/external-pigment-r0/evaluation.json"));
            if(report.schema!=="roygbiv-reconstruction-external-evaluation/v1"||
              report.samples.length!==4||report.samples.some(s=>s.trueStructure!==null))
              throw Error("Fabricated or incomplete external source evidence");
            for(const s of report.samples)console.log("EXTERNAL_PIGMENT_R0 "+
              JSON.stringify({id:s.id,currentKind:s.bestKind,currentError:s.bestError,
                proposalError:s.hueVisibleShapes?.error??null,
                proposedKind:s.hueVisibleShapes?.kind??null,
                components:s.hueVisibleShapes?.componentCounts??null,
                candidateCount:s.candidateCount,sourceSignature:s.sourceSignature??null}));
          '
      - name: Qualify three noncircular wins without regressing round pigment control
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const r=JSON.parse(readFileSync("artifacts/external-pigment-r0/evaluation.json"));
            const expected={
              "polygon-seven":.0359,
              "concave-seven":.0357,
              "occluded-mixed-seven":.0374
            };
            for(const [id,ceiling] of Object.entries(expected)){
              const s=r.samples.find(x=>x.id===id);
              if(!s||s.bestKind!=="hue-visible-shapes"||s.bestError>ceiling||
                s.candidateCount>6||s.refinementRenders>10)
                throw Error("External shape not recovered within production budget: "+
                  id+" "+JSON.stringify(s?.bestError));
            }
            const control=r.samples.find(x=>x.id==="round-seven-control");
            if(!control||control.bestKind!=="regions"||
              control.bestError>.03669||control.candidateCount>6)
              throw Error("Measured real-circle control regressed");
            console.log("EXTERNAL_SHAPE_FIDELITY_CONFIRMED "+JSON.stringify(
              r.samples.map(s=>({id:s.id,kind:s.bestKind,error:s.bestError}))));
          '
      - name: Generate all 22 genuine metadata-free current-renderer R0 images
        run: |
          node scripts/review-reconstruction.mjs             --out-dir artifacts/r0-hue-shapes             
      - name: Evaluate all 22 normal six-plus-ten candidate selections plus opt-in per-hue proof
        run: |
          node scripts/evaluate-reconstruction-r0.mjs             --dir artifacts/r0-hue-shapes --hue-visible-shapes
      - name: Print source-backed candidate outcomes, with no hidden score sidecar
        run: |
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const r=JSON.parse(readFileSync("artifacts/r0-hue-shapes/evaluation.json"));
            for(const s of r.samples)
              console.log("HUE_SHAPE_R0 "+JSON.stringify({
                id:s.id,currentKind:s.bestKind,currentError:s.bestError,
                proposedError:s.hueVisibleShapes?.error??null,
                improved:s.hueVisibleShapes?.improved??false,
                sourceVisibleOnly:s.hueVisibleShapes?.sourceVisibleOnly??null,
                components:s.hueVisibleShapes?.componentCounts??null,
                croppedHueSlots:s.hueVisibleShapes?.croppedHueSlots??null
              }));
          '
      - name: Verify exact source-first wins and known no-regression controls
        run: |
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const r=JSON.parse(readFileSync("artifacts/r0-hue-shapes/evaluation.json"));
            if(r.samples.length!==22)throw Error("Expected all 22 source R0 inputs");
            const expectations={
              "02-diagonal-straight":.021,
              "08-radial-rays":.042985,
              "09-radial-rings":.100914,
              "10-regions-nested":.011952,
              "14-offset-radial-rays":.038621,
              "15-offset-radial-rings":.061939,
              "04-jagged":.027,
              "05-hairpin":.041,
              "06-loop":.046,
              "16-offset-jagged":.022,
              "11-scattered-circles":.005629,
              "17-repeated-hue-circles":.003894,
              "18-repeated-compound-hole-island":.005473,
              "20-pastel-seven-circles":.005851,
              "22-overlapping-reversed-circles":.004676,
              "19-jewel-vertical":.016
            };
            for(const [id,ceiling] of Object.entries(expectations)){
              const s=r.samples.find(x=>x.id===id);
              if(!s||!(s.bestError<=ceiling))
                throw Error("Source-backed acceptance failed for "+id+": "+
                  s?.bestError+" > "+ceiling);
            }
            console.log("R0_ALL22_SOURCE_BACKED "+JSON.stringify({
              total:r.samples.length,winners:r.samples
                .filter(x=>x.bestKind==="hue-visible-shapes")
                .map(x=>({id:x.id,error:x.bestError}))
            }));
          '
      - name: Verify original 22 source winner errors never worsen
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const samples=JSON.parse(readFileSync("artifacts/r0-hue-shapes/evaluation.json")).samples;
            const old={
              "01-vertical-straight":.016628959276018502,
              "02-diagonal-straight":.015555869783811552,
              "03-wave":.013651351967069089,
              "04-jagged":.018627549176722432,
              "05-hairpin":.03053935316113644,
              "06-loop":.03725951718828642,
              "07-drawn":.02354522137380604,
              "08-radial-rays":.04298436321644187,
              "09-radial-rings":.10091381504524934,
              "10-regions-nested":.011951278909000317,
              "11-scattered-circles":.005628122643288287,
              "12-textured-embroidered":.02230618008421348,
              "13-holed-shape":.0026477658371040678,
              "14-offset-radial-rays":.03862012553418767,
              "15-offset-radial-rings":.05010232057566684,
              "16-offset-jagged":.013308548579688537,
              "17-repeated-hue-circles":.003892993495475121,
              "18-repeated-compound-hole-island":.005472186871543504,
              "19-jewel-vertical":.015307629462041908,
              "20-pastel-seven-circles":.00585024274132744,
              "21-five-hue-islands":.0028137176344896872,
              "22-overlapping-reversed-circles":.004675716440422474
            };
            if(samples.length!==22)throw Error("Expected all 22 historical sources");
            for(const s of samples){
              if(s.bestError>old[s.id]+1e-8||
                s.candidateCount>6||s.refinementRenders>10)
                throw Error("Source R0 regression: "+s.id+" "+s.bestError);
            }
            console.log("ORIGINAL_R0_NONREGRESSION "+samples.length);
          '
      - name: High-resolution portable Hairpin/Loop source-shape exports, where representable
        run: |
          set -euo pipefail
          for case_id in 05-hairpin 06-loop 16-offset-jagged; do
            recipe="artifacts/r0-hue-shapes/$case_id.r0-hue-visible.recipe.json"
            if test -f "$recipe"; then
              node scripts/render-headless.mjs --recipe "$recipe"                 --width 3024 --height 6552 --backend reference                 --out "artifacts/r0-hue-shapes/$case_id.r0-hue-visible.full.png"
            else
              echo "Unrepresentable source pigment: $case_id (no fabricated recipe)"
            fi
          done
      - name: Generate eight independent source-blind Hairpin and Loop holdouts
        if: ${{ inputs.include_holdouts }}
        run: |
          node scripts/review-reconstruction.mjs \
            --out-dir artifacts/r0-loop-holdouts --contour-holdouts
      - name: Reconstruct all eight holdouts with the NORMAL six-plus-ten production path
        if: ${{ inputs.include_holdouts }}
        run: |
          node scripts/evaluate-reconstruction-r0.mjs --dir artifacts/r0-loop-holdouts
      - name: Verify real-renderer source-shape rescue with no extra normal paints
        if: ${{ inputs.include_holdouts }}
        run: |
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const r=JSON.parse(readFileSync("artifacts/r0-loop-holdouts/evaluation.json"));
            if(r.samples.length!==8)throw Error("Expected eight independent sources");
            const failing=["23-hairpin-tight","25-hairpin-diagonal","28-loop-wide",
              "29-loop-oblique","30-loop-shifted"];
            for(const source of r.samples){
              console.log("LOOP_HOLDOUT_R0 "+JSON.stringify({
                id:source.id,kind:source.bestKind,error:source.bestError,
                paints:source.candidateCount,refinement:source.refinementRenders
              }));
              if(source.candidateCount>6||source.refinementRenders>10)
                throw Error("Exceeded canonical painter budget: "+source.id);
              if(failing.includes(source.id)&&
                (source.bestKind!=="hue-visible-shapes"||!(source.bestError<.045)))
                throw Error("Source-visible rescue not demonstrated: "+source.id);
            }
          '
      - name: Save original, existing fitted, proposed and full-resolution PNG proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genuine-r0-source-visible-hue-recipes
          path: |
            artifacts/r0-hue-shapes
            artifacts/r0-loop-holdouts
            artifacts/external-pigment-r0
          if-no-files-found: warn
          retention-days: 7
