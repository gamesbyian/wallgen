name: Native mobile full creation to embedded PNG
# Specialized evidence suite: explicit Actions dispatch only; normal PR gates live in the core workflows.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  complete-mobile-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tests/mobile-full-source-create-to-png.mjs
      - run: npm install --no-save playwright@1.56.1 serve@14.2.5
      - run: npx playwright install --with-deps chromium
      - name: Serve real source
        run: |
          npx serve . -l 4173 >/tmp/full-mobile-source.log 2>&1 &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/full-mobile-source.log
          exit 1
      - run: node tests/mobile-full-source-create-to-png.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-full-source-export-evidence
          path: artifacts/mobile-complete-creation-export/
          if-no-files-found: warn
