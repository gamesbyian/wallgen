name: Temporary reconstruction nested-state image proof
on:
  pull_request:
    paths:
      - 'src/image-reconstruction.js'
      - 'src/image-hue-reconstruction.js'
      - 'scripts/reconstruction-nested-state-image-proof.mjs'
      - '.github/workflows/temporary-recon-nest-state-image.yml'
permissions:
  contents: read
jobs:
  real-source-state-png:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated optical comparison dependencies
        run: |
          npm install --no-save playwright@1.56.1 pngjs@7
          CHROME_BIN="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$CHROME_BIN" ]; then
            echo "ROYGBIV_CHROMIUM_EXECUTABLE=$CHROME_BIN" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Verify real source-independent renderer pixels
        run: node scripts/reconstruction-nested-state-image-proof.mjs
      - name: Retain source and actual clean/contaminated/counterfactual PNGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconstruction-nested-state-real-art
          path: artifacts/reconstruction-nested-state/
          retention-days: 10
          if-no-files-found: warn
