name: Once hosted preflight Worker bundle
on:
  pull_request:
    paths:
      - .github/workflows/once-preview-preflight-bundle-20261031.yml
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test/build dependencies without altering lockfile
        run: npm install --no-save --package-lock=false --no-audit --no-fund
      - name: Exercise full Cloudflare safety suite, including preflight
        run: npm run test:cloudflare
      - name: Build a real Worker module WITHOUT deploying or billing
        run: npx wrangler deploy --dry-run --config cloudflare/mcp/wrangler.toml --outdir artifacts/preview-preflight-check
      - name: Assert nonempty bundled Worker output
        run: |
          set -eu
          test -s cloudflare/mcp/artifacts/preview-preflight-check/index.js
          wc -c cloudflare/mcp/artifacts/preview-preflight-check/index.js
