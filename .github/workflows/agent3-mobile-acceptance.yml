name: Agent 3 consolidated mobile acceptance gates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/redesign-mobile-focus-boundaries.mjs'
      - 'tests/redesign-runtime-source-census.mjs'
      - 'tests/redesign-conditional-tools-acceptance.mjs'
      - 'tests/redesign-seven-colour-targets-acceptance.mjs'
      - 'tests/redesign-material-rotation-browser.mjs'
      - 'tests/redesign-camera-structure-acceptance.mjs'
      - 'tests/redesign-keyboard-roving-tools.mjs'
      - 'tests/redesign-cold-keyboard-editor.mjs'
      - 'tests/redesign-global-status-acceptance.mjs'
      - 'tests/redesign-negative-png-import.mjs'
      - 'tests/redesign-clipboard-denial-recovery.mjs'
      - 'tests/redesign-more-keyboard-traversal.mjs'
      - 'tests/redesign-draw-real-transaction.mjs'
      - 'tests/redesign-fresh-draw-gesture.mjs'
      - 'tests/redesign-editor-focus-ab.mjs'
      - 'tests/redesign-draw-advanced-acceptance.mjs'
      - 'tests/redesign-crossing-pixels.mjs'
      - 'tests/redesign-draw-geometry-matrix.test.js'
      - '.github/workflows/agent3-mobile-acceptance.yml'
      - 'docs/ui-reference/source-control-inventory.json'
      - 'src/editor-*.js'
      - 'src/mobile-*.js'
      - 'src/app.js'
      - 'src/model.js'
      - 'src/interior-elements.js'
      - 'src/composition-geometry.js'
      - 'src/view-camera.js'
      - 'index.html'
      - '*.css'
      - 'assets/icons/**'
permissions:
  contents: read
jobs:
  independent-mobile-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and source controls contracts
        run: |
          for test in \
            tests/redesign-mobile-focus-boundaries.mjs \
            tests/redesign-runtime-source-census.mjs \
            tests/redesign-conditional-tools-acceptance.mjs \
            tests/redesign-seven-colour-targets-acceptance.mjs \
            tests/redesign-material-rotation-browser.mjs \
            tests/redesign-camera-structure-acceptance.mjs \
            tests/redesign-keyboard-roving-tools.mjs \
            tests/redesign-cold-keyboard-editor.mjs \
            tests/redesign-global-status-acceptance.mjs \
            tests/redesign-negative-png-import.mjs \
            tests/redesign-clipboard-denial-recovery.mjs \
            tests/redesign-more-keyboard-traversal.mjs \
            tests/redesign-draw-real-transaction.mjs \
            tests/redesign-fresh-draw-gesture.mjs \
            tests/redesign-editor-focus-ab.mjs \
            tests/redesign-draw-advanced-acceptance.mjs \
            tests/redesign-crossing-pixels.mjs; do
            node --check "$test"
          done
          node --test \
            tests/editor-tool-applicability.test.js \
            tests/interior-elements.test.js \
            tests/interior-combined-scope.test.js \
            tests/interior-selected-id.test.js \
            tests/material-three-layer-adversarial.test.js \
            tests/redesign-draw-geometry-matrix.test.js
      - name: One Chromium/browser install for seventeen acceptance suites
        run: |
          npm install --no-save playwright@1.56.1 serve@14.2.5
          npx playwright install --with-deps chromium
      - name: Serve live application source
        run: |
          npx serve . -l 4173 > /tmp/agent3-consolidated.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/agent3-consolidated.log
          exit 1
      - name: Exercise all seventeen independently authored browser gates
        run: |
          status=0
          for test in \
            tests/redesign-draw-advanced-acceptance.mjs \
            tests/redesign-fresh-draw-gesture.mjs \
            tests/redesign-mobile-focus-boundaries.mjs \
            tests/redesign-runtime-source-census.mjs \
            tests/redesign-conditional-tools-acceptance.mjs \
            tests/redesign-seven-colour-targets-acceptance.mjs \
            tests/redesign-material-rotation-browser.mjs \
            tests/redesign-camera-structure-acceptance.mjs \
            tests/redesign-keyboard-roving-tools.mjs \
            tests/redesign-cold-keyboard-editor.mjs \
            tests/redesign-global-status-acceptance.mjs \
            tests/redesign-negative-png-import.mjs \
            tests/redesign-clipboard-denial-recovery.mjs \
            tests/redesign-more-keyboard-traversal.mjs \
            tests/redesign-draw-real-transaction.mjs \
            tests/redesign-editor-focus-ab.mjs \
            tests/redesign-crossing-pixels.mjs; do
            echo "::group::$test"
            node "$test" || status=1
            echo "::endgroup::"
          done
          exit "$status"
      - name: Retain every independent witness, including failed suites
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roygbiv-agent3-consolidated-mobile-evidence
          path: |
            artifacts/agent3-focus-boundaries/
            artifacts/agent3-runtime-source-census/
            artifacts/agent3-conditional-tools/
            artifacts/agent3-interior-colour-targets/
            artifacts/agent3-material-rotation/
            artifacts/agent3-camera-isolation/
            artifacts/agent3-tool-keyboard/
            artifacts/agent3-cold-keyboard/
            artifacts/agent3-global-status/
            artifacts/agent3-negative-png-import/
            artifacts/agent3-clipboard-denial/
            artifacts/agent3-more-keyboard/
            artifacts/agent3-draw-transaction/
            artifacts/agent3-fresh-draw/
            artifacts/agent3-editor-focus-ab/
            artifacts/agent3-advanced-draw/
            artifacts/agent3-crossing-pixels/
          retention-days: 14
          if-no-files-found: warn
