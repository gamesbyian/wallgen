name: Temporary nested inner-hue readability experiment
on:
  pull_request:
    paths:
      - 'scripts/nested-inner-colour-balance-study.mjs'
      - '.github/workflows/temporary-nested-ink-balance.yml'
permissions:
  contents: read
jobs:
  actual-ink-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test-only renderer and PNG
        run: |
          npm install --no-save playwright@1.56.1 pngjs@7
          CHROME_BIN="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$CHROME_BIN" ]; then
            echo "ROYGBIV_CHROMIUM_EXECUTABLE=$CHROME_BIN" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Compare actual colour ink on original vs tighter spacing
        run: node scripts/nested-inner-colour-balance-study.mjs
      - name: Retain matched actual PNGs and contact images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nested-ink-balance-comparison
          path: artifacts/nested-inner-balance/
          retention-days: 10
