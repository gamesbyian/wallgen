name: Agent 3 conditional source tool reachability

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/redesign-conditional-tools-acceptance.mjs'
      - '.github/workflows/agent3-conditional-tools.yml'
      - 'src/editor-layout.js'
      - 'src/editor-schema.js'
      - 'src/editor-tool-applicability.js'
      - 'src/mobile-studio.js'
      - 'src/model.js'
      - 'index.html'
permissions:
  contents: read
jobs:
  named-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and pure applicability contract
        run: |
          node --check tests/redesign-conditional-tools-acceptance.mjs
          node --test tests/editor-tool-applicability.test.js
      - name: Chromium and static server
        run: |
          npm install --no-save playwright@1.56.1 serve@14.2.5
          npx playwright install --with-deps chromium
      - name: Serve actual app
        run: |
          npx serve . -l 4173 > /tmp/agent3-tools.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/agent3-tools.log
          exit 1
      - name: Real mobile click reachability for named conditional tools
        run: node tests/redesign-conditional-tools-acceptance.mjs
      - name: Upload independent source-tool state evidence and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roygbiv-agent3-named-tools
          path: artifacts/agent3-conditional-tools/
          retention-days: 14
          if-no-files-found: warn
