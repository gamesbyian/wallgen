name: One-shot scattered overlap cycling acceptance
on:
  pull_request:
    paths:
      - 'src/scattered-drag.js'
      - 'src/scattered-overlap-cycle.js'
      - 'src/app.js'
      - 'scripts/scattered-overlap-browser.mjs'
      - '.github/workflows/once-scattered-overlap.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/scattered-overlap-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scattered-overlap-two-phone
          path: artifacts/scattered-overlap/
          retention-days: 14
          if-no-files-found: warn
