name: R0 ink geometry optical experiment
# Manual-only optical evidence. Normal PR CI remains the lean quick suite.
on:
  pull_request:
    paths: ['.github/workflows/reconstruction-ink-geometry-experiment.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ink-geometry-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false
jobs:
  optical:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact focused Node tests
        run: |
          node --test tests/reconstruction-ink-geometry.test.js tests/reconstruction-distance-field.test.js
      - name: Install disposable Chromium painter
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Generate genuine current-painter source images
        run: |
          node scripts/review-reconstruction.mjs             --out-dir artifacts/r0-ink-geometry             --only 05-hairpin,06-loop,16-offset-jagged,18-repeated-compound-hole-island,22-overlapping-reversed-circles
      - name: Reuse existing canonical fit and measure visible ink geometry
        run: |
          node scripts/evaluate-reconstruction-r0.mjs             --dir artifacts/r0-ink-geometry --ink-geometry --probe-local-curve
      - name: Report measured gaps, width and topology without rank changes
        run: |
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const report=JSON.parse(readFileSync("artifacts/r0-ink-geometry/evaluation.json"));
            for(const s of report.samples){
              const g=s.inkGeometry;
              if(s.localCurveProbe)console.log("LOCAL_CURVE_PROBE "+JSON.stringify({
                id:s.id,...s.localCurveProbe}));
              if(s.channelProbe)console.log("GAP_PROBE "+JSON.stringify({
                id:s.id,...s.channelProbe}));
              if(s.widthProbe)console.log("WIDTH_PROBE "+JSON.stringify({
                id:s.id,...s.widthProbe}));
              if(!g)throw Error("Missing opt-in geometry measurement");
              console.log("INK_GEOMETRY "+JSON.stringify({
                id:s.id,kind:s.bestKind,error:s.bestError,
                meanIoU:g.meanIoU,meanEdgeChamfer:g.meanEdgeChamfer,
                topologyMismatch:g.topologyMismatch,
                missingHues:g.missingHues,
                meanWidthRatio:g.meanWidthRatio,
                upperSourceGaps:g.upperSourceGaps,
                upperRenderedGaps:g.upperRenderedGaps,
                hues:g.byHue.map(h=>({
                  index:h.index,iou:h.iou,
                  sourceWidth:h.source.inkWidthMedian,
                  renderedWidth:h.rendered.inkWidthMedian,
                  widthRatio:h.widthRatio,
                  topologyMismatch:h.topologyMismatch,
                  skeletonComplete:h.source.skeletonComplete&&h.rendered.skeletonComplete
                }))
              }));
            }
          '
      - name: Retain genuine source/rendered art and optional geometry vector
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r0-ink-geometry-source-fit
          path: artifacts/r0-ink-geometry
          if-no-files-found: warn
          retention-days: 7
