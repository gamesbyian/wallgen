# TEMPORARY R0 evidence workflow. Delete before merging the feature PR.
# Runs only for this agent's branch, not as permanent routine CI.
name: Temporary Reconstruction R0 Art Evidence
on:
  pull_request:
permissions:
  contents: read
jobs:
  observe:
    if: github.head_ref == 'agent/reconstruction-r0-measured-evaluation-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install temporary browser dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Render all thirteen ACTUAL current-art images without leaking source recipes
        run: |
          node scripts/review-reconstruction.mjs --out-dir artifacts/r0-evidence
          node scripts/evaluate-reconstruction-r0.mjs --dir artifacts/r0-evidence
      - name: Archive source, metadata-free twins, candidate previews and measured report
        uses: actions/upload-artifact@v4
        with:
          name: reconstruction-r0-observed-13
          path: artifacts/r0-evidence/
          retention-days: 2
