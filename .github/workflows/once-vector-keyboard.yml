name: One-shot vector keyboard browser acceptance
on:
  pull_request:
    paths:
      - 'src/vector-keyboard-precision.js'
      - 'src/vector-draw-ui.js'
      - 'scripts/vector-keyboard-precision-browser.mjs'
      - '.github/workflows/once-vector-keyboard.yml'
permissions:
  contents: read
jobs:
  keyboard-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Focused math and keyboard source tests
        run: |
          node --check scripts/vector-keyboard-precision-browser.mjs
          node --check src/vector-draw-ui.js
          node --test tests/vector-keyboard-precision.test.js tests/vector-path-edit-session.test.js
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Actual browser key/chord authoring journeys
        run: node scripts/vector-keyboard-precision-browser.mjs
      - name: Keep screenshots and JSON evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vector-keyboard-evidence
          path: artifacts/vector-v3-authoring/
          retention-days: 7
          if-no-files-found: warn
