name: One-shot cropped width red-green source proof
on:
  push:
    branches: [agent1/557-cropped-tail-width-profile-proof-20261025]
    paths: [.github/workflows/agent1-557-width-gate-optical-once.yml]
permissions:
  contents: read
jobs:
  compare-old-new-source-logic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Green new width-profile refusal and source-backed positive
        run: node --test --test-name-pattern='cropped shared hue stamps refuse tail ink-width oscillation' tests/image-reconstruction.test.js
      - name: Old main must fail specifically at the new missing thickness agreement
        run: |
          git show origin/main:src/image-path.js > src/image-path.js
          if node --test --test-name-pattern='cropped shared hue stamps refuse tail ink-width oscillation' tests/image-reconstruction.test.js > baseline-witness.log 2>&1; then
            cat baseline-witness.log
            echo 'Case already refused by current main; no new bug proved'
            exit 1
          fi
          grep -E 'not ok|cropped shared hue stamps|error:|actual:|expected:' baseline-witness.log || true
          grep -q 'not ok 1 - cropped shared hue stamps refuse tail ink-width oscillation' baseline-witness.log ||
            { cat baseline-witness.log; exit 1; }
          echo 'Source-backed missing visible width evidence: RED baseline / GREEN proposal'
