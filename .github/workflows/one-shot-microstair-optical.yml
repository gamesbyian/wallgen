name: One-shot micro-staircase vector optical research
# Temporary PR CI, delete after source-backed experiment.
on:
  pull_request:
    paths:
      - scripts/probe-hue-microstair-browser.mjs
      - .github/workflows/one-shot-microstair-optical.yml
permissions:
  contents: read
jobs:
  optical:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Generate current source art and infer real editable shape candidates
        run: |
          node scripts/review-reconstruction.mjs --out-dir artifacts/r0-microstair --only 01-vertical-straight,03-wave,04-jagged,05-hairpin,06-loop,11-scattered-circles,16-offset-jagged
          node scripts/evaluate-reconstruction-r0.mjs --dir artifacts/r0-microstair --save-best-recipe
      - name: Paint actual canonical micro-staircase variants (not shipping code)
        run: node scripts/probe-hue-microstair-browser.mjs artifacts/r0-microstair
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-hue-microstair-research
          path: artifacts/r0-microstair
          retention-days: 7
          if-no-files-found: warn
