# TEMP art validation only: delete before merge
name: Temporary Agent1 divider source comparison
on:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    if: github.head_ref == 'agent1/reconstruction-radial-divider-evidence-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: |
          node scripts/review-reconstruction.mjs --only 06-loop,07-drawn,08-radial-rays,09-radial-rings,10-regions-nested,13-holed-shape --out-dir artifacts/agent1-divider
          node scripts/evaluate-reconstruction-r0.mjs --dir artifacts/agent1-divider --alternatives
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent1-radial-divider-source-and-fit
          path: artifacts/agent1-divider/
          retention-days: 2
