name: Temporary agent1 source snapshot
on:
  push:
    branches: [agent1/557-displaced-jagged-coupled-registration-20261024]
    paths: [.github/workflows/agent1-557-source-once.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Bundle tracked repository files only (exclude any untracked runtime files)
        run: |
          git ls-files -z | tar --null -T - -czf wallgen-tracked-source.tar.gz
          sha256sum wallgen-tracked-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: wallgen-agent1-source-snapshot
          path: wallgen-tracked-source.tar.gz
          retention-days: 2
