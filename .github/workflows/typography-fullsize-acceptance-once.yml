name: Typography 19.8 MP export proof once
on:
  pull_request:
    paths:
      - '.github/workflows/typography-fullsize-acceptance-once.yml'
      - 'tests/fixtures/typography-full-resolution.json'
permissions:
  contents: read
jobs:
  wallpaper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Render full 3024x6552 source PNG with two real packed fonts
        run: |
          mkdir -p output/typography-fullsize
          node scripts/render-headless.mjs --recipe tests/fixtures/typography-full-resolution.json \
            --backend worker --width 3024 --height 6552 \
            --out output/typography-fullsize/wallpaper-3024x6552.png
          node scripts/render-headless.mjs --recipe tests/fixtures/typography-full-resolution.json \
            --backend reference --width 600 --height 1300 \
            --out output/typography-fullsize/reference-600x1300.png
      - name: Check full-size image and embedded text recipe
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFile,writeFile} from 'node:fs/promises';
          import {extractPngRecipe} from './src/png-metadata.js';
          const b=await readFile('output/typography-fullsize/wallpaper-3024x6552.png');
          assert.equal(b.readUInt32BE(16),3024);
          assert.equal(b.readUInt32BE(20),6552);
          const recipe=extractPngRecipe(b);
          assert.equal(recipe.textOverlays.length,2);
          assert.equal(recipe.textOverlays[0].font,'pack-bangers');
          assert.equal(recipe.textOverlays[1].font,'pack-courgette');
          await writeFile('output/typography-fullsize/proof.json',
            JSON.stringify({status:'PASS',width:3024,height:6552,bytes:b.length,
              embeddedTextObjects:recipe.textOverlays.length,
              packedFonts:recipe.textOverlays.map(x=>x.font)},null,2)+'\n');
          console.log('FULL-RES TYPOGRAPHY PROOF',b.length,'bytes, two embedded font IDs');
          JS
      - name: Preserve rendered PNG and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typography-19mp-worker-png
          path: output/typography-fullsize/
          if-no-files-found: ignore
          retention-days: 4
