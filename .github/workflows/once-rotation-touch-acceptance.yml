name: One-shot rotation browser acceptance
on:
  push:
    branches:
      - feature/touch-rotation-precision-20261029
permissions:
  contents: read
jobs:
  rotation-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies without build scripts
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Confirm Chrome and run real viewport journeys
        run: |
          command -v google-chrome
          node tests/rotation-scrubber-browser.mjs
      - name: Attach viewport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rotation-touch-browser
          path: artifacts/rotation-touch/*.png
          if-no-files-found: ignore
