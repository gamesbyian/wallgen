name: Temporary ROYGBIV nested Auto-fit 320px Chromium acceptance
on:
  pull_request:
    paths:
      - 'src/nested-shape-*'
      - 'scripts/nested-shape-short-portrait-browser-proof.mjs'
      - '.github/workflows/temporary-nested-autofit-browser.yml'
permissions:
  contents: read
jobs:
  nested-autofit-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install scoped real Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run real 320px saved-shape and Auto-fit Undo journey
        run: node scripts/nested-shape-short-portrait-browser-proof.mjs
      - name: Retain images and test receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nested-autofit-320px-chromium
          path: artifacts/nested-short-portrait/
          retention-days: 10
          if-no-files-found: warn
