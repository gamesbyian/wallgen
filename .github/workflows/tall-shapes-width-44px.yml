name: Tall Shapes width source 44px native setting row
on:
  pull_request:
    paths:
      - editor-redesign.css
      - tests/tall-shapes-width-44px-browser.mjs
      - .github/workflows/tall-shapes-width-44px.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shapes-width-source-touch:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tests/tall-shapes-width-44px-browser.mjs
      - run: npm install --no-save playwright@1.56.1 serve@14.2.5
      - run: npx playwright install --with-deps chromium
      - name: Serve source
        run: |
          npx serve . -l 4173 >/tmp/path-source-44.log 2>&1 &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/path-source-44.log
          exit 1
      - run: node tests/tall-shapes-width-44px-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: path-source-44px-native-touch
          path: artifacts/tall-shapes-width-44px/
          if-no-files-found: warn
