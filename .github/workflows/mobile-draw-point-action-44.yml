name: Tall Draw point actions 44px native touch
on:
  pull_request:
    paths:
      - draw-path.css
      - tests/mobile-draw-point-action-44.mjs
      - .github/workflows/mobile-draw-point-action-44.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  draw-point-touch:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tests/mobile-draw-point-action-44.mjs
      - run: npm install --no-save playwright@1.56.1 serve@14.2.5
      - run: npx playwright install --with-deps chromium
      - name: Serve source
        run: |
          npx serve . -l 4173 >/tmp/draw-point-44.log 2>&1 &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/draw-point-44.log
          exit 1
      - run: node tests/mobile-draw-point-action-44.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-draw-point-action-44
          path: artifacts/tall-draw-point-action-44/
          if-no-files-found: warn
