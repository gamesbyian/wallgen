name: Native touchscreen Draw anchor precision
# Specialized evidence suite: explicit Actions dispatch only; normal PR gates live in the core workflows.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-touch:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tests/mobile-drawn-touch-precision.mjs
      - run: npm install --no-save playwright@1.56.1 serve@14.2.5
      - run: npx playwright install --with-deps chromium
      - name: Serve real app
        run: |
          npx serve . -l 4173 >/tmp/drawn-touch-precision.log 2>&1 &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/drawn-touch-precision.log
          exit 1
      - run: node tests/mobile-drawn-touch-precision.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-drawn-real-touch-evidence
          path: artifacts/mobile-drawn-touch-precision/
          if-no-files-found: warn
