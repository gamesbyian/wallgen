# TEMPORARY four-source integration proof; delete before merge.
name: Temporary Integrated Reconstruction Proof
on:
  pull_request:
permissions:
  contents: read
jobs:
  compare:
    if: github.head_ref == 'agent/reconstruction-challenger-integrated-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install opt-in Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Actually compare integrated wave/jagged/diagonal plus hairpin control
        run: |
          node scripts/review-reconstruction.mjs --only 02-diagonal-straight,03-wave,04-jagged,05-hairpin --out-dir artifacts/r0-integrated
          node scripts/evaluate-reconstruction-r0.mjs --dir artifacts/r0-integrated --alternatives
      - uses: actions/upload-artifact@v4
        with:
          name: reconstruction-integrated-proven-four
          path: artifacts/r0-integrated/
          retention-days: 2
