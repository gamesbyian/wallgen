name: Publish Wallgen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Cheap sanity check before publishing this personal app; deeper verification is opt-in.
      - run: npm run check:quick
      # The hosted renderer refuses a mismatched or absent immutable commit
      # marker rather than silently drawing private recipes with newer assets.
      - name: Stamp exact published rendering revision
        run: printf '{"commit":"%s"}\\n' "$GITHUB_SHA" > roygbiv-render-version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
