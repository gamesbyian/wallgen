# TEMPORARY. Two-source real-image evidence, remove before merge.
name: Temporary R0 Candidate Visual Atlas
on:
  pull_request:
permissions:
  contents: read
jobs:
  gallery:
    if: github.head_ref == 'agent/reconstruction-variant-gallery-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install one-off browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Genuine Wave and Jagged candidate visual atlas
        run: |
          node scripts/review-reconstruction.mjs --only 03-wave,04-jagged --out-dir artifacts/r0-candidate-gallery
          node scripts/evaluate-reconstruction-r0.mjs --dir artifacts/r0-candidate-gallery --alternatives
      - uses: actions/upload-artifact@v4
        with:
          name: reconstruction-wave-jagged-all-candidates
          path: artifacts/r0-candidate-gallery/
          retention-days: 2
