name: One-off pinned radial settled Worker stage profile
on:
  pull_request:
    paths:
      - 'scripts/pinned-radial-stage-profile-browser.mjs'
      - '.github/workflows/one-off-radial-settled-profile.yml'
permissions:
  contents: read
jobs:
  stage-profile:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.title, '[radial-profile]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install actual Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check exact profiler source
        run: node --check scripts/pinned-radial-stage-profile-browser.mjs
      - name: Profile production settled paint with original-pixel parity
        run: node scripts/pinned-radial-stage-profile-browser.mjs
      - name: Preserve genuine browser profile and pixel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-radial-settled-worker-stage-profile-${{ github.run_id }}
          path: artifacts/pinned-radial-stage-profile/
          retention-days: 14
          if-no-files-found: warn
