name: Once Scattered Edge Resize Browser Acceptance
on:
  pull_request:
    paths:
      - 'tests/scattered-edge-scale-browser.mjs'
      - '.github/workflows/once-scattered-edge-scale.yml'
      - 'src/scattered-scale-gesture.js'
      - 'src/app.js'
      - 'scattered-shapes.css'
permissions:
  contents: read
jobs:
  real-chromium-edge-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify browser and syntax
        run: |
          command -v google-chrome || command -v chromium
          node --check tests/scattered-edge-scale-browser.mjs
          node --check src/app.js
      - name: Exercise actual two-viewport gestures and keyboard
        run: node tests/scattered-edge-scale-browser.mjs
