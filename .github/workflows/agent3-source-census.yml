name: Agent 3 source-ID runtime census

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/redesign-runtime-source-census.mjs'
      - '.github/workflows/agent3-source-census.yml'
      - 'docs/ui-reference/source-control-inventory.json'
      - 'src/editor-layout.js'
      - 'src/mobile-studio.js'
      - 'src/mobile-five-nav.js'
      - 'index.html'
permissions:
  contents: read
jobs:
  runtime-census:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify test source
        run: node --check tests/redesign-runtime-source-census.mjs
      - name: Install Chromium and server
        run: |
          npm install --no-save playwright@1.56.1 serve@14.2.5
          npx playwright install --with-deps chromium
      - name: Serve source app
        run: |
          npx serve . -l 4173 > /tmp/agent3-runtime-census.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/agent3-runtime-census.log
          exit 1
      - name: Verify static IDs through real mobile destinations
        run: node tests/redesign-runtime-source-census.mjs
      - name: Upload observed DOM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roygbiv-agent3-runtime-source-census
          path: artifacts/agent3-runtime-source-census/
          retention-days: 14
          if-no-files-found: warn
