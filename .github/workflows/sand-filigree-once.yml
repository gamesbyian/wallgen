name: One-time sand filigree Chromium and geometry proof
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/sand-contour-filigree-20261031]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native Chromium rendering dependencies
        run: |
          npm install --no-save --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Test and render source-matched fine, bead and echo artworks
        run: |
          node --test tests/sand-contour-echo.test.js tests/sand-contour-relief.test.js tests/sand-material.test.js
          node scripts/sand-contour-browser-proof.mjs
          npm run render -- --seed filigree-native --set family=studio --set geometry=wave --set material=sand-filigree --set textureCoverage=stripes --set textureStrength=95 --set textureScale=37 --width 3024 --height 6552 --out artifacts/sand-contour-browser/15-filigree-full-resolution.png
          npm run render -- --seed filigree-region-worker --set structure=regions --set material=sand-filigree --set textureCoverage=stripes --backend worker --width 600 --height 1300 --out artifacts/sand-contour-browser/16-filigree-worker-regions.png
          npm run render -- --seed sand-wave-s2 --set family=studio --set geometry=wave --set material=sand-filigree --set textureCoverage=stripes --width 320 --height 700 --out artifacts/sand-contour-browser/17-filigree-320x700.png
          npm run render -- --seed sand-wave-s2 --set family=studio --set geometry=wave --set material=sand-filigree --set textureCoverage=stripes --width 412 --height 892 --out artifacts/sand-contour-browser/18-filigree-412x892.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sand-filigree-real-browser-proof
          path: artifacts/sand-contour-browser
          if-no-files-found: ignore
          retention-days: 5
