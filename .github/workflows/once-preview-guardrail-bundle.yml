name: One-shot Hosted Preview Guardrail Bundle
on:
  push:
    branches: [security/hosted-preview-browser-domain-guardrails-20261027]
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false --no-audit --no-fund
      - run: npm run test:cloudflare
      - run: npx wrangler deploy --dry-run --config cloudflare/mcp/wrangler.toml --outdir artifacts/guardrail-check
