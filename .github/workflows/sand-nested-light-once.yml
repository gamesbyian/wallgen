# Temporary real-browser gate for PR #936; retire after proof.
name: Sand nested light optical acceptance (one-shot)
on:
  push:
    branches: [feat/sand-nested-directional-glint-20261031]
    paths: [.github/workflows/sand-nested-light-once.yml]
permissions:
  contents: read
concurrency:
  group: sand-nested-light-proof-936
  cancel-in-progress: true
jobs:
  real-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated proof dependency
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Render exact masked fine/bead/filigree/nested artwork
        run: node scripts/sand-contour-browser-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sand-nested-light-proof
          path: artifacts/sand-contour-browser/
          if-no-files-found: warn
          retention-days: 7
