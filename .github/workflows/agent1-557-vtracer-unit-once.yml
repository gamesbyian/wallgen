name: One-shot VTracer offline benchmark unit acceptance
on:
  push:
    branches: [agent1/557-vtracer-optin-genuine-vector-oracle-20261025]
    paths: [.github/workflows/agent1-557-vtracer-unit-once.yml]
permissions:
  contents: read
jobs:
  offline-benchmark-test:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check -r docs/reconstruction-vtracer-requirements.txt
      - name: Offline true PNG and trusted SVG regression tests
        run: python -m unittest discover -s tests -p test_reconstruction_vtracer.py -v
