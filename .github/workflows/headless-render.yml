name: Headless render smoke
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/render-headless.mjs'
      - 'tests/headless-cli.test.js'
      - 'package.json'
      - '.github/workflows/headless-render.yml'
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full static and model tests
        run: npm run check
      - name: Install isolated browser driver
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Render sample wallpapers with production engine
        run: |
          mkdir -p output
          npm run render -- --seed paper-comet --set family=studio --set orientation=diagonal --set geometry=straight --set motif=solid --set palette=electric --set material=construction --set textureStrength=45 --set stripeWidth=66 --set spread=56 --width 600 --height 1300 --out output/paper-comet.png
          npm run render -- --seed stardust-tapes --set family=tapestry --set orientation=horizontal --set geometry=jagged --set motif=solid --set palette=muted --set material=linen --set textureStrength=46 --set stripeWidth=25 --set spread=78 --width 600 --height 1300 --out output/stardust-tapes.png
          npm run render -- --seed dot-matrix --set family=signal --set orientation=diagonal --set lineStyle=dotted --set motif=solid --set geometry=straight --set stripeWidth=45 --set spread=88 --width 600 --height 1300 --out output/dot-matrix.png
          npm run render -- --seed white-silkscreen --set family=studio --set orientation=diagonal --set geometry=straight --set motif=solid --set palette=muted --set background=white --set material=linen --set textureStrength=20 --set stripeWidth=25 --set spread=65 --width 600 --height 1300 --out output/white-silkscreen.png
          npm run render -- --seed rubber-sines --set family=currents --set orientation=horizontal --set geometry=wave --set motif=solid --set shapeFrequency=72 --set shapeDepth=65 --set stripeWidth=38 --set spread=84 --set outline=hairline --width 600 --height 1300 --out output/rubber-sines.png
          npm run render -- --seed hairpin-fabric --set geometry=hairpin --set orientation=vertical --set construction=ribbon --set outline=white --set background=white --set material=canvas --set textureStrength=65 --set turnRadius=55 --set stripeWidth=62 --set spread=40 --width 600 --height 1300 --out output/hairpin-fabric.png
          npm run render -- --seed continuous-loops --set geometry=loops --set orientation=horizontal --set construction=stroke --set shapeFrequency=84 --set shapeDepth=75 --set background=white --set stripeWidth=30 --set spread=88 --width 600 --height 1300 --out output/continuous-loops.png
          npm run render -- --seed bundle-repeat --set geometry=straight --set composition=repeat --set repeatCount=4 --set repeatSpacing=62 --set orientation=diagonal --set diagonalRotation=0 --set construction=ribbon --set outline=none --set stripeWidth=65 --width 600 --height 1300 --out output/bundle-repeat.png
          npm run render -- --seed woven-columns --set family=tapestry --set geometry=straight --set orientation=vertical --set construction=woven --set outline=none --set stripeWidth=87 --set spread=70 --width 600 --height 1300 --out output/woven-columns.png
          npm run render -- --seed tonal-bands --set geometry=straight --set orientation=horizontal --set construction=tonal --set stripeWidth=90 --set spread=82 --set tonalContrast=80 --width 600 --height 1300 --out output/tonal-bands.png
          npm run render -- --seed floating-strokes --set composition=floating --set pathLength=56 --set endTaper=95 --set geometry=wave --set orientation=diagonal --set shapeFrequency=20 --set shapeDepth=25 --set brushRoughness=70 --set outline=none --set palette=electric --set stripeWidth=38 --width 600 --height 1300 --out output/floating-strokes.png
          npm run render -- --seed dry-brush --set geometry=wave --set orientation=diagonal --set construction=ribbon --set endTaper=75 --set brushRoughness=90 --set glow=42 --set palette=electric --set stripeWidth=35 --width 600 --height 1300 --out output/dry-brush.png
          npm run render -- --seed disc-columns --set family=studio --set motif=solid --set geometry=straight --set orientation=vertical --set construction=ribbon --set lineStyle=dotted --set dotSize=88 --set dotSpacing=72 --set outline=none --set stripeWidth=72 --set spread=90 --width 600 --height 1300 --out output/disc-columns.png
          npm run render -- --seed hairpin-oblique --set geometry=hairpin --set orientation=vertical --set hairpinAngle=110 --set turnRadius=65 --set stripeWidth=45 --set spread=58 --set background=white --width 600 --height 1300 --out output/hairpin-oblique.png
          npm run render -- --seed chevron-extremes --set family=studio --set geometry=chevron --set motif=solid --set shapeFrequency=14 --set shapeDepth=98 --set stripeWidth=45 --set spread=75 --width 600 --height 1300 --out output/chevron-extremes.png
          npm run render -- --seed thick-spread --set family=studio --set geometry=straight --set orientation=horizontal --set stripeWidth=100 --set spread=96 --set outline=none --width 600 --height 1300 --out output/thick-spread.png
          npm run render -- --seed step-count --set geometry=stepped --set stepCount=16 --set shapeFrequency=20 --set shapeDepth=90 --set stripeWidth=55 --width 600 --height 1300 --out output/step-count.png
          npm run render -- --seed chevron-sharp --set geometry=chevron --set chevronSharpness=100 --set shapeDepth=90 --set shapeFrequency=40 --width 600 --height 1300 --out output/chevron-sharp.png
          npm run render -- --seed loops-safe --set geometry=loops --set composition=repeat --set repeatCount=6 --set shapeFrequency=38 --set shapeDepth=100 --set geometrySafety=true --width 600 --height 1300 --out output/loops-safe.png
          npm run render -- --seed loops-free --set geometry=loops --set composition=repeat --set repeatCount=6 --set shapeFrequency=38 --set shapeDepth=100 --set geometrySafety=false --width 600 --height 1300 --out output/loops-free.png
          npm run render -- --seed hairpin-safe --set geometry=hairpin --set turnRadius=0 --set spread=100 --set geometrySafety=true --width 600 --height 1300 --out output/hairpin-safe.png
          npm run render -- --seed hairpin-free --set geometry=hairpin --set turnRadius=0 --set spread=100 --set geometrySafety=false --width 600 --height 1300 --out output/hairpin-free.png
          npm run render -- --seed dots-large --set motif=dots --set geometry=straight --set dotSize=100 --set dotSpacing=0 --set motifSize=90 --set motifFrequency=15 --width 600 --height 1300 --out output/dots-large.png
          npm run render -- --seed arcs-dense --set geometry=arc --set shapeFrequency=100 --set shapeDepth=100 --width 600 --height 1300 --out output/arcs-dense.png
      - name: Verify uncropped camera compositions and new Color Stories
        run: |
          npm run render -- --seed zoom-unclipped --set family=studio --set orientation=horizontal --set geometry=straight --set motif=solid --set material=none --set palette=sunset --set viewZoom=0.5 --set stripeWidth=72 --set spread=55 --width 600 --height 1300 --out output/zoom-unclipped.png
          npm run render -- --seed zoom-framed-full --set family=studio --set orientation=horizontal --set geometry=wave --set shapeFrequency=42 --set motif=solid --set material=none --set palette=arctic --set viewZoom=0.7 --set stripeWidth=58 --set spread=66 --width 3024 --height 6552 --out output/zoom-framed-full.png
          npm run render -- --seed palette-candy --set family=studio --set orientation=vertical --set geometry=straight --set motif=solid --set material=none --set palette=candy --width 600 --height 1300 --out output/palette-candy.png
          npm run render -- --seed palette-earth --set family=studio --set orientation=vertical --set geometry=straight --set motif=solid --set material=none --set palette=earth --width 600 --height 1300 --out output/palette-earth.png
          npm run render -- --seed palette-twilight --set family=studio --set orientation=vertical --set geometry=straight --set motif=solid --set material=none --set palette=twilight --width 600 --height 1300 --out output/palette-twilight.png
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          import {extractPngRecipe} from './src/png-metadata.js';
          for(const [file,zoom,width,height] of [
            ['zoom-unclipped',.5,600,1300],
            ['zoom-framed-full',.7,3024,6552],
            ['palette-candy',1,600,1300],['palette-earth',1,600,1300],
            ['palette-twilight',1,600,1300]]){
            const png=await readFile('output/'+file+'.png');
            assert.equal(png.readUInt32BE(16),width);
            assert.equal(png.readUInt32BE(20),height);
            assert.equal(extractPngRecipe(png).viewZoom,zoom);
          }
          JS
      - name: Drawn master curve exports identically through the production renderer
        run: |
          cat > output/drawn-recipe.json <<'JSON'
          {"seed":"drawn-smoke","geometry":"drawn","orientation":"horizontal","customPath":[[0.25,0.12],[0.23,0.35],[0.36,0.71],[0.56,0.84],[0.76,0.65],[0.77,0.17]],"construction":"tonal","palette":"electric","spread":44}
          JSON
          npm run render -- --recipe output/drawn-recipe.json --width 600 --height 1300 --out output/drawn-smoke.png
          cat > output/offframe-recipe.json <<'JSON'
          {"seed":"drawn-off-frame","geometry":"drawn","orientation":"horizontal","customPath":[[-0.35,0.23],[-0.10,0.30],[0.25,0.46],[0.69,0.60],[1.32,0.77]],"palette":"pastel","spread":35,"stripeWidth":72}
          JSON
          npm run render -- --recipe output/offframe-recipe.json --width 600 --height 1300 --out output/drawn-off-frame.png
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          import {extractPngRecipe,embedPngMetadata} from './src/png-metadata.js';
          const png=await readFile('output/drawn-smoke.png');
          const recipe=extractPngRecipe(png);
          assert.equal(recipe.geometry,'drawn');
          assert.equal(recipe.customPath.length,6);
          assert.deepEqual(recipe.customPath[0],[.25,.12]);
          console.log('Drawn curve PNG recipe and regenerated image validated');
          JS
      - name: Validate PNG dimensions and round-trip recipes
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          import {extractPngRecipe} from './src/png-metadata.js';
          for(const name of ['paper-comet','stardust-tapes','dot-matrix','white-silkscreen','rubber-sines','hairpin-fabric','continuous-loops','bundle-repeat','woven-columns','tonal-bands','dry-brush','floating-strokes','disc-columns','drawn-smoke','drawn-off-frame','hairpin-oblique','chevron-extremes','thick-spread','zoom-unclipped','palette-candy','palette-earth','palette-twilight','step-count','chevron-sharp','loops-safe','loops-free','hairpin-safe','hairpin-free','dots-large','arcs-dense']){
            const png=await readFile('output/'+name+'.png');
            assert.deepEqual([...png.subarray(0,8)],[137,80,78,71,13,10,26,10]);
            assert.equal(png.readUInt32BE(16),600);
            assert.equal(png.readUInt32BE(20),1300);
            const recipe=extractPngRecipe(png);
            assert.ok(recipe&&recipe.seed===name,name+' recipe missing');
            console.log(name,png.length,recipe.geometry,recipe.motif);
          }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roy-gbiv-headless-previews
          path: output/*.png
          if-no-files-found: warn
