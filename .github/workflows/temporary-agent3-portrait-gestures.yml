# TEMPORARY targeted browser evidence. Delete after one reviewed run.
name: Temporary Agent3 Portrait Swipe and Escape Proof
on:
  pull_request:
permissions:
  contents: read
jobs:
  focused-portrait:
    if: github.head_ref == 'agent3/portrait-focus-browser-evidence-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save --package-lock=false playwright@1.56.1 serve@14.2.5
          npx playwright install --with-deps chromium
      - run: |
          npx serve . -l 4173 >/tmp/agent3-portrait-gesture-server.log 2>&1 &
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/agent3-portrait-gesture-server.log
          exit 1
      - run: node tests/agent3-portrait-swipes-escape.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent3-portrait-swipe-and-escape-evidence
          path: artifacts/agent3-portrait-swipes-escape/
          retention-days: 3
          if-no-files-found: warn
