name: One-off nudge overscan mineral draw count
on:
  pull_request:
    paths:
      - 'scripts/sand-worker-canvas-method-counts.mjs'
      - '.github/workflows/one-off-sand-overhang-count.yml'
permissions:
  contents: read
jobs:
  profile:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.title, '[sand-overhang-count]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify script
        run: node --check scripts/sand-worker-canvas-method-counts.mjs
      - name: Original bitmap parity and nudge overscan cost
        run: node scripts/sand-worker-canvas-method-counts.mjs
      - name: Preserve result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sand-overscan-primitive-count-${{ github.run_id }}
          path: artifacts/sand-canvas2d-method-counts/
          retention-days: 14
          if-no-files-found: warn
