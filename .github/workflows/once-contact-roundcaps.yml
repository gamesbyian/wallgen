name: One-shot real lower-yarn round-cap optical comparison
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/once-contact-roundcaps.yml]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install one Chromium for both revisions
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Render candidate actual source wallpaper PNGs
        run: node scripts/thread-contact-optical-proof.mjs
      - name: Render previously accepted quadrilateral contact mask
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/thread-before-round-caps"
          git worktree add --detach "$BASE" 170d84c344b186a5aa31c1755609612feb1fcf02
          ln -s "$GITHUB_WORKSPACE/node_modules" "$BASE/node_modules"
          (cd "$BASE" && node scripts/thread-contact-optical-proof.mjs)
          mkdir -p artifacts/contact-roundcaps/baseline
          cp "$BASE/artifacts/thread-contact-optics/"*.png artifacts/contact-roundcaps/baseline/
      - name: Preserve controls and quantify lit caps
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,mkdirSync,writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          const a=JSON.parse(readFileSync(join(process.env.RUNNER_TEMP,
            'thread-before-round-caps/artifacts/thread-contact-optics/report.json'),'utf8'));
          const b=JSON.parse(readFileSync(
            'artifacts/thread-contact-optics/report.json','utf8'));
          assert.equal(a.records.length,7);
          assert.deepEqual(a.records.map(x=>x.name),b.records.map(x=>x.name));
          const changed=[],preserved=[];
          for(let i=0;i<a.records.length;i++){
            const before=a.records[i],after=b.records[i];
            const isLitSatin=['satin-over-nw','satin-over-se','soft-over-nw']
              .includes(before.name);
            if(!isLitSatin){
              assert.equal(before.sha256,after.sha256,
                'Unlit or unsupported style/policy pixels changed: '+before.name);
              preserved.push(before.name);
            }else{
              changed.push({name:before.name,
                bytesIdentical:before.sha256===after.sha256,
                baselineHash:before.sha256,candidateHash:after.sha256});
            }
          }
          mkdirSync('artifacts/contact-roundcaps',{recursive:true});
          const summary={old:'170d84c344b186a5aa31c1755609612feb1fcf02',
            new:process.env.GITHUB_SHA,preserved,changed,
            note:'Same installed Linux Chromium; geometry tests own the semicircle proof'};
          writeFileSync('artifacts/contact-roundcaps/summary.json',
            JSON.stringify(summary,null,2)+'\n');
          console.log('SOURCE_THREAD_CAPSULE_OPTICAL_PASS',JSON.stringify(summary));
          NODE
      - name: Upload both actual-art versions and source comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-yarn-round-caps-comparison
          path: |
            artifacts/thread-contact-optics/
            artifacts/contact-roundcaps/
          retention-days: 7
          if-no-files-found: warn
