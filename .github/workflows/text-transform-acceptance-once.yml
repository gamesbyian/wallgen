name: One-shot editable text rotate and scale proof
on:
  pull_request:
    paths:
      - 'scripts/text-transform-browser-proof.mjs'
      - '.github/workflows/text-transform-acceptance-once.yml'
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install actual Chromium for one-shot gesture verification
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Exercise transform handles, Undo, keyboard and exact worker render
        run: node scripts/text-transform-browser-proof.mjs
      - name: Preserve current source wallpapers and proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: text-transform-real-browser
          path: output/text-transform/
          if-no-files-found: ignore
          retention-days: 5
