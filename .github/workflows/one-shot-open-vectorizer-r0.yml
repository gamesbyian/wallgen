name: Open Vectorizer vs VTracer genuine R0 art (one-shot)
on:
  pull_request:
    paths:
      - .github/workflows/one-shot-open-vectorizer-r0.yml
permissions:
  contents: read
jobs:
  pinned-vector-oracles:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: python -m pip install -r docs/reconstruction-vtracer-requirements.txt
      - name: Generate real canonical renderer sources without recipe metadata
        run: |
          node scripts/review-reconstruction.mjs \
            --out-dir artifacts/roygbiv-source \
            --only 05-hairpin,06-loop,11-scattered-circles,13-holed-shape,22-overlapping-reversed-circles
      - name: Build external Open Vectorizer at exact source commit
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/vardirhq/open-vectorizer.git /tmp/roy-open-vectorizer
          git -C /tmp/roy-open-vectorizer checkout --quiet 7b9e49a649c62758e1a1abecab9b2c46d752f1e5
          test "$(git -C /tmp/roy-open-vectorizer rev-parse HEAD)" = "7b9e49a649c62758e1a1abecab9b2c46d752f1e5"
          cargo build --locked --release -p png2svg-cli --manifest-path /tmp/roy-open-vectorizer/Cargo.toml
          test -x /tmp/roy-open-vectorizer/target/release/png2svg-cli
      - name: Produce Open Vectorizer SVGs, source untouched
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/open-vectorizer-svg
          for source in artifacts/roygbiv-source/*.no-metadata.png; do
            base="$(basename "$source" .no-metadata.png)"
            /tmp/roy-open-vectorizer/target/release/png2svg-cli "$source" \
              --output "artifacts/open-vectorizer-svg/$base.svg" \
              --mode auto --colors 8 --stats
          done
      - name: Verify and unpack previously accepted VTracer binary
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 \
            'https://github.com/visioncortex/vtracer/releases/download/1.0.0-alpha.4/vtracer-x86_64-unknown-linux-musl.tar.gz' \
            -o /tmp/roy-vtracer.tar.gz
          echo '2058f611b48ed49497f78883bde47435531e9e17e3a79428432d1528bdb12e2a  /tmp/roy-vtracer.tar.gz' | sha256sum -c -
          mkdir -p /tmp/roy-vtracer
          tar -xzf /tmp/roy-vtracer.tar.gz -C /tmp/roy-vtracer
          find /tmp/roy-vtracer -type f -name vtracer -exec chmod +x {} +
          find /tmp/roy-vtracer -type f -name vtracer -print -quit > /tmp/roy-vtracer-location
          test -s /tmp/roy-vtracer-location
      - name: Compare both independently rasterized SVG outputs with same source pixels
        shell: bash
        run: |
          set -euo pipefail
          python scripts/benchmark-reconstruction-vtracer.py \
            --source-dir artifacts/roygbiv-source \
            --existing-svg-dir artifacts/open-vectorizer-svg \
            --oracle-name 'Open Vectorizer 7b9e49a' \
            --out-dir artifacts/open-vectorizer-score
          python scripts/benchmark-reconstruction-vtracer.py \
            --source-dir artifacts/roygbiv-source \
            --binary "$(cat /tmp/roy-vtracer-location)" \
            --out-dir artifacts/vtracer-score
      - name: Record fair side-by-side numerical comparison
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('artifacts/open-vectorizer-score/results.json').read_text())
          b=json.loads(Path('artifacts/vtracer-score/results.json').read_text())
          va={x['case']:x for x in a['results']}
          vb={x['case']:x for x in b['results']}
          assert set(va)==set(vb) and len(va)==5
          lines=['# Same-source vector oracle comparison (not a canonical reconstruction)',
                 '',
                 '| Source | Open RGB error | VTracer RGB error | Open IoU | VTracer IoU | Open shape elements | VTracer shape elements | Open native primitives |',
                 '| --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: |']
          for case in sorted(va):
              x,y=va[case],vb[case]
              assert x['sourceSha256']==y['sourceSha256'],case
              lines.append(f"| {case} | {x['rasterMeanAbsoluteRgb']:.6f} | {y['rasterMeanAbsoluteRgb']:.6f} | {x['brightForegroundIoU']:.5f} | {y['brightForegroundIoU']:.5f} | {x['svgShapeElementCount']} | {y['svgShapeElementCount']} | {x['svgPrimitiveCount']} |")
          lines.extend(['','These measurements are at source 480x1040, with a black background. They do not establish editability, source painter order, semantic Loop recovery, source author intent, or inspected human aesthetics.'])
          Path('artifacts/ORACLE-SUMMARY.md').write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY
      - name: Preserve bounded source/vector/preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roygbiv-pinned-five-case-vector-oracles
          path: |
            artifacts/ORACLE-SUMMARY.md
            artifacts/roygbiv-source/*.no-metadata.png
            artifacts/open-vectorizer-svg/*.svg
            artifacts/open-vectorizer-score/*.oracle.png
            artifacts/open-vectorizer-score/results.json
            artifacts/vtracer-score/*.svg
            artifacts/vtracer-score/*.oracle.png
            artifacts/vtracer-score/results.json
          retention-days: 3
