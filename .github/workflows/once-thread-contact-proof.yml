name: One-shot lower-yarn contact shadow source optical proof
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/once-thread-contact-proof.yml]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install matching Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Render candidate source truth
        run: node scripts/thread-contact-optical-proof.mjs > /tmp/thread-contact-current.log
      - name: Render previous accepted source in same browser
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/thread-before-contact"
          git worktree add --detach "$BASE" 760406af2aed58090db9bbd1a26b88db0bfda55b
          cp scripts/thread-contact-optical-proof.mjs "$BASE/scripts/thread-contact-optical-proof.mjs"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$BASE/node_modules"
          (cd "$BASE" && node scripts/thread-contact-optical-proof.mjs > /tmp/thread-contact-before.log)
      - name: Compare real PNG hashes and supported versus unsupported cases
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          const baseline=JSON.parse(readFileSync(join(process.env.RUNNER_TEMP,
            'thread-before-contact/artifacts/thread-contact-optics/report.json'),'utf8'));
          const current=JSON.parse(readFileSync(
            'artifacts/thread-contact-optics/report.json','utf8'));
          assert.equal(baseline.records.length,7);
          assert.deepEqual(baseline.records.map(r=>r.name),current.records.map(r=>r.name));
          const changed=[],preserved=[];
          for(let i=0;i<current.records.length;i++){
            const a=baseline.records[i],b=current.records[i];
            const isAllowed=['satin-over-nw','satin-over-se','soft-over-nw'].includes(b.name);
            if(isAllowed){
              assert.notEqual(a.sha256,b.sha256,
                'A true lower-thread contact shadow did not reach real pixels: '+b.name);
              changed.push(b.name);
            }else{
              assert.equal(a.sha256,b.sha256,
                'Disabled/unsupported source artwork must remain byte-identical: '+b.name);
              preserved.push(b.name);
            }
          }
          assert.equal(changed.length,3);assert.equal(preserved.length,4);
          const n=current.records.find(r=>r.name==='satin-over-nw');
          assert(n.contactsOnMidStripe>0,'Real source stitch intersection fixture must exist');
          const output={baseline:'760406af2aed58090db9bbd1a26b88db0bfda55b',
            candidate:process.env.GITHUB_SHA,changed,preserved,
            originalMidStripeContacts:n.contactsOnMidStripe,
            environment:'same Linux headless Chromium; not phone performance or complete occlusion'};
          writeFileSync('artifacts/thread-contact-optics/paired.json',
            JSON.stringify(output,null,2)+'\n');
          console.log('REAL_SATIN_CONTACT_SOURCE_MATCH_PASS',JSON.stringify(output));
          NODE
      - name: Upload actual source PNGs and measured topology
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-thread-contact-shadow-pixels
          path: artifacts/thread-contact-optics/
          retention-days: 7
          if-no-files-found: warn
