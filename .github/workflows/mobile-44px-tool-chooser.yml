name: Mobile 44px pinned Tool and Focus chooser
# Specialized evidence suite: explicit Actions dispatch only; normal PR gates live in the core workflows.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tests/mobile-44px-tool-chooser.mjs
      - run: npm install --no-save playwright@1.56.1 serve@14.2.5
      - run: npx playwright install --with-deps chromium
      - name: Serve real app
        run: |
          npx serve . -l 4173 >/tmp/44-tool-chooser-source.log 2>&1 &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/44-tool-chooser-source.log
          exit 1
      - run: node tests/mobile-44px-tool-chooser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-44px-tool-chooser-evidence
          path: artifacts/44px-pinned-tool-chooser/
          if-no-files-found: warn
