# Disposable real-Chromium source matched candidate test. Retire before merge.
name: One-off zero-side texture relief exact pixels and paint time
on:
  pull_request:
    paths:
      - 'src/renderer.js'
      - 'tests/motif-sample-equivalence.test.js'
      - '.github/workflows/once-zero-side-material-cost.yml'
permissions:
  contents: read
concurrency:
  group: once-zero-side-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  source-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: comparator-baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser harness
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Independent source arithmetic and signed-zero regression
        run: node --test tests/motif-sample-equivalence.test.js
      - name: Genuine Chrome 20 image SHA, full PNG and 9 alternate trials
        env:
          CHROME_BIN: /usr/bin/google-chrome
          ROYGBIV_PERF_TRIALS: '9'
        run: node scripts/motif-sample-reuse-acceptance.mjs
      - name: Save bounded source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zero-side-source-paint-proof-${{ github.run_id }}
          path: artifacts/motif-samples/pixel-proof.json
          retention-days: 7
          if-no-files-found: ignore
