name: One-shot glyph warning near face on real portrait controls
# Screenshot complete scrolled missing-glyph warning after initial viewport
on:
  push:
    branches: [agent3/664-visible-glyph-warning-portrait-20261024]
    paths: [.github/workflows/agent3-664-glyph-near-font-once.yml]
permissions:
  contents: read
jobs:
  actual-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/agent3-glyph-warning-near-font-browser.mjs
      - name: Install minimal Chromium headless
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --only-shell
      - name: Compare adjacent visible Typeface and warning at 320px and 412px
        run: node scripts/agent3-glyph-warning-near-font-browser.mjs
      - name: Preserve visible source screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent3-664-nearby-glyph-warning
          path: artifacts/agent3-664-glyph-near-font/
          retention-days: 14
          if-no-files-found: warn
