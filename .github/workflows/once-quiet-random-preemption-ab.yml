# Disposable controlled Chromium A/B; remove before exact-head quick CI.
name: One-off quiet Random burst worker A-B timeline
on:
  pull_request:
    paths:
      - 'src/app.js'
      - 'src/render-coordinator.js'
      - 'tests/render-coordinator.test.js'
      - 'scripts/once-random-quiet-preemption-ab-browser.mjs'
      - '.github/workflows/once-quiet-random-preemption-ab.yml'
permissions:
  contents: read
concurrency:
  group: one-random-cancel-ab-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  real-source-bursts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout immutable original base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: comparator-baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser harness
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Exact source syntax and worker ownership tests
        run: |
          node --check src/app.js
          node --check src/render-coordinator.js
          node --check scripts/once-random-quiet-preemption-ab-browser.mjs
          node --test tests/render-coordinator.test.js
      - name: Same-seed actual Random single/burst at both mobile viewports
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/once-random-quiet-preemption-ab-browser.mjs
      - name: Preserve complete real-click and worker timing receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quiet-random-source-ab-${{ github.run_id }}
          path: artifacts/randomize-preemption-ab/receipt.json
          retention-days: 7
          if-no-files-found: ignore
