# One-shot real Worker message observation under actual Random taps.
# Delete after proof, before clean stable required CI.
name: One-off real Random Worker queue timeline
on:
  pull_request:
    paths:
      - 'scripts/randomize-e2e-fixed-seeds-browser.mjs'
      - 'scripts/motif-sample-reuse-acceptance.mjs'
      - '.github/workflows/once-random-worker-timeline.yml'
permissions:
  contents: read
concurrency:
  group: one-random-worker-trace-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  real-worker-timeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Original main for source comparison
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: comparator-baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing browser dependency
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Verify reusable performance scripts
        run: |
          node --check scripts/randomize-e2e-fixed-seeds-browser.mjs
          node --check scripts/motif-sample-reuse-acceptance.mjs
      - name: Actual Random touches and request/completion/obsolete Worker timeline
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/randomize-e2e-fixed-seeds-browser.mjs
      - name: Match pinned radial source pixels against original main and worker paint
        env:
          CHROME_BIN: /usr/bin/google-chrome
          ROYGBIV_PERF_TRIALS: '3'
        run: node scripts/motif-sample-reuse-acceptance.mjs
      - name: Preserve timeline and exact-pixel comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-random-worker-queue-${{ github.run_id }}
          path: |
            artifacts/randomize-e2e-fixed/receipt.json
            artifacts/motif-samples/pixel-proof.json
          retention-days: 7
          if-no-files-found: ignore
