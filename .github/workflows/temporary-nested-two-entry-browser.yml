name: Temporary nested two-entry mobile acceptance
on:
  pull_request:
    paths:
      - 'src/nested-shape-ui.js'
      - 'src/nested-shape-framing.js'
      - 'scripts/nested-shape-short-portrait-browser-proof.mjs'
      - '.github/workflows/temporary-nested-two-entry-browser.yml'
permissions:
  contents: read
jobs:
  contextual-and-library-nesting:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser library and select hosted Chromium
        run: |
          npm install --no-save playwright@1.56.1
          CHROME_BIN="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$CHROME_BIN" ]; then
            echo "ROYGBIV_CHROMIUM_EXECUTABLE=$CHROME_BIN" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Exercise both real 320px Nest entry points and Undo
        run: node scripts/nested-shape-short-portrait-browser-proof.mjs
      - name: Retain actual screenshots, source and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nested-two-entry-320px-proof
          path: artifacts/nested-short-portrait/
          retention-days: 10
          if-no-files-found: warn
