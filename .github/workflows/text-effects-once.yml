name: One-shot expressive type source artwork
on:
  pull_request:
    paths:
      - src/text-overlay-renderer.js
      - scripts/text-path-browser-proof.mjs
permissions:
  contents: read
jobs:
  source-art:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium for one production-source inspection
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Render current text-path, shadows, rainbow and fonts
        run: node scripts/text-path-browser-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expressive-text-one-shot-pixels
          path: output/text-path/
          retention-days: 7
          if-no-files-found: warn
