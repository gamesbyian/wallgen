name: One-shot vector delete mobile Chromium
on:
  pull_request:
    paths:
      - 'src/vector-path-commands.js'
      - 'src/vector-path-edit-session.js'
      - 'src/vector-draw-ui.js'
      - 'scripts/vector-node-delete-browser.mjs'
      - '.github/workflows/once-vector-node-delete.yml'
permissions:
  contents: read
jobs:
  delete-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source checks and atomic undo tests
        run: |
          node --check scripts/vector-node-delete-browser.mjs
          node --check src/vector-draw-ui.js
          node --test tests/vector-node-delete.test.js tests/vector-path-edit-session.test.js
      - name: Install test browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Actual 320x700 and 412x892 delete gestures
        run: node scripts/vector-node-delete-browser.mjs
      - name: Keep screenshot and JSON proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vector-delete-mobile-evidence
          path: artifacts/vector-v3-authoring/
          retention-days: 7
          if-no-files-found: warn
