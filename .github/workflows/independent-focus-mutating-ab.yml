name: Independent Focus native-key A/B parity
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/editor-focus.js'
      - 'src/editor-layout.js'
      - 'tests/independent-focus-mutating-ab.mjs'
      - '.github/workflows/independent-focus-mutating-ab.yml'
permissions:
  contents: read
concurrency:
  group: focus-mutating-ab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tests/independent-focus-mutating-ab.mjs
      - run: npm test
      - run: npm install --no-save playwright@1.56.1 serve@14.2.5
      - run: npx playwright install --with-deps chromium
      - name: Serve source application
        run: |
          npx serve . -l 4173 > /tmp/focus-ab-server.log 2>&1 &
          for i in $(seq 1 40); do curl -fs http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/focus-ab-server.log
          exit 1
      - name: Compare actual Focus and source ArrowRight/ArrowLeft recipes
        run: node tests/independent-focus-mutating-ab.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-focus-mutating-ab-evidence
          path: artifacts/independent-focus-keyboard-ab/
          retention-days: 14
          if-no-files-found: warn
