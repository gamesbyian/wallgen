name: One-shot portable font package acceptance
on:
  pull_request:
    paths:
      - 'scripts/portable-font-browser-proof.mjs'
      - '.github/workflows/portable-font-acceptance-once.yml'
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium and source-licensed OS font fixture
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-dejavu-core
      - name: Prove genuine binary design transport across isolated profiles
        run: node scripts/portable-font-browser-proof.mjs
      - name: Preserve opt-in package and actual preview proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-ttf-source-proof
          path: output/portable-fonts/
          if-no-files-found: ignore
          retention-days: 5
