name: One-shot legacy Draw EventTarget transaction tests
on:
  pull_request:
    paths:
      - 'tests/draw-editor-transaction.test.js'
      - '.github/workflows/once-draw-eventtarget.yml'
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Historical sampled Draw transaction regression
        run: node --test tests/draw-editor-transaction.test.js
