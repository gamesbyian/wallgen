name: Mobile browser acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  phone-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Show available browser
        run: |
          command -v google-chrome || command -v chromium
      - name: Test real phone viewport and both appearance modes
        run: node tests/browser-smoke.mjs
      - name: Attach zoom-level editor screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-layout-browser-zoom
          path: output/editor-layout/*.png
          if-no-files-found: ignore
