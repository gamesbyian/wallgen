name: One-shot text axis touch acceptance
on:
  push:
    branches: [feat/text-move-axis-lock-20261030]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/text-axis-browser.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: text-axis-phone-evidence
          path: artifacts/text-axis/
          if-no-files-found: ignore
