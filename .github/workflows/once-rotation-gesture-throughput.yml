name: One-shot rotation gesture throughput comparison
on:
  push:
    branches:
      - feature/rotation-gesture-progressive-preview-20261029
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser client, without persistent lockfile
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Real continuous rotation pointer-to-frame benchmark
        run: CHROME_BIN=/usr/bin/google-chrome node scripts/rotation-latency-browser.mjs
      - name: Attach measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rotation-progressive-measurement
          path: artifacts/rotation-latency/chromium.json
          if-no-files-found: ignore
