# TEMP evidence only; never leave Chromium in normal CI.
name: Temporary Vertical Stripe Reconstruction Evidence
on:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    if: github.head_ref == 'agent/reconstruction-vertical-physical-fit-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: |
          node scripts/review-reconstruction.mjs --only 01-vertical-straight,02-diagonal-straight,03-wave,04-jagged,11-scattered-circles --out-dir artifacts/r0-vertical-evidence
          node scripts/evaluate-reconstruction-r0.mjs --dir artifacts/r0-vertical-evidence --alternatives
      - uses: actions/upload-artifact@v4
        with:
          name: vertical-stripe-source-register-five
          path: artifacts/r0-vertical-evidence/
          retention-days: 2
