name: Agent 3 mobile keyboard breakpoint acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/redesign-mobile-focus-boundaries.mjs'
      - '.github/workflows/agent3-mobile-focus.yml'
      - 'src/mobile-studio.js'
      - 'src/mobile-five-nav.js'
      - 'index.html'
permissions:
  contents: read
concurrency:
  group: agent3-mobile-focus-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  mobile-focus:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validation
        run: node --check tests/redesign-mobile-focus-boundaries.mjs
      - name: Chromium dependencies
        run: |
          npm install --no-save playwright@1.56.1 serve@14.2.5
          npx playwright install --with-deps chromium
      - name: Serve live app
        run: |
          npx serve . -l 4173 > /tmp/agent3-focus-server.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/agent3-focus-server.log
          exit 1
      - name: Physical hit targets and actual Tab traversal at six boundaries
        run: node tests/redesign-mobile-focus-boundaries.mjs
      - name: Upload evidence including failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roygbiv-agent3-mobile-focus-boundaries
          path: artifacts/agent3-focus-boundaries/
          retention-days: 14
          if-no-files-found: warn
