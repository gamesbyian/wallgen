name: Short 500x700 Draw panel occlusion source probe
on:
  pull_request:
    paths:
      - tests/short-draw-panel-position-probe.mjs
      - .github/workflows/short-draw-panel-position-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  short-panel-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tests/short-draw-panel-position-probe.mjs
      - run: npm install --no-save playwright@1.56.1 serve@14.2.5
      - run: npx playwright install --with-deps chromium
      - name: Serve original source
        run: |
          npx serve . -l 4173 >/tmp/short-draw.log 2>&1 &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/short-draw.log
          exit 1
      - run: node tests/short-draw-panel-position-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: short-draw-panel-source-position-evidence
          path: artifacts/short-draw-panel-probe/
          if-no-files-found: warn
