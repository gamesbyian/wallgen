name: Agent 2 original source-field live action matrix

# Specialized evidence suite: explicit Actions dispatch only; normal PR gates live in the core workflows.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent2-live-field-actions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      AGENT2_FIELD_SHARD: ${{ matrix.shard }}
      AGENT2_FIELD_SHARDS: '4'
      ROYGBIV_FIELD_OUT: artifacts/agent2-field-actions-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and source schema validation
        run: |
          node --check tests/agent2-live-field-action-matrix.mjs
          node --test tests/ui-contract-integrity.test.js tests/inactive-conditional-roundtrip.test.js
      - name: Install browser tools
        run: |
          npm install --no-save playwright@1.56.1 serve@14.2.5
          npx playwright install --with-deps chromium
      - name: Start actual site
        run: |
          npx serve . -l 4173 > /tmp/agent2-field-http.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/agent2-field-http.log
          exit 1
      - name: Exercise original source fields by pointer and native input
        run: node tests/agent2-live-field-action-matrix.mjs
      - name: Publish complete pass/failure witnesses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent2-field-action-shard-${{ matrix.shard }}
          path: artifacts/agent2-field-actions-${{ matrix.shard }}/
          retention-days: 14
          if-no-files-found: warn
