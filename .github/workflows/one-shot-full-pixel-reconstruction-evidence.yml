name: One-shot complete-frame inverse score optical controls
# Research PR only, must be removed before merge.
on:
  pull_request:
    paths:
      - src/image-reconstruction.js
      - tests/image-reconstruction.test.js
      - .github/workflows/one-shot-full-pixel-reconstruction-evidence.yml
permissions:
  contents: read
jobs:
  optical:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Narrow score guard before browser
        run: node --test tests/image-reconstruction.test.js
      - name: Disposable browser with real renderer
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Generate representative actual current-renderer source PNGs
        run: |
          node scripts/review-reconstruction.mjs --out-dir artifacts/r0-allpixels --only 01-vertical-straight,03-wave,04-jagged,05-hairpin,06-loop,11-scattered-circles,16-offset-jagged
      - name: Rank and fit current canonical painter against metadata-free source pixels
        run: |
          node scripts/evaluate-reconstruction-r0.mjs --dir artifacts/r0-allpixels --ink-geometry
      - name: Summarize true source fit winners
        run: |
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const a=JSON.parse(readFileSync("artifacts/r0-allpixels/evaluation.json"));
            if(a.samples.length!==7)throw Error("Missing optical controls");
            for(const item of a.samples){
              console.log("ALL_PIXEL_R0 "+JSON.stringify({
                id:item.id,kind:item.bestKind,error:item.bestError,
                candidates:item.candidateCount,
                controls:item.selectedControls,
                iou:item.inkGeometry?.meanIoU,
                chamfer:item.inkGeometry?.meanEdgeChamfer
              }));
            }
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r0-allpixels-canonical-source-fit
          path: artifacts/r0-allpixels
          retention-days: 7
          if-no-files-found: warn
