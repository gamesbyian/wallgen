name: Native touch selected Drawn anchor vs tangent
on:
  pull_request:
    paths:
      - src/draw-path-ui.js
      - tests/mobile-drawn-anchor-drag-priority.mjs
      - .github/workflows/mobile-drawn-anchor-drag-priority.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-drag:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tests/mobile-drawn-anchor-drag-priority.mjs
      - run: npm install --no-save playwright@1.56.1 serve@14.2.5
      - run: npx playwright install --with-deps chromium
      - name: Serve source
        run: |
          npx serve . -l 4173 >/tmp/drawn-drag.log 2>&1 &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/drawn-drag.log
          exit 1
      - run: node tests/mobile-drawn-anchor-drag-priority.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drawn-real-anchor-tangent-touch-evidence
          path: artifacts/mobile-drawn-anchor-drag/
          if-no-files-found: warn
