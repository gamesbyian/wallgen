name: One-shot imported nested silhouette actual Chromium evidence
# Temporary PR-only optical acceptance; remove this workflow before merging.
on:
  push:
    branches: [feat/815-seven-inset-rainbow-engine]
  pull_request:
    paths:
      - 'src/nested-shape-contours.js'
      - 'src/nested-shape-ui.js'
      - 'src/renderer.js'
      - 'src/model.js'
      - 'src/app.js'
      - 'scripts/nested-shape-browser-proof.mjs'
      - '.github/workflows/nested-shape-one-shot.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nested-shape-optical-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  optical:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify finite true-offset and source recipe tests
        run: node --test tests/nested-shape-contours.test.js tests/polygon-inset.test.js
      - name: Install disposable Chromium and PNG reader
        run: |
          npm install --no-save playwright@1.56.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Exercise real portrait editor, Undo and native 19.8MP worker parity
        run: node scripts/nested-shape-browser-proof.mjs
      - name: Retain real PNGs, screenshot and timings for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nested-delta-cloud-native-rainbow-proof
          path: artifacts/nested-shape-proof
          if-no-files-found: warn
          retention-days: 7
