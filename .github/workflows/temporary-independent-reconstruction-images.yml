# TEMP targeted evidence, delete before merging evaluator change.
name: Temporary Independent Graphics Reconstruction Study
on:
  pull_request:
permissions:
  contents: read
jobs:
  compare:
    if: github.head_ref == 'agent/reconstruction-external-no-truth-evidence-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Rasterize three independently authored SVGs, never ROYGBIV recipes
        run: |
          node --input-type=module <<'JAVASCRIPT'
          import {chromium} from 'playwright';
          import {mkdir,readFile,writeFile} from 'node:fs/promises';
          const dir='artifacts/r0-independent-graphics';
          await mkdir(dir,{recursive:true});
          const examples=['independent-soft-waves','independent-colour-islands','independent-angular-stripes'];
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage();
            const items=[];
            for(const id of examples){
              const source=await readFile('tests/fixtures/reconstruction-external/'+id+'.svg','utf8');
              const uri=await page.evaluate(async svg=>{
                const image=await createImageBitmap(new Blob([svg],{type:'image/svg+xml'}));
                const canvas=document.createElement('canvas');
                canvas.width=480;canvas.height=1040;
                const ctx=canvas.getContext('2d');ctx.drawImage(image,0,0,480,1040);
                image.close();
                return canvas.toDataURL('image/png');
              },source);
              const filename=id+'.png';
              await writeFile(dir+'/'+filename,Buffer.from(uri.slice(uri.indexOf(',')+1),'base64'));
              items.push({id,metadataFree:filename,
                goal:'Independent non-ROYGBIV SVG graphic, no canonical seed or recipe'});
            }
            await writeFile(dir+'/manifest.json',JSON.stringify({
              schema:'roygbiv-reconstruction-external/v1',
              source:'Independent hand-authored vector graphics, NOT owner-supplied or third-party',
              width:480,height:1040,items
            },null,2)+'\n');
          }finally{await browser.close();}
          JAVASCRIPT
      - name: Evaluate existing editable candidates with no invented truth
        run: node scripts/evaluate-reconstruction-r0.mjs --dir artifacts/r0-independent-graphics --alternatives
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independently-authored-external-style-three
          path: artifacts/r0-independent-graphics/
          retention-days: 2
