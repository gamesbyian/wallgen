# TEMPORARY one-off actual-art test. Remove before merging source work.
name: Temporary Seven-Stripe Physical Parameter Evidence
on:
  pull_request:
permissions:
  contents: read
jobs:
  measure:
    if: github.head_ref == 'agent/reconstruction-hue-metric-calibration-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium only for this source validation branch
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Generate authentic current-art source, blind fitting and candidate gallery
        run: |
          node scripts/review-reconstruction.mjs --only 02-diagonal-straight,03-wave,04-jagged,05-hairpin,11-scattered-circles --out-dir artifacts/r0-measured-ribbons
          node scripts/evaluate-reconstruction-r0.mjs --dir artifacts/r0-measured-ribbons --alternatives
      - name: Preserve actual source/fit pixels and machine-readable evidence
        uses: actions/upload-artifact@v4
        with:
          name: reconstruction-hue-spacings-five
          path: artifacts/r0-measured-ribbons/
          retention-days: 2
