name: Temporary native nested Auto-fit art review
on:
  pull_request:
    paths:
      - 'scripts/nested-shape-native-autofit-proof.mjs'
      - '.github/workflows/temporary-nested-native-art.yml'
permissions:
  contents: read
jobs:
  native-real-art:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test-only browser and PNG tools
        run: |
          npm install --no-save playwright@1.56.1 pngjs@7
          CHROME_BIN="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$CHROME_BIN" ]; then
            echo "ROYGBIV_CHROMIUM_EXECUTABLE=$CHROME_BIN" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Actual native 3024x6552 Auto-fit art, worker parity and metadata
        run: node scripts/nested-shape-native-autofit-proof.mjs
      - name: Archive generated source recipes, native artwork and contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nested-autofit-three-real-native-art
          path: artifacts/nested-autofit-native/
          if-no-files-found: warn
          retention-days: 10
