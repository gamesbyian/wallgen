name = "roygbiv-mcp"
main = "src/index.js"
compatibility_date = "2026-10-27"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Replace the resource URL / auth issuer in src/index.js with your verified
# Cloudflare domains before deploying. Disable deployment until configured.
[[services]]
binding = "AUTH_SERVER"
service = "roygbiv-auth"
entrypoint = "AuthServer"

[[d1_databases]]
binding = "RECIPES"
database_name = "roygbiv-mcp"
database_id = "c08c128b-8ac3-419d-a1dc-aaae80ddbfbe"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PRIVATE_ARTIFACTS"
bucket_name = "roygbiv-private-artifacts"

[triggers]
crons = ["0 3 * * *"]

[vars]
AUTH_SERVER_URL = "https://roygbiv-auth.gamesbyian-roygbiv.workers.dev"
MCP_SERVER_URL = "https://roygbiv-mcp.gamesbyian-roygbiv.workers.dev/mcp"

[browser]
binding = "BROWSER"

# Set this to an immutable, trusted ROYGBIV static source deployment only
# after Browser Run preview parity tests; until then the preview tool is hidden.
