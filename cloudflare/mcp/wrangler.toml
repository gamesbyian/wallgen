name = "roygbiv-mcp"
main = "src/index.js"
compatibility_date = "2026-10-27"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Live invite-only staging resource uses the issuer configured in [vars].
# Keep Cloudflare Browser Run disabled until actual image acceptance.
[[services]]
binding = "AUTH_SERVER"
service = "roygbiv-auth"
entrypoint = "AuthServer"

[[d1_databases]]
binding = "RECIPES"
database_name = "roygbiv-mcp"
database_id = "c08c128b-8ac3-419d-a1dc-aaae80ddbfbe"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PRIVATE_ARTIFACTS"
bucket_name = "roygbiv-private-artifacts"

[triggers]
crons = ["0 3 * * *"]

[vars]
AUTH_SERVER_URL = "https://roygbiv-auth.gamesbyian-roygbiv.workers.dev"
MCP_SERVER_URL = "https://roygbiv-mcp.gamesbyian-roygbiv.workers.dev/mcp"

# Browser Run remains intentionally unbound and unadvertised in this
# security-first staging deployment. See browser-render.js for later research.
