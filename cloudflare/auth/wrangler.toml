name = "roygbiv-auth"
main = "src/index.js"
compatibility_date = "2026-10-27"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = false

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "c17832107d1d411bbf308a9f69d0ae66"

# /authorize intentionally returns 503 until upstream sign-in, CSRF,
# allowlist and per-client consent flows are configured and proven.

[vars]
AUTH_SERVER_URL = "https://REPLACE-AUTH-HOST"
MCP_SERVER_URL = "https://REPLACE-MCP-HOST/mcp"
GITHUB_CLIENT_ID = "REPLACE_GITHUB_CLIENT_ID"
# GITHUB_CLIENT_SECRET and ALLOWED_GITHUB_IDS must be stored as Wrangler secrets.
