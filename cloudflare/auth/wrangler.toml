name = "roygbiv-auth"
main = "src/index.js"
compatibility_date = "2026-10-27"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = false

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "REPLACE_WITH_OAUTH_KV_NAMESPACE_ID"

# /authorize intentionally returns 503 until upstream sign-in, CSRF,
# allowlist and per-client consent flows are configured and proven.
