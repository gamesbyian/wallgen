<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">ROYGBIV rainbow phone, full-bleed Android launcher icon</title>
  <!-- Solid background extends beyond every adaptive-icon mask. Android crops
       this artwork; it must not embed a white or rounded-square launcher tile. -->
  <rect width="512" height="512" fill="#050608"/>
  <!-- Exact brand mark from roybgiv-logo.svg, enlarged to the maskable
       80%-diameter safe circle. The central mark, not the background, matters. -->
  <g transform="translate(54.4 54.4) scale(3.36)">
    <g transform="translate(1 0)">
      <g transform="translate(0 -2.4)" fill="none" stroke-width="9" stroke-linecap="round">
        <path stroke="#ff474e" d="M11.4567 40 L96.1433 17.12"/>
        <path stroke="#ff9b39" d="M8 52.9109 L67 36.9707"/>
        <path stroke="#ffe25b" d="M23 60.8353 L97.8 40.6264"/>
        <path stroke="#4fdd87" d="M47.25 66.2606 L110 49.3073"/>
        <path stroke="#53aaff" d="M23.6 84.6272 L78 69.9298"/>
        <path stroke="#6359e5" d="M17 98.3874 L101.6 75.5308"/>
        <path stroke="#bb64ed" d="M66.0219 97.12 L99.7781 88"/>
      </g>
      <rect x="34" y="13" width="53" height="94" rx="10" fill="none" stroke="#fff" stroke-width="2.5"/>
      <path d="M50 21 H71 M55 99 H66" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
    </g>
  </g>
</svg>
